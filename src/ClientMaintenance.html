<script>
function maintenanceFilters(prefix){return{dateFrom:el(prefix+'-dateFrom').value,dateTo:el(prefix+'-dateTo').value,gpId:el(prefix+'-gpId').value,assetClassId:el(prefix+'-assetClassId').value,capitalTypeId:el(prefix+'-capitalTypeId').value,status:el(prefix+'-status').value,limit:200}}

async function searchMeetingRecords(){clearStatus('meeting-search-status-box');try{const result=await serverCall('searchMeetingRecords',maintenanceFilters('meeting-search'));if(!result||!result.ok){showStatus('meeting-search-status-box','error',result&&result.error?result.error.message:'検索に失敗しました。');return}renderMeetingResults(result.records||[]);showStatus('meeting-search-status-box','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('meeting-search-status-box','error',error&&error.message?error.message:String(error))}}
function renderMeetingResults(records){const body=el('meeting-results-body');body.innerHTML='';records.forEach(record=>{const tr=document.createElement('tr');['date','gpName','assetClassName','status','updatedAt'].forEach(key=>{const td=document.createElement('td');td.textContent=key==='updatedAt'?formatDateTime(record[key]):String(record[key]||'');tr.appendChild(td)});const action=document.createElement('td');const button=document.createElement('button');button.className='table-action';button.type='button';button.textContent='開く';button.onclick=()=>openMeetingRecord(record.id);action.appendChild(button);tr.appendChild(action);body.appendChild(tr)});if(!records.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.className='empty-cell';td.textContent='該当する記録はありません。';tr.appendChild(td);body.appendChild(tr)}}
async function openMeetingRecord(meetingId){clearStatus('meeting-edit-status-box');try{const result=await serverCall('getMeetingRecord',meetingId);if(!result||!result.ok){showStatus('meeting-search-status-box','error',result&&result.error?result.error.message:'記録を取得できませんでした。');return}meetingEditRecord=result.record;applyMeetingEditRecord();el('meeting-edit-panel').classList.remove('hidden');el('meeting-edit-panel').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('meeting-search-status-box','error',error&&error.message?error.message:String(error))}}
function applyMeetingEditRecord(){const r=meetingEditRecord;if(!r)return;el('meeting-edit-title').textContent='面談記録を修正: '+r.id;el('meeting-edit-version').textContent='Version '+r.version+' / 更新 '+formatDateTime(r.updatedAt);['date','time','locationId','gpId','assetClassId','capitalTypeId','counterparty','internalParticipants','notes'].forEach(field=>{const node=el('meeting-edit-'+field);if(node)node.value=r[field]==null?'':String(r[field])});el('meeting-edit-doc-link').href=r.documentUrl||'#';el('meeting-status-toggle').textContent=r.status==='Active'?'無効化':'再有効化';el('meeting-status-toggle').dataset.nextStatus=r.status==='Active'?'Inactive':'Active'}
function meetingEditPayload(){return{meetingId:meetingEditRecord.id,expectedVersion:meetingEditRecord.version,date:el('meeting-edit-date').value,time:el('meeting-edit-time').value,locationId:el('meeting-edit-locationId').value,gpId:el('meeting-edit-gpId').value,assetClassId:el('meeting-edit-assetClassId').value,capitalTypeId:el('meeting-edit-capitalTypeId').value,counterparty:el('meeting-edit-counterparty').value,internalParticipants:el('meeting-edit-internalParticipants').value,notes:el('meeting-edit-notes').value}}
el('meeting-search-button').onclick=searchMeetingRecords;
el('meeting-edit-close').onclick=()=>{meetingEditRecord=null;el('meeting-edit-panel').classList.add('hidden');clearStatus('meeting-edit-status-box')};
el('meeting-edit-save').onclick=async()=>{if(!meetingEditRecord)return;const payload=meetingEditPayload();if(!payload.date||!payload.gpId||!payload.assetClassId){showStatus('meeting-edit-status-box','error','日付、GP、Asset Classは必須です。');return}el('meeting-edit-save').disabled=true;try{const result=await serverCall('updateMeetingRecord',payload);el('meeting-edit-save').disabled=false;if(!result||!result.ok){showStatus('meeting-edit-status-box','error',result&&result.error?result.error.message:'更新に失敗しました。');return}meetingEditRecord=result.record;applyMeetingEditRecord();showStatus('meeting-edit-status-box','success','修正を保存しました。');searchMeetingRecords()}catch(error){el('meeting-edit-save').disabled=false;showStatus('meeting-edit-status-box','error',error&&error.message?error.message:String(error))}};
el('meeting-status-toggle').onclick=async()=>{if(!meetingEditRecord)return;const nextStatus=el('meeting-status-toggle').dataset.nextStatus;if(!confirm(nextStatus==='Inactive'?'この面談記録を無効化しますか？':'この面談記録を再有効化しますか？'))return;try{const result=await serverCall('setMeetingRecordStatus',{meetingId:meetingEditRecord.id,expectedVersion:meetingEditRecord.version,status:nextStatus});if(!result||!result.ok){showStatus('meeting-edit-status-box','error',result&&result.error?result.error.message:'Status変更に失敗しました。');return}meetingEditRecord={...meetingEditRecord,...result.record};applyMeetingEditRecord();showStatus('meeting-edit-status-box','success',nextStatus==='Inactive'?'無効化しました。':'再有効化しました。');searchMeetingRecords()}catch(error){showStatus('meeting-edit-status-box','error',error&&error.message?error.message:String(error))}};

async function searchPitchbookRecords(){clearStatus('pitchbook-search-status-box');try{const result=await serverCall('searchPitchbookRecords',maintenanceFilters('pitchbook-search'));if(!result||!result.ok){showStatus('pitchbook-search-status-box','error',result&&result.error?result.error.message:'検索に失敗しました。');return}renderPitchbookResults(result.records||[]);showStatus('pitchbook-search-status-box','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('pitchbook-search-status-box','error',error&&error.message?error.message:String(error))}}
function renderPitchbookResults(records){const body=el('pitchbook-results-body');body.innerHTML='';records.forEach(record=>{const tr=document.createElement('tr');const values=[record.date,record.gpName,record.filename||record.originalFilename,record.status,formatDateTime(record.updatedAt)];values.forEach(value=>{const td=document.createElement('td');td.textContent=String(value||'');tr.appendChild(td)});const action=document.createElement('td');const button=document.createElement('button');button.className='table-action';button.type='button';button.textContent='開く';button.onclick=()=>openPitchbookRecord(record.documentId);action.appendChild(button);tr.appendChild(action);body.appendChild(tr)});if(!records.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.className='empty-cell';td.textContent='該当する資料はありません。';tr.appendChild(td);body.appendChild(tr)}}
async function openPitchbookRecord(documentId){clearStatus('pitchbook-edit-status-box');try{const result=await serverCall('getPitchbookRecord',documentId);if(!result||!result.ok){showStatus('pitchbook-search-status-box','error',result&&result.error?result.error.message:'資料を取得できませんでした。');return}pitchbookEditRecord=result.record;applyPitchbookEditRecord();el('pitchbook-edit-panel').classList.remove('hidden');el('pitchbook-edit-panel').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('pitchbook-search-status-box','error',error&&error.message?error.message:String(error))}}
function applyPitchbookEditRecord(){const r=pitchbookEditRecord;if(!r)return;el('pitchbook-edit-title').textContent='Pitchbookを修正: '+r.documentId;el('pitchbook-edit-token').textContent='Sequence '+r.sequenceNo+' / 更新 '+formatDateTime(r.updatedAt);['date','gpId','assetClassId','capitalTypeId'].forEach(field=>el('pitchbook-edit-'+field).value=r[field]==null?'':String(r[field]));el('pitchbook-edit-original').textContent=(r.originalFilename||'')+' → '+(r.filename||'');el('pitchbook-edit-file-link').href=r.fileUrl||'#';el('pitchbook-status-toggle').textContent=r.status==='Active'?'無効化':'再有効化';el('pitchbook-status-toggle').dataset.nextStatus=r.status==='Active'?'Inactive':'Active'}
el('pitchbook-search-button').onclick=searchPitchbookRecords;
el('pitchbook-edit-close').onclick=()=>{pitchbookEditRecord=null;el('pitchbook-edit-panel').classList.add('hidden');clearStatus('pitchbook-edit-status-box')};
el('pitchbook-edit-save').onclick=async()=>{if(!pitchbookEditRecord)return;const payload={documentId:pitchbookEditRecord.documentId,expectedUpdatedAt:pitchbookEditRecord.updatedAt,date:el('pitchbook-edit-date').value,gpId:el('pitchbook-edit-gpId').value,assetClassId:el('pitchbook-edit-assetClassId').value,capitalTypeId:el('pitchbook-edit-capitalTypeId').value};if(!payload.date||!payload.gpId||!payload.assetClassId){showStatus('pitchbook-edit-status-box','error','日付、GP、Asset Classは必須です。');return}el('pitchbook-edit-save').disabled=true;try{const result=await serverCall('updatePitchbookRecord',payload);el('pitchbook-edit-save').disabled=false;if(!result||!result.ok){showStatus('pitchbook-edit-status-box','error',result&&result.error?result.error.message:'更新に失敗しました。');return}pitchbookEditRecord=result.record;applyPitchbookEditRecord();showStatus('pitchbook-edit-status-box','success','修正を保存しました。');searchPitchbookRecords()}catch(error){el('pitchbook-edit-save').disabled=false;showStatus('pitchbook-edit-status-box','error',error&&error.message?error.message:String(error))}};
el('pitchbook-status-toggle').onclick=async()=>{if(!pitchbookEditRecord)return;const nextStatus=el('pitchbook-status-toggle').dataset.nextStatus;if(!confirm(nextStatus==='Inactive'?'この資料を無効化しますか？':'この資料を再有効化しますか？'))return;try{const result=await serverCall('setPitchbookRecordStatus',{documentId:pitchbookEditRecord.documentId,expectedUpdatedAt:pitchbookEditRecord.updatedAt,status:nextStatus});if(!result||!result.ok){showStatus('pitchbook-edit-status-box','error',result&&result.error?result.error.message:'Status変更に失敗しました。');return}pitchbookEditRecord={...pitchbookEditRecord,...result.record};applyPitchbookEditRecord();showStatus('pitchbook-edit-status-box','success',nextStatus==='Inactive'?'無効化しました。':'再有効化しました。');searchPitchbookRecords()}catch(error){showStatus('pitchbook-edit-status-box','error',error&&error.message?error.message:String(error))}};
</script>
