function refreshMeetingEditRelatedPitchbooks(preservedIds){const node=el('meeting-edit-relatedPitchbookIds');if(!node)return;const selected=new Set((preservedIds||selectedOptionValues('meeting-edit-relatedPitchbookIds')).map(String));const counterpartyId=el('meeting-edit-counterpartyId').value,asset=el('meeting-edit-assetClassId').value;const merged=[...meetingRelatedPitchbookCatalog,...meetingEditPreservedPitchbooks].filter((item,index,array)=>array.findIndex(candidate=>candidate.id===item.id)===index);node.innerHTML='';merged.filter(item=>selected.has(item.id)||(item.status==='Active'&&item.counterpartyId===counterpartyId&&item.assetClassId===asset)).sort((left,right)=>right.date.localeCompare(left.date)||left.id.localeCompare(right.id)).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=(item.date||'')+' / '+item.id+' / '+item.title+(item.status==='Inactive'?'（削除済み・既存リンク）':'');option.selected=selected.has(item.id);node.appendChild(option)})}

async function openMeetingEdit(meetingId,trigger){

async function changeMeetingRecordStatus(button){if(meetingStatusBusy)return;const target=button.dataset.target,id=button.dataset.meetingStatus,version=Number(button.dataset.version),clearsEdit=Boolean(meetingDetailRecord&&meetingDetailRecord.meetingId===id);if(target!=='Inactive'||!confirm('この記録を削除します。記録本体は完全には削除されず、管理者ページから復元できます。'+(clearsEdit&&meetingEditIsDirty()?' 未保存の面談編集内容も破棄されます。':'')))return;const focus=kspPastListFocusSnapshot('meeting-past-results',id,'data-meeting-status');meetingStatusBusy=true;kspSetActionBusy(button,true,'削除中…');kspSetRegionBusy(el('page-meeting-past'),true);showStatus('meeting-past-status','info busy','削除中…');try{const result=await serverCall('changeMeetingStatus',{meetingId:id,expectedVersion:version,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'削除に失敗しました。');if(meetingDetailRecord&&meetingDetailRecord.meetingId===id)resetMeetingDetailSelection(true);if(await searchMeetings())kspRestorePastListFocus('meeting-past-results',focus,'data-meeting-status','data-meeting-detail','meeting-past-search')}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}finally{meetingStatusBusy=false;kspSetRegionBusy(el('page-meeting-past'),false);if(button.isConnected)kspSetActionBusy(button,false)}}

function isMasterOptionTab(tab){return MASTER_OPTION_TAB_TYPES.includes(tab)}
function saveMasterOptionDraft(tab){if(isMasterOptionTab(tab))masterOptionDrafts[tab]=String(el('option-add-name').value||'')}
function masterOptionRows(masters,type){return(masters&&masters.options||[]).filter(row=>row.type===type).slice().sort((left,right)=>Number(left.sortOrder||0)-Number(right.sortOrder||0)||String(left.id).localeCompare(String(right.id)))}
function masterCanonicalOrderIds(masters,type){return masterOptionRows(masters,type).map(row=>row.id)}
function masterEnsureOrderDraft(type,masters){if(!isMasterOptionTab(type))return null;if(!masterOrderDrafts[type]){const ids=masterCanonicalOrderIds(masters,type);masterOrderDrafts[type]={baseIds:ids.slice(),orderedIds:ids.slice()}}return masterOrderDrafts[type]}
function masterOrderDirty(type){const draft=masterOrderDrafts[type];return Boolean(draft&&(draft.baseIds.length!==draft.orderedIds.length||draft.baseIds.some((id,index)=>id!==draft.orderedIds[index])))}
function masterAnyOrderDirty(){return MASTER_OPTION_TAB_TYPES.some(masterOrderDirty)}
function masterResetOrderDraft(type,masters){if(!isMasterOptionTab(type))return;const ids=masterCanonicalOrderIds(masters,type);masterOrderDrafts[type]={baseIds:ids.slice(),orderedIds:ids.slice()}}
function masterResetAllOrderDrafts(masters){MASTER_OPTION_TAB_TYPES.forEach(type=>masterResetOrderDraft(type,masters))}
