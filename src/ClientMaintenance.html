<script>

function readMeetingEditIdentity(){const idNode=el('meeting-edit-meetingId'),versionNode=el('meeting-edit-expectedVersion');return{meetingId:idNode&&idNode.value?String(idNode.value):meetingEditIdentity.meetingId,expectedVersion:versionNode&&versionNode.value?Number(versionNode.value):meetingEditIdentity.expectedVersion}}

function populateCounterpartyTypeSelect(id,types){const node=el(id);if(!node)return;const current=node.value;node.innerHTML='<option value="">未選択</option>';(types||[]).forEach(item=>{const option=document.createElement('option');option.value=item.code;option.textContent=item.label;node.appendChild(option)});node.value=current}

function refreshMeetingEditRelatedPitchbooks(preservedIds){const node=el('meeting-edit-relatedPitchbookIds');if(!node)return;const selected=new Set((preservedIds||selectedOptionValues('meeting-edit-relatedPitchbookIds')).map(String));const counterpartyId=el('meeting-edit-counterpartyId').value,asset=el('meeting-edit-assetClassId').value;const merged=[...meetingRelatedPitchbookCatalog,...meetingEditPreservedPitchbooks].filter((item,index,array)=>array.findIndex(candidate=>candidate.id===item.id)===index);node.innerHTML='';merged.filter(item=>selected.has(item.id)||(item.status==='Active'&&item.counterpartyId===counterpartyId&&item.assetClassId===asset)).sort((left,right)=>right.date.localeCompare(left.date)||left.id.localeCompare(right.id)).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=(item.date||'')+' / '+item.id+' / '+item.title+(item.status==='Inactive'?'（Inactive・既存リンク）':'');option.selected=selected.has(item.id);node.appendChild(option)})}

function renderMeetingResults(records){el('meeting-past-results').innerHTML=records.map(record=>'<tr><td>'+escapeHtml(record.date)+(record.time?'<br><span class="hint">'+escapeHtml(record.time)+'</span>':'')+'</td><td>'+escapeHtml(record.counterpartyEntityName||record.gpName)+(record.teamName?'<br><span class="hint">チーム: '+escapeHtml(record.teamName)+'</span>':'')+'</td><td>'+escapeHtml(record.assetClassName)+(record.fundStrategy?'<br><span class="hint">'+escapeHtml(record.fundStrategy)+'</span>':'')+(record.meetingTypeLabels&&record.meetingTypeLabels.length?'<br><span class="hint">'+escapeHtml(record.meetingTypeLabels.join(' / '))+'</span>':'')+(record.relatedPitchbookIds&&record.relatedPitchbookIds.length?'<br><span class="hint">Pitchbook: '+escapeHtml(record.relatedPitchbookIds.join(', '))+'</span>':'')+'</td><td><span class="badge '+escapeHtml(record.status)+'">'+escapeHtml(record.status)+'</span></td><td>'+escapeHtml(record.version)+'</td><td><div class="row-actions"><button class="small-button" data-meeting-detail="'+escapeHtml(record.meetingId)+'">詳細</button>'+(record.documentUrl?'<a class="small-link" href="'+escapeHtml(record.documentUrl)+'" target="_blank" rel="noopener">Doc</a>':'')+(record.status==='Active'?'<button class="small-button" data-meeting-status="'+escapeHtml(record.meetingId)+'" data-version="'+escapeHtml(record.version)+'" data-target="Inactive">削除</button>':'')+'</div></td></tr>').join('')||'<tr><td colspan="6" class="empty-cell">該当なし</td></tr>'}
async function openMeetingEdit(meetingId,trigger){if(meetingEditBusy)return;meetingEditBusy=true;setMeetingEditEnabled(false);el('meeting-edit-card').setAttribute('aria-busy','true');if(trigger)trigger.disabled=true;showStatus('meeting-edit-status','info busy','編集内容を読み込んでいます…');try{const result=await serverCall('getMeetingMaintenanceRecord',meetingId);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');const r=result.record;if(r.teamId&&![...el('meeting-edit-teamId').options].some(option=>option.value===r.teamId)){const currentTeam=(maintenanceBootstrap.options.teams||[]).find(team=>team.id===r.teamId);if(currentTeam){const option=document.createElement('option');option.value=currentTeam.id;option.textContent=currentTeam.name+'（Inactive・現在値）';el('meeting-edit-teamId').appendChild(option)}}el('meeting-edit-id').textContent=r.meetingId+' / Version '+r.version;populateCounterpartyEntitySelect('meeting-edit-counterpartyId','',maintenanceBootstrap.options.counterpartyEntities,r.counterpartyId);['date','time','locationId','assetClassId','capitalTypeId','teamId','fundStrategy','followUpNote','counterparty','internalParticipants','notes'].forEach(field=>{el('meeting-edit-'+field).value=r[field]||''});setMeetingTypeValues('meeting-edit',r.meetingTypeCodes);el('meeting-edit-followUpRequired').checked=Boolean(r.followUpRequired);meetingEditPreservedPitchbooks=r.relatedPitchbooks||[];refreshMeetingEditRelatedPitchbooks(r.relatedPitchbookIds||[]);setMeetingEditIdentity(r);setMeetingEditEnabled(true);clearStatus('meeting-edit-status');el('meeting-edit-card').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('meeting-edit-status','error',error.message||String(error))}finally{meetingEditBusy=false;el('meeting-edit-card').setAttribute('aria-busy','false');if(trigger&&trigger.isConnected)trigger.disabled=false}}

async function changeMeetingRecordStatus(button){if(meetingStatusBusy)return;const target=button.dataset.target,id=button.dataset.meetingStatus,version=Number(button.dataset.version);if(target!=='Inactive'||!confirm('この記録を削除します。記録本体は完全には削除されず、管理者ページから復元できます。'))return;meetingStatusBusy=true;button.disabled=true;showStatus('meeting-past-status','info busy','削除中…');try{const result=await serverCall('changeMeetingStatus',{meetingId:id,expectedVersion:version,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'削除に失敗しました。');if(meetingDetailRecord&&meetingDetailRecord.meetingId===id)resetMeetingDetailSelection();await searchMeetings()}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}finally{meetingStatusBusy=false;if(button.isConnected)button.disabled=false}}

function clearMeetingPastFilters(){['meeting-past-counterpartyId','meeting-past-assetClassId','meeting-past-teamId'].forEach(id=>{el(id).value=''});document.querySelectorAll('[data-meeting-type-filter="meeting-past"]').forEach(node=>{node.checked=false});el('meeting-past-fundStrategy').value='';el('meeting-past-filterStatus').value='Active';kspSetDefaultDateRange('meeting-past-dateFrom','meeting-past-dateTo');clearStatus('meeting-past-status')}
el('meeting-past-search').onclick=searchMeetings;el('meeting-past-clear').onclick=clearMeetingPastFilters;el('meeting-edit-close').onclick=resetMeetingEditState;
el('meeting-edit-form').addEventListener('submit',async event=>{event.preventDefault();if(meetingEditBusy)return;const identity=readMeetingEditIdentity();if(!identity.meetingId)return;const payload={meetingId:identity.meetingId,expectedVersion:identity.expectedVersion,date:el('meeting-edit-date').value,time:el('meeting-edit-time').value,locationId:el('meeting-edit-locationId').value,counterpartyId:el('meeting-edit-counterpartyId').value,assetClassId:el('meeting-edit-assetClassId').value,capitalTypeId:el('meeting-edit-capitalTypeId').value,teamId:el('meeting-edit-teamId').value,fundStrategy:el('meeting-edit-fundStrategy').value,meetingTypeCodes:meetingTypeValues('meeting-edit'),relatedPitchbookIds:selectedOptionValues('meeting-edit-relatedPitchbookIds'),followUpRequired:el('meeting-edit-followUpRequired').checked,followUpNote:el('meeting-edit-followUpNote').value,counterparty:el('meeting-edit-counterparty').value,internalParticipants:el('meeting-edit-internalParticipants').value,notes:el('meeting-edit-notes').value};meetingEditBusy=true;el('meeting-edit-card').setAttribute('aria-busy','true');el('meeting-edit-fieldset').disabled=true;showStatus('meeting-edit-status','info busy','保存中…');try{const result=await serverCall('updateMeetingMaintenance',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'更新に失敗しました。');setMeetingEditIdentity(result.record);el('meeting-edit-id').textContent=result.record.meetingId+' / Version '+result.record.version;showStatus('meeting-edit-status','success','更新しました。');await searchMeetings()}catch(error){showStatus('meeting-edit-status','error',error.message||String(error))}finally{meetingEditBusy=false;el('meeting-edit-card').setAttribute('aria-busy','false');if(readMeetingEditIdentity().meetingId)el('meeting-edit-fieldset').disabled=false}});

async function searchPitchbooks(){clearStatus('pitchbook-past-status');try{const result=await serverCall('searchPitchbookRecords',maintenanceSearchPayload('pitchbook-past'));if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'検索に失敗しました。');renderPitchbookResults(result.records||[]);showStatus('pitchbook-past-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
function renderPitchbookResults(records){el('pitchbook-past-results').innerHTML=records.map(record=>{const editable=Boolean(record.fileId);const statusAction=record.status==='Active'?'<button class="small-button" data-pitchbook-status="'+escapeHtml(record.documentId)+'" data-updated="'+escapeHtml(record.updatedAt)+'" data-target="Inactive">無効化</button>':(record.status==='Inactive'&&record.fileId?'<button class="small-button" data-pitchbook-status="'+escapeHtml(record.documentId)+'" data-updated="'+escapeHtml(record.updatedAt)+'" data-target="Active">再有効化</button>':'');return '<tr><td>'+escapeHtml(record.date)+'</td><td>'+escapeHtml(record.counterpartyName)+'</td><td>'+escapeHtml(record.assetClassName)+(record.fundStrategy?'<br><span class="hint">'+escapeHtml(record.fundStrategy)+'</span>':'')+'</td><td><span class="file-name">'+escapeHtml(record.savedFilename||record.originalFilename)+'</span></td><td><span class="badge '+escapeHtml(record.status)+'">'+escapeHtml(record.status)+'</span></td><td class="row-actions">'+(editable?'<button class="small-button" data-pitchbook-edit="'+escapeHtml(record.documentId)+'">編集</button>':'')+(record.fileUrl?'<a class="small-link" href="'+escapeHtml(record.fileUrl)+'" target="_blank" rel="noopener">開く</a>':'')+statusAction+(!editable&&record.status!=='Inactive'?'<span class="hint">登録画面で再試行</span>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty-cell">該当なし</td></tr>'}
async function openPitchbookEdit(documentId){try{const result=await serverCall('getPitchbookMaintenanceRecord',documentId);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');const r=result.record;el('pitchbook-edit-documentId').value=r.documentId;el('pitchbook-edit-expectedUpdatedAt').value=r.updatedAt;el('pitchbook-edit-id').textContent=r.documentId+' / '+r.savedFilename;['date','counterpartyId','assetClassId','capitalTypeId','fundStrategy'].forEach(field=>{el('pitchbook-edit-'+field).value=r[field]||''});el('pitchbook-edit-card').classList.remove('hidden-panel');el('pitchbook-edit-card').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
async function changePitchbookRecordStatus(button){const target=button.dataset.target,id=button.dataset.pitchbookStatus,updated=button.dataset.updated;if(!confirm((target==='Inactive'?'無効化':'再有効化')+'しますか？'))return;try{const result=await serverCall('changePitchbookStatus',{documentId:id,expectedUpdatedAt:updated,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Status変更に失敗しました。');await searchPitchbooks()}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}

el('pitchbook-past-search').onclick=searchPitchbooks;el('pitchbook-edit-close').onclick=()=>el('pitchbook-edit-card').classList.add('hidden-panel');
el('pitchbook-edit-form').addEventListener('submit',async event=>{event.preventDefault();clearStatus('pitchbook-edit-status');const payload={documentId:el('pitchbook-edit-documentId').value,expectedUpdatedAt:el('pitchbook-edit-expectedUpdatedAt').value,date:el('pitchbook-edit-date').value,counterpartyId:el('pitchbook-edit-counterpartyId').value,assetClassId:el('pitchbook-edit-assetClassId').value,capitalTypeId:el('pitchbook-edit-capitalTypeId').value,fundStrategy:el('pitchbook-edit-fundStrategy').value};try{const result=await serverCall('updatePitchbookMaintenance',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'更新に失敗しました。');el('pitchbook-edit-expectedUpdatedAt').value=result.record.updatedAt;el('pitchbook-edit-id').textContent=result.record.documentId+' / '+result.record.savedFilename;showStatus('pitchbook-edit-status','success','更新しました。');if(meetingDetailRecord)await openMeetingDetail(meetingDetailRecord.meetingId)}catch(error){showStatus('pitchbook-edit-status','error',error.message||String(error))}});

function isMasterOptionTab(tab){return MASTER_OPTION_TAB_TYPES.includes(tab)}
function saveMasterOptionDraft(tab){if(isMasterOptionTab(tab))masterOptionDrafts[tab]=String(el('option-add-name').value||'')}
function masterOptionRows(masters,type){return(masters&&masters.options||[]).filter(row=>row.type===type).slice().sort((left,right)=>Number(left.sortOrder||0)-Number(right.sortOrder||0)||String(left.id).localeCompare(String(right.id)))}
function masterCanonicalOrderIds(masters,type){return masterOptionRows(masters,type).map(row=>row.id)}
function masterEnsureOrderDraft(type,masters){if(!isMasterOptionTab(type))return null;if(!masterOrderDrafts[type]){const ids=masterCanonicalOrderIds(masters,type);masterOrderDrafts[type]={baseIds:ids.slice(),orderedIds:ids.slice()}}return masterOrderDrafts[type]}
function masterOrderDirty(type){const draft=masterOrderDrafts[type];return Boolean(draft&&(draft.baseIds.length!==draft.orderedIds.length||draft.baseIds.some((id,index)=>id!==draft.orderedIds[index])))}
function masterAnyOrderDirty(){return MASTER_OPTION_TAB_TYPES.some(masterOrderDirty)}
function masterResetOrderDraft(type,masters){if(!isMasterOptionTab(type))return;const ids=masterCanonicalOrderIds(masters,type);masterOrderDrafts[type]={baseIds:ids.slice(),orderedIds:ids.slice()}}
function masterResetAllOrderDrafts(masters){MASTER_OPTION_TAB_TYPES.forEach(type=>masterResetOrderDraft(type,masters))}
function masterDisplayedOptionRows(masters,type){const canonical=masterOptionRows(masters,type),draft=masterEnsureOrderDraft(type,masters);if(!draft)return canonical;const byId=new Map(canonical.map(row=>[row.id,row]));const rows=draft.orderedIds.map(id=>byId.get(id)).filter(Boolean),known=new Set(rows.map(row=>row.id));canonical.forEach(row=>{if(!known.has(row.id))rows.push(row)});return rows.map((row,index)=>Object.assign({},row,{sortOrder:index+1}))}
function renderMasterOptionRows(rows){
  const mutationsDisabled=masterReorderBusy||masterOrderDirty(activeMasterTab);
  el('option-master-results').innerHTML=rows.map((row,index)=>'<tr class="master-sort-row" data-master-option-id="'+escapeHtml(row.id)+'" data-master-option-type="'+escapeHtml(row.type)+'" data-master-sort-index="'+index+'"><td class="master-drag-cell"><button class="master-drag-handle" type="button" draggable="true" aria-grabbed="false" aria-label="'+escapeHtml(row.name)+'を並び替え"'+(masterReorderBusy?' disabled':'')+'>⋮⋮</button></td><td><span class="master-option-name">'+escapeHtml(row.name)+'</span></td><td><span class="badge '+escapeHtml(row.status)+'">'+escapeHtml(row.status)+'</span></td><td><div class="row-actions"><button class="small-button" data-master-rename="OPTION" data-id="'+escapeHtml(row.id)+'" data-name="'+escapeHtml(row.name)+'"'+(mutationsDisabled?' disabled':'')+'>名称変更</button><button class="small-button" data-master-status="OPTION" data-id="'+escapeHtml(row.id)+'" data-target="'+(row.status==='Active'?'DEACTIVATE':'REACTIVATE')+'"'+(mutationsDisabled?' disabled':'')+'>'+(row.status==='Active'?'無効化':'再有効化')+'</button></div></td></tr>').join('')||'<tr><td colspan="4" class="empty-cell">該当なし</td></tr>';
}
function renderMasters(masters,options){if(!(options&&options.skipDraftCapture))saveMasterOptionDraft(activeMasterTab);maintenanceBootstrap=maintenanceBootstrap||{};maintenanceBootstrap.masters=masters;el('counterparty-master-results').innerHTML=(masters.counterparties||[]).map(row=>'<tr><td>'+escapeHtml(row.type)+'</td><td>'+escapeHtml(row.name)+'</td><td><span class="badge '+escapeHtml(row.status)+'">'+escapeHtml(row.status)+'</span></td><td><div class="row-actions"><button class="small-button" data-master-rename="COUNTERPARTY" data-id="'+escapeHtml(row.id)+'" data-name="'+escapeHtml(row.name)+'">名称変更</button><button class="small-button" data-master-status="COUNTERPARTY" data-id="'+escapeHtml(row.id)+'" data-target="'+(row.status==='Active'?'DEACTIVATE':'REACTIVATE')+'">'+(row.status==='Active'?'無効化':'再有効化')+'</button></div></td></tr>').join('');renderMasterOptionRows(masterDisplayedOptionRows(masters,activeMasterTab));renderMasterTab()}
function renderMasterTab(){const counterparty=activeMasterTab==='COUNTERPARTY',nameInput=el('option-add-name'),dirty=masterOrderDirty(activeMasterTab);el('counterparty-master-panel').hidden=!counterparty;el('option-master-panel').hidden=counterparty;if(counterparty){nameInput.value=''}else{el('option-master-heading').textContent=MASTER_TAB_LABELS[activeMasterTab];nameInput.placeholder=MASTER_TAB_LABELS[activeMasterTab]+'名';nameInput.value=masterOptionDrafts[activeMasterTab];nameInput.disabled=dirty||masterReorderBusy;const submit=el('option-add-form').querySelector('button[type="submit"]');if(submit)submit.disabled=dirty||masterReorderBusy||Boolean(masterOptionAddRequest);el('master-reorder-save').disabled=!dirty||masterReorderBusy;el('master-reorder-reset').disabled=!dirty||masterReorderBusy;el('master-reorder-dirty').textContent=dirty?'並び順に未保存の変更があります。':''}document.querySelectorAll('[data-master-tab]').forEach(button=>{const selected=button.dataset.masterTab===activeMasterTab;button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected));button.disabled=masterReorderBusy})}
function selectMasterTab(tab){if(masterReorderBusy||!Object.prototype.hasOwnProperty.call(MASTER_TAB_LABELS,tab))return;saveMasterOptionDraft(activeMasterTab);activeMasterTab=tab;renderMasters(maintenanceBootstrap&&maintenanceBootstrap.masters||{counterparties:[],options:[]},{skipDraftCapture:true})}
function masterDropIndex(sourceIndex,hoverIndex,after,length){let target=hoverIndex+(after?1:0);if(sourceIndex<target)target-=1;return Math.max(0,Math.min(target,Math.max(0,length-1)))}
function masterDraftMove(type,id,targetIndex){const draft=masterEnsureOrderDraft(type,maintenanceBootstrap&&maintenanceBootstrap.masters),sourceIndex=draft.orderedIds.indexOf(id);if(sourceIndex<0)return;const ids=draft.orderedIds.slice(),moved=ids.splice(sourceIndex,1)[0];ids.splice(Math.max(0,Math.min(targetIndex,ids.length)),0,moved);draft.orderedIds=ids}
function clearMasterDropIndicators(){document.querySelectorAll('.master-sort-row').forEach(row=>{row.classList.remove('master-sort-row--dragging','master-drop-before','master-drop-after')});document.querySelectorAll('.master-drag-handle').forEach(handle=>handle.setAttribute('aria-grabbed','false'))}
async function saveMasterReorder(){const type=activeMasterTab,draft=masterOrderDrafts[type];if(masterReorderBusy||!isMasterOptionTab(type)||!masterOrderDirty(type)||!draft)return;masterReorderBusy=true;renderMasters(maintenanceBootstrap.masters,{skipDraftCapture:true});showStatus('masters-status','info busy','並び順を保存中…');try{const result=await serverCall('mutateMaster',{entity:'OPTION',action:'REORDER_BATCH',type,expectedOrderIds:draft.baseIds.slice(),orderedIds:draft.orderedIds.slice()});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'並び順を保存できませんでした。');maintenanceBootstrap.masters=result.masters;masterResetOrderDraft(type,result.masters);populateSharedOptions(optionsFromMasters(result.masters,true));populateMaintenanceSelects(optionsFromMasters(result.masters,false));showStatus('masters-status','success','並び順を更新しました。')}catch(error){showStatus('masters-status','error',error.message||String(error))}finally{masterReorderBusy=false;renderMasters(maintenanceBootstrap.masters,{skipDraftCapture:true})}}
function optionsFromMasters(masters,activeOnly){return maintenanceOptionSets(masters,activeOnly)}
async function performMasterMutation(payload){clearStatus('masters-status');const result=await serverCall('mutateMaster',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Master変更に失敗しました。');renderMasters(result.masters);populateSharedOptions(optionsFromMasters(result.masters,true));populateMaintenanceSelects(optionsFromMasters(result.masters,false));showStatus('masters-status','success','Masterを更新しました。')}
el('option-add-name').addEventListener('input',()=>saveMasterOptionDraft(activeMasterTab));
el('option-add-form').addEventListener('submit',async event=>{event.preventDefault();const type=activeMasterTab;if(!isMasterOptionTab(type)){showStatus('masters-status','error','追加対象のカテゴリを選択してください。');return}if(masterOrderDirty(type)){showStatus('masters-status','error','並び順を保存または元に戻してから追加してください。');return}saveMasterOptionDraft(type);const name=masterOptionDrafts[type];if(masterOptionAddRequest){showStatus('masters-status','info','選択肢を登録中です。完了後にもう一度お試しください。');return}const request={id:++masterOptionAddSequence,type,name};masterOptionAddRequest=request;const submitButton=event.currentTarget&&event.currentTarget.querySelector?event.currentTarget.querySelector('button[type="submit"]'):null;if(submitButton)submitButton.disabled=true;try{await performMasterMutation({entity:'OPTION',action:'ADD',type:request.type,name:request.name});masterResetOrderDraft(request.type,maintenanceBootstrap.masters);if(masterOptionDrafts[request.type]===request.name)masterOptionDrafts[request.type]='';if(activeMasterTab===request.type)el('option-add-name').value=masterOptionDrafts[request.type]}catch(error){showStatus('masters-status','error',MASTER_TAB_LABELS[request.type]+'の追加に失敗しました: '+(error.message||String(error)))}finally{if(masterOptionAddRequest&&masterOptionAddRequest.id===request.id)masterOptionAddRequest=null;if(submitButton)submitButton.disabled=false;if(isMasterOptionTab(activeMasterTab))el('option-add-name').value=masterOptionDrafts[activeMasterTab];renderMasters(maintenanceBootstrap.masters,{skipDraftCapture:true})}});
function masterClickHandler(event){const rename=event.target.closest('[data-master-rename]'),status=event.target.closest('[data-master-status]');(async()=>{try{if(rename){const name=prompt('新しい名称',rename.dataset.name);if(name===null)return;await performMasterMutation({entity:rename.dataset.masterRename,action:'RENAME',id:rename.dataset.id,name})}else if(status){if(!confirm((status.dataset.target==='DEACTIVATE'?'無効化':'再有効化')+'しますか？'))return;await performMasterMutation({entity:status.dataset.masterStatus,action:status.dataset.target,id:status.dataset.id})}}catch(error){showStatus('masters-status','error',error.message||String(error))}})()}
el('counterparty-master-results').addEventListener('click',masterClickHandler);el('option-master-results').addEventListener('click',masterClickHandler);
el('option-master-results').addEventListener('dragstart',event=>{const handle=event.target.closest('.master-drag-handle'),row=handle&&handle.closest('.master-sort-row');if(!handle||!row||masterReorderBusy||row.dataset.masterOptionType!==activeMasterTab){event.preventDefault();return}const rows=masterDisplayedOptionRows(maintenanceBootstrap&&maintenanceBootstrap.masters||{counterparties:[],options:[]},activeMasterTab);masterReorderState={id:row.dataset.masterOptionId,type:row.dataset.masterOptionType,sourceIndex:Number(row.dataset.masterSortIndex),targetIndex:Number(row.dataset.masterSortIndex),length:rows.length};row.classList.add('master-sort-row--dragging');handle.setAttribute('aria-grabbed','true');if(event.dataTransfer){event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',masterReorderState.id)}});
el('option-master-results').addEventListener('dragover',event=>{const row=event.target.closest('.master-sort-row');if(!row||!masterReorderState||row.dataset.masterOptionType!==masterReorderState.type)return;event.preventDefault();const rect=row.getBoundingClientRect(),after=event.clientY>=rect.top+rect.height/2;clearMasterDropIndicators();row.classList.add(after?'master-drop-after':'master-drop-before');masterReorderState.targetIndex=masterDropIndex(masterReorderState.sourceIndex,Number(row.dataset.masterSortIndex),after,masterReorderState.length)});
el('option-master-results').addEventListener('drop',event=>{if(!masterReorderState)return;event.preventDefault();const state=masterReorderState;masterReorderState=null;clearMasterDropIndicators();if(state.targetIndex!==state.sourceIndex){masterDraftMove(state.type,state.id,state.targetIndex);renderMasters(maintenanceBootstrap.masters,{skipDraftCapture:true})}});
el('option-master-results').addEventListener('dragend',()=>{masterReorderState=null;clearMasterDropIndicators()});
document.querySelectorAll('[data-master-tab]').forEach(button=>button.addEventListener('click',()=>selectMasterTab(button.dataset.masterTab)));
el('master-reorder-save').onclick=saveMasterReorder;
el('master-reorder-reset').onclick=()=>{if(!isMasterOptionTab(activeMasterTab)||masterReorderBusy)return;masterResetOrderDraft(activeMasterTab,maintenanceBootstrap.masters);renderMasters(maintenanceBootstrap.masters,{skipDraftCapture:true});showStatus('masters-status','info','未保存の並び順を元に戻しました。')};
el('masters-refresh').onclick=async()=>{if(masterAnyOrderDirty()&&!confirm('未保存の並び順を破棄して再読込しますか？'))return;try{const result=await serverCall('getPhase1MaintenanceBootstrapData');if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');masterResetAllOrderDrafts(result.masters||{counterparties:[],options:[]});bootstrapMaintenance(result);showStatus('masters-status','info','再読込しました。')}catch(error){showStatus('masters-status','error',error.message||String(error))}};
</script>
