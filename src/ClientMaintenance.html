<script>
let maintenanceBootstrap=null;
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function maintenanceSearchPayload(prefix){return{dateFrom:el(prefix+'-dateFrom').value,dateTo:el(prefix+'-dateTo').value,gpId:el(prefix+'-gpId').value,assetClassId:el(prefix+'-assetClassId').value,capitalTypeId:el(prefix+'-capitalTypeId').value,status:el(prefix+'-filterStatus').value,limit:100}}
function populateMaintenanceSelects(options){
  ['meeting-past','pitchbook-past'].forEach(prefix=>{addOptions(prefix+'-gpId',options.gps);addOptions(prefix+'-assetClassId',options.assetClasses);addOptions(prefix+'-capitalTypeId',options.capitalTypes)});
  ['meeting-edit'].forEach(prefix=>{addOptions(prefix+'-gpId',options.gps);addOptions(prefix+'-assetClassId',options.assetClasses);addOptions(prefix+'-capitalTypeId',options.capitalTypes);addOptions(prefix+'-locationId',options.locations)});
  ['pitchbook-edit'].forEach(prefix=>{addOptions(prefix+'-gpId',options.gps);addOptions(prefix+'-assetClassId',options.assetClasses);addOptions(prefix+'-capitalTypeId',options.capitalTypes)});
}
function bootstrapMaintenance(result){if(!result||!result.ok){showStatus('masters-status','error',result&&result.error?result.error.message:'保守機能を読み込めませんでした。');return}maintenanceBootstrap=result;populateMaintenanceSelects(result.options||{});renderMasters(result.masters||{gps:[],options:[]})}

async function searchMeetings(){clearStatus('meeting-past-status');try{const result=await serverCall('searchMeetingRecords',maintenanceSearchPayload('meeting-past'));if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'検索に失敗しました。');renderMeetingResults(result.records||[]);showStatus('meeting-past-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}}
function renderMeetingResults(records){el('meeting-past-results').innerHTML=records.map(record=>'<tr><td>'+escapeHtml(record.date)+(record.time?'<br><span class="hint">'+escapeHtml(record.time)+'</span>':'')+'</td><td>'+escapeHtml(record.gpName)+'</td><td>'+escapeHtml(record.assetClassName)+'</td><td><span class="badge '+escapeHtml(record.status)+'">'+escapeHtml(record.status)+'</span></td><td>'+escapeHtml(record.version)+'</td><td class="row-actions"><button class="small-button" data-meeting-edit="'+escapeHtml(record.meetingId)+'">編集</button>'+(record.documentUrl?'<a class="small-link" href="'+escapeHtml(record.documentUrl)+'" target="_blank" rel="noopener">Doc</a>':'')+'<button class="small-button" data-meeting-status="'+escapeHtml(record.meetingId)+'" data-version="'+escapeHtml(record.version)+'" data-target="'+(record.status==='Active'?'Inactive':'Active')+'">'+(record.status==='Active'?'無効化':'再有効化')+'</button></td></tr>').join('')||'<tr><td colspan="6" class="empty-cell">該当なし</td></tr>'}
async function openMeetingEdit(meetingId){clearStatus('meeting-edit-status');try{const result=await serverCall('getMeetingMaintenanceRecord',meetingId);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');const r=result.record;el('meeting-edit-meetingId').value=r.meetingId;el('meeting-edit-expectedVersion').value=r.version;el('meeting-edit-id').textContent=r.meetingId+' / Version '+r.version;['date','time','locationId','gpId','assetClassId','capitalTypeId','counterparty','internalParticipants','notes'].forEach(field=>{el('meeting-edit-'+field).value=r[field]||''});el('meeting-edit-card').classList.remove('hidden-panel');el('meeting-edit-card').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}}
async function changeMeetingRecordStatus(button){const target=button.dataset.target,id=button.dataset.meetingStatus,version=Number(button.dataset.version);if(!confirm((target==='Inactive'?'無効化':'再有効化')+'しますか？'))return;try{const result=await serverCall('changeMeetingStatus',{meetingId:id,expectedVersion:version,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Status変更に失敗しました。');await searchMeetings()}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}}
el('meeting-past-results').addEventListener('click',event=>{const edit=event.target.closest('[data-meeting-edit]');if(edit)openMeetingEdit(edit.dataset.meetingEdit);const status=event.target.closest('[data-meeting-status]');if(status)changeMeetingRecordStatus(status)});
el('meeting-past-search').onclick=searchMeetings;el('meeting-edit-close').onclick=()=>el('meeting-edit-card').classList.add('hidden-panel');
el('meeting-edit-form').addEventListener('submit',async event=>{event.preventDefault();clearStatus('meeting-edit-status');const payload={meetingId:el('meeting-edit-meetingId').value,expectedVersion:Number(el('meeting-edit-expectedVersion').value),date:el('meeting-edit-date').value,time:el('meeting-edit-time').value,locationId:el('meeting-edit-locationId').value,gpId:el('meeting-edit-gpId').value,assetClassId:el('meeting-edit-assetClassId').value,capitalTypeId:el('meeting-edit-capitalTypeId').value,counterparty:el('meeting-edit-counterparty').value,internalParticipants:el('meeting-edit-internalParticipants').value,notes:el('meeting-edit-notes').value};try{const result=await serverCall('updateMeetingMaintenance',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'更新に失敗しました。');el('meeting-edit-expectedVersion').value=result.record.version;el('meeting-edit-id').textContent=result.record.meetingId+' / Version '+result.record.version;showStatus('meeting-edit-status','success','更新しました。');await searchMeetings()}catch(error){showStatus('meeting-edit-status','error',error.message||String(error))}});

async function searchPitchbooks(){clearStatus('pitchbook-past-status');try{const result=await serverCall('searchPitchbookRecords',maintenanceSearchPayload('pitchbook-past'));if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'検索に失敗しました。');renderPitchbookResults(result.records||[]);showStatus('pitchbook-past-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
function renderPitchbookResults(records){el('pitchbook-past-results').innerHTML=records.map(record=>{const editable=Boolean(record.fileId);const statusAction=record.status==='Active'?'<button class="small-button" data-pitchbook-status="'+escapeHtml(record.documentId)+'" data-updated="'+escapeHtml(record.updatedAt)+'" data-target="Inactive">無効化</button>':(record.status==='Inactive'&&record.fileId?'<button class="small-button" data-pitchbook-status="'+escapeHtml(record.documentId)+'" data-updated="'+escapeHtml(record.updatedAt)+'" data-target="Active">再有効化</button>':'');return '<tr><td>'+escapeHtml(record.date)+'</td><td>'+escapeHtml(record.gpName)+'</td><td>'+escapeHtml(record.assetClassName)+'</td><td><span class="file-name">'+escapeHtml(record.savedFilename||record.originalFilename)+'</span></td><td><span class="badge '+escapeHtml(record.status)+'">'+escapeHtml(record.status)+'</span></td><td class="row-actions">'+(editable?'<button class="small-button" data-pitchbook-edit="'+escapeHtml(record.documentId)+'">編集</button>':'')+(record.fileUrl?'<a class="small-link" href="'+escapeHtml(record.fileUrl)+'" target="_blank" rel="noopener">開く</a>':'')+statusAction+(!editable&&record.status!=='Inactive'?'<span class="hint">登録画面で再試行</span>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty-cell">該当なし</td></tr>'}
async function openPitchbookEdit(documentId){try{const result=await serverCall('getPitchbookMaintenanceRecord',documentId);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');const r=result.record;el('pitchbook-edit-documentId').value=r.documentId;el('pitchbook-edit-expectedUpdatedAt').value=r.updatedAt;el('pitchbook-edit-id').textContent=r.documentId+' / '+r.savedFilename;['date','gpId','assetClassId','capitalTypeId'].forEach(field=>{el('pitchbook-edit-'+field).value=r[field]||''});el('pitchbook-edit-card').classList.remove('hidden-panel');el('pitchbook-edit-card').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
async function changePitchbookRecordStatus(button){const target=button.dataset.target,id=button.dataset.pitchbookStatus,updated=button.dataset.updated;if(!confirm((target==='Inactive'?'無効化':'再有効化')+'しますか？'))return;try{const result=await serverCall('changePitchbookStatus',{documentId:id,expectedUpdatedAt:updated,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Status変更に失敗しました。');await searchPitchbooks()}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
el('pitchbook-past-results').addEventListener('click',event=>{const edit=event.target.closest('[data-pitchbook-edit]');if(edit)openPitchbookEdit(edit.dataset.pitchbookEdit);const status=event.target.closest('[data-pitchbook-status]');if(status)changePitchbookRecordStatus(status)});
el('pitchbook-past-search').onclick=searchPitchbooks;el('pitchbook-edit-close').onclick=()=>el('pitchbook-edit-card').classList.add('hidden-panel');
el('pitchbook-edit-form').addEventListener('submit',async event=>{event.preventDefault();clearStatus('pitchbook-edit-status');const payload={documentId:el('pitchbook-edit-documentId').value,expectedUpdatedAt:el('pitchbook-edit-expectedUpdatedAt').value,date:el('pitchbook-edit-date').value,gpId:el('pitchbook-edit-gpId').value,assetClassId:el('pitchbook-edit-assetClassId').value,capitalTypeId:el('pitchbook-edit-capitalTypeId').value};try{const result=await serverCall('updatePitchbookMaintenance',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'更新に失敗しました。');el('pitchbook-edit-expectedUpdatedAt').value=result.record.updatedAt;el('pitchbook-edit-id').textContent=result.record.documentId+' / '+result.record.savedFilename;showStatus('pitchbook-edit-status','success','更新しました。');await searchPitchbooks()}catch(error){showStatus('pitchbook-edit-status','error',error.message||String(error))}});

function renderMasters(masters){maintenanceBootstrap=maintenanceBootstrap||{};maintenanceBootstrap.masters=masters;el('gp-master-results').innerHTML=(masters.gps||[]).map(row=>'<tr><td>'+escapeHtml(row.name)+'</td><td><span class="badge '+escapeHtml(row.status)+'">'+escapeHtml(row.status)+'</span></td><td class="row-actions"><button class="small-button" data-master-rename="GP" data-id="'+escapeHtml(row.id)+'" data-name="'+escapeHtml(row.name)+'">名称変更</button><button class="small-button" data-master-status="GP" data-id="'+escapeHtml(row.id)+'" data-target="'+(row.status==='Active'?'DEACTIVATE':'REACTIVATE')+'">'+(row.status==='Active'?'無効化':'再有効化')+'</button></td></tr>').join('');el('option-master-results').innerHTML=(masters.options||[]).map(row=>'<tr><td>'+escapeHtml(row.type)+'</td><td>'+escapeHtml(row.name)+'</td><td>'+escapeHtml(row.sortOrder)+'</td><td><span class="badge '+escapeHtml(row.status)+'">'+escapeHtml(row.status)+'</span></td><td class="row-actions"><button class="small-button" data-master-rename="OPTION" data-id="'+escapeHtml(row.id)+'" data-name="'+escapeHtml(row.name)+'">名称変更</button><button class="small-button" data-master-reorder="OPTION" data-id="'+escapeHtml(row.id)+'" data-order="'+escapeHtml(row.sortOrder)+'">順序</button><button class="small-button" data-master-status="OPTION" data-id="'+escapeHtml(row.id)+'" data-target="'+(row.status==='Active'?'DEACTIVATE':'REACTIVATE')+'">'+(row.status==='Active'?'無効化':'再有効化')+'</button></td></tr>').join('')}
async function performMasterMutation(payload){clearStatus('masters-status');const result=await serverCall('mutateMaster',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Master変更に失敗しました。');renderMasters(result.masters);populateSharedOptions({gps:result.masters.gps.filter(x=>x.status==='Active'),assetClasses:result.masters.options.filter(x=>x.type==='ASSET_CLASS'&&x.status==='Active').map(x=>({id:x.id,name:x.name})),capitalTypes:result.masters.options.filter(x=>x.type==='CAPITAL_TYPE'&&x.status==='Active').map(x=>({id:x.id,name:x.name})),locations:result.masters.options.filter(x=>x.type==='LOCATION'&&x.status==='Active').map(x=>({id:x.id,name:x.name}))});populateMaintenanceSelects({gps:result.masters.gps.filter(x=>x.status==='Active'),assetClasses:result.masters.options.filter(x=>x.type==='ASSET_CLASS'&&x.status==='Active').map(x=>({id:x.id,name:x.name})),capitalTypes:result.masters.options.filter(x=>x.type==='CAPITAL_TYPE'&&x.status==='Active').map(x=>({id:x.id,name:x.name})),locations:result.masters.options.filter(x=>x.type==='LOCATION'&&x.status==='Active').map(x=>({id:x.id,name:x.name}))});showStatus('masters-status','success','Masterを更新しました。')}
el('gp-add-form').addEventListener('submit',async event=>{event.preventDefault();try{await performMasterMutation({entity:'GP',action:'ADD',name:el('gp-add-name').value});el('gp-add-name').value=''}catch(error){showStatus('masters-status','error',error.message||String(error))}});
el('option-add-form').addEventListener('submit',async event=>{event.preventDefault();try{await performMasterMutation({entity:'OPTION',action:'ADD',type:el('option-add-type').value,name:el('option-add-name').value});el('option-add-name').value=''}catch(error){showStatus('masters-status','error',error.message||String(error))}});
function masterClickHandler(event){const rename=event.target.closest('[data-master-rename]'),reorder=event.target.closest('[data-master-reorder]'),status=event.target.closest('[data-master-status]');(async()=>{try{if(rename){const name=prompt('新しい名称',rename.dataset.name);if(name===null)return;await performMasterMutation({entity:rename.dataset.masterRename,action:'RENAME',id:rename.dataset.id,name})}else if(reorder){const order=prompt('新しいSort Order',reorder.dataset.order);if(order===null)return;await performMasterMutation({entity:'OPTION',action:'REORDER',id:reorder.dataset.id,sortOrder:Number(order)})}else if(status){if(!confirm((status.dataset.target==='DEACTIVATE'?'無効化':'再有効化')+'しますか？'))return;await performMasterMutation({entity:status.dataset.masterStatus,action:status.dataset.target,id:status.dataset.id})}}catch(error){showStatus('masters-status','error',error.message||String(error))}})()}
el('gp-master-results').addEventListener('click',masterClickHandler);el('option-master-results').addEventListener('click',masterClickHandler);
el('masters-refresh').onclick=async()=>{try{const result=await serverCall('getPhase1MaintenanceBootstrapData');if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');bootstrapMaintenance(result);showStatus('masters-status','info','再読込しました。')}catch(error){showStatus('masters-status','error',error.message||String(error))}};
</script>
