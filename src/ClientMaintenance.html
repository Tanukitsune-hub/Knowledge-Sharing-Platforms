<script>
let maintenanceBootstrap=null;
let meetingEditPreservedPitchbooks=[];
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function maintenanceSearchPayload(prefix){return{dateFrom:el(prefix+'-dateFrom').value,dateTo:el(prefix+'-dateTo').value,gpId:el(prefix+'-gpId')?el(prefix+'-gpId').value:'',counterpartyType:el(prefix+'-counterpartyType')?el(prefix+'-counterpartyType').value:'',counterpartyId:el(prefix+'-counterpartyId')?el(prefix+'-counterpartyId').value:'',relatedGpId:el(prefix+'-relatedGpId')?el(prefix+'-relatedGpId').value:'',assetClassId:el(prefix+'-assetClassId').value,capitalTypeId:el(prefix+'-capitalTypeId').value,teamId:el(prefix+'-teamId')?el(prefix+'-teamId').value:'',fundStrategy:el(prefix+'-fundStrategy')?el(prefix+'-fundStrategy').value:'',meetingTypeCode:el(prefix+'-meetingTypeCode')?el(prefix+'-meetingTypeCode').value:'',followUpOnly:el(prefix+'-followUpOnly')?el(prefix+'-followUpOnly').checked:false,status:el(prefix+'-filterStatus').value,limit:100}}
function populateCounterpartyTypeSelect(id,types){const node=el(id);if(!node)return;const current=node.value;node.innerHTML='<option value="">未選択</option>';(types||[]).forEach(item=>{const option=document.createElement('option');option.value=item.code;option.textContent=item.label;node.appendChild(option)});node.value=current}
function populateCounterpartyEntitySelect(id,type,entities,preferred){const node=el(id);if(!node)return;const current=preferred===undefined?node.value:String(preferred||'');node.innerHTML='<option value="">未選択</option>';(entities||[]).filter(item=>type&&item.type===type).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name+(item.status==='Inactive'?'（Inactive）':'');node.appendChild(option)});if([...node.options].some(option=>option.value===current))node.value=current}
function populateMaintenanceSelects(options){
  ['meeting-past','pitchbook-past'].forEach(prefix=>{if(el(prefix+'-gpId'))addOptions(prefix+'-gpId',options.gps);addOptions(prefix+'-assetClassId',options.assetClasses);addOptions(prefix+'-capitalTypeId',options.capitalTypes)});
  populateCounterpartyTypeSelect('meeting-past-counterpartyType',options.counterpartyTypes);populateCounterpartyEntitySelect('meeting-past-counterpartyId','',options.counterpartyEntities);addOptions('meeting-past-relatedGpId',options.gps);
  ['meeting-edit'].forEach(prefix=>{addOptions(prefix+'-assetClassId',options.assetClasses);addOptions(prefix+'-capitalTypeId',options.capitalTypes);addOptions(prefix+'-locationId',options.locations)});
  populateCounterpartyTypeSelect('meeting-edit-counterpartyType',options.counterpartyTypes);populateCounterpartyEntitySelect('meeting-edit-counterpartyId','',options.counterpartyEntities);const related=el('meeting-edit-relatedGpIds');if(related){related.innerHTML='';(options.gps||[]).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name+(item.status==='Inactive'?'（Inactive）':'');related.appendChild(option)})}
  addOptions('meeting-past-teamId',options.teams);addOptions('meeting-edit-teamId',(options.teams||[]).filter(item=>item.status==='Active'));
  ['pitchbook-edit'].forEach(prefix=>{addOptions(prefix+'-gpId',options.gps);addOptions(prefix+'-assetClassId',options.assetClasses);addOptions(prefix+'-capitalTypeId',options.capitalTypes)});
}
function refreshMeetingEditRelatedPitchbooks(preservedIds){const node=el('meeting-edit-relatedPitchbookIds');if(!node)return;const selected=new Set((preservedIds||selectedOptionValues('meeting-edit-relatedPitchbookIds')).map(String));const gps=new Set(selectedOptionValues('meeting-edit-relatedGpIds')),asset=el('meeting-edit-assetClassId').value;const merged=[...meetingRelatedPitchbookCatalog,...meetingEditPreservedPitchbooks].filter((item,index,array)=>array.findIndex(candidate=>candidate.id===item.id)===index);node.innerHTML='';merged.filter(item=>selected.has(item.id)||(item.status==='Active'&&gps.has(item.gpId)&&item.assetClassId===asset)).sort((left,right)=>right.date.localeCompare(left.date)||left.id.localeCompare(right.id)).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=(item.date||'')+' / '+item.id+' / '+item.title+(item.status==='Inactive'?'（Inactive・既存リンク）':'');option.selected=selected.has(item.id);node.appendChild(option)})}
function ensureMeetingEditPrimaryGpRelated(){if(el('meeting-edit-counterpartyType').value!=='GP')return;const id=el('meeting-edit-counterpartyId').value;if(!id)return;const values=selectedOptionValues('meeting-edit-relatedGpIds');if(!values.includes(id))setSelectedOptionValues('meeting-edit-relatedGpIds',[...values,id])}
function bootstrapMaintenance(result){if(!result||!result.ok){showStatus('masters-status','error',result&&result.error?result.error.message:'保守機能を読み込めませんでした。');return}maintenanceBootstrap=result;populateMaintenanceSelects(result.options||{});renderMasters(result.masters||{gps:[],options:[]})}

async function searchMeetings(){clearStatus('meeting-past-status');try{const result=await serverCall('searchMeetingRecords',maintenanceSearchPayload('meeting-past'));if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'検索に失敗しました。');renderMeetingResults(result.records||[]);showStatus('meeting-past-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}}
function renderMeetingResults(records){el('meeting-past-results').innerHTML=records.map(record=>'<tr><td>'+escapeHtml(record.date)+(record.time?'<br><span class="hint">'+escapeHtml(record.time)+'</span>':'')+'</td><td>'+escapeHtml(record.counterpartyEntityName||record.gpName)+(record.relatedGpNames&&record.relatedGpNames.length?'<br><span class="hint">関連GP: '+escapeHtml(record.relatedGpNames.join(', '))+'</span>':'')+(record.teamName?'<br><span class="hint">Team: '+escapeHtml(record.teamName)+'</span>':'')+'</td><td>'+escapeHtml(record.assetClassName)+(record.fundStrategy?'<br><span class="hint">'+escapeHtml(record.fundStrategy)+'</span>':'')+(record.meetingTypeLabels&&record.meetingTypeLabels.length?'<br><span class="hint">'+escapeHtml(record.meetingTypeLabels.join(' / '))+'</span>':'')+(record.relatedPitchbookIds&&record.relatedPitchbookIds.length?'<br><span class="hint">Pitchbook: '+escapeHtml(record.relatedPitchbookIds.join(', '))+'</span>':'')+'</td><td><span class="badge '+escapeHtml(record.status)+'">'+escapeHtml(record.status)+'</span>'+(record.followUpRequired?'<br><span class="badge Pending">要フォロー</span>':'')+'</td><td>'+escapeHtml(record.version)+'</td><td class="row-actions"><button class="small-button" data-meeting-edit="'+escapeHtml(record.meetingId)+'">編集</button>'+(record.documentUrl?'<a class="small-link" href="'+escapeHtml(record.documentUrl)+'" target="_blank" rel="noopener">Doc</a>':'')+'<button class="small-button" data-meeting-status="'+escapeHtml(record.meetingId)+'" data-version="'+escapeHtml(record.version)+'" data-target="'+(record.status==='Active'?'Inactive':'Active')+'">'+(record.status==='Active'?'無効化':'再有効化')+'</button></td></tr>').join('')||'<tr><td colspan="6" class="empty-cell">該当なし</td></tr>'}
async function openMeetingEdit(meetingId){clearStatus('meeting-edit-status');try{const result=await serverCall('getMeetingMaintenanceRecord',meetingId);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');const r=result.record;if(r.teamId&&![...el('meeting-edit-teamId').options].some(option=>option.value===r.teamId)){const currentTeam=(maintenanceBootstrap.options.teams||[]).find(team=>team.id===r.teamId);if(currentTeam){const option=document.createElement('option');option.value=currentTeam.id;option.textContent=currentTeam.name+'（Inactive・現在値）';el('meeting-edit-teamId').appendChild(option)}}el('meeting-edit-meetingId').value=r.meetingId;el('meeting-edit-expectedVersion').value=r.version;el('meeting-edit-id').textContent=r.meetingId+' / Version '+r.version;el('meeting-edit-counterpartyType').value=r.counterpartyType||'';populateCounterpartyEntitySelect('meeting-edit-counterpartyId',r.counterpartyType,maintenanceBootstrap.options.counterpartyEntities,r.counterpartyId);setSelectedOptionValues('meeting-edit-relatedGpIds',r.relatedGpIds||[]);['date','time','locationId','assetClassId','capitalTypeId','teamId','fundStrategy','followUpNote','counterparty','internalParticipants','notes'].forEach(field=>{el('meeting-edit-'+field).value=r[field]||''});setMeetingTypeValues('meeting-edit',r.meetingTypeCodes);el('meeting-edit-followUpRequired').checked=Boolean(r.followUpRequired);meetingEditPreservedPitchbooks=r.relatedPitchbooks||[];refreshMeetingEditRelatedPitchbooks(r.relatedPitchbookIds||[]);el('meeting-edit-card').classList.remove('hidden-panel');el('meeting-edit-card').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}}
['meeting-edit-relatedGpIds','meeting-edit-assetClassId'].forEach(id=>el(id).addEventListener('change',()=>{ensureMeetingEditPrimaryGpRelated();refreshMeetingEditRelatedPitchbooks()}));
el('meeting-edit-counterpartyType').addEventListener('change',()=>{populateCounterpartyEntitySelect('meeting-edit-counterpartyId',el('meeting-edit-counterpartyType').value,maintenanceBootstrap.options.counterpartyEntities,'');refreshMeetingEditRelatedPitchbooks()});
el('meeting-edit-counterpartyId').addEventListener('change',()=>{ensureMeetingEditPrimaryGpRelated();refreshMeetingEditRelatedPitchbooks()});
el('meeting-past-counterpartyType').addEventListener('change',()=>populateCounterpartyEntitySelect('meeting-past-counterpartyId',el('meeting-past-counterpartyType').value,maintenanceBootstrap.options.counterpartyEntities,''));
async function changeMeetingRecordStatus(button){const target=button.dataset.target,id=button.dataset.meetingStatus,version=Number(button.dataset.version);if(!confirm((target==='Inactive'?'無効化':'再有効化')+'しますか？'))return;try{const result=await serverCall('changeMeetingStatus',{meetingId:id,expectedVersion:version,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Status変更に失敗しました。');await searchMeetings()}catch(error){showStatus('meeting-past-status','error',error.message||String(error))}}
el('meeting-past-results').addEventListener('click',event=>{const edit=event.target.closest('[data-meeting-edit]');if(edit)openMeetingEdit(edit.dataset.meetingEdit);const status=event.target.closest('[data-meeting-status]');if(status)changeMeetingRecordStatus(status)});
el('meeting-past-search').onclick=searchMeetings;el('meeting-edit-close').onclick=()=>el('meeting-edit-card').classList.add('hidden-panel');
el('meeting-edit-form').addEventListener('submit',async event=>{event.preventDefault();clearStatus('meeting-edit-status');const payload={meetingId:el('meeting-edit-meetingId').value,expectedVersion:Number(el('meeting-edit-expectedVersion').value),date:el('meeting-edit-date').value,time:el('meeting-edit-time').value,locationId:el('meeting-edit-locationId').value,counterpartyType:el('meeting-edit-counterpartyType').value,counterpartyId:el('meeting-edit-counterpartyId').value,relatedGpIds:selectedOptionValues('meeting-edit-relatedGpIds'),assetClassId:el('meeting-edit-assetClassId').value,capitalTypeId:el('meeting-edit-capitalTypeId').value,teamId:el('meeting-edit-teamId').value,fundStrategy:el('meeting-edit-fundStrategy').value,meetingTypeCodes:meetingTypeValues('meeting-edit'),relatedPitchbookIds:selectedOptionValues('meeting-edit-relatedPitchbookIds'),followUpRequired:el('meeting-edit-followUpRequired').checked,followUpNote:el('meeting-edit-followUpNote').value,counterparty:el('meeting-edit-counterparty').value,internalParticipants:el('meeting-edit-internalParticipants').value,notes:el('meeting-edit-notes').value};try{const result=await serverCall('updateMeetingMaintenance',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'更新に失敗しました。');el('meeting-edit-expectedVersion').value=result.record.version;el('meeting-edit-id').textContent=result.record.meetingId+' / Version '+result.record.version;showStatus('meeting-edit-status','success','更新しました。');await searchMeetings()}catch(error){showStatus('meeting-edit-status','error',error.message||String(error))}});

async function searchPitchbooks(){clearStatus('pitchbook-past-status');try{const result=await serverCall('searchPitchbookRecords',maintenanceSearchPayload('pitchbook-past'));if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'検索に失敗しました。');renderPitchbookResults(result.records||[]);showStatus('pitchbook-past-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
function renderPitchbookResults(records){el('pitchbook-past-results').innerHTML=records.map(record=>{const editable=Boolean(record.fileId);const statusAction=record.status==='Active'?'<button class="small-button" data-pitchbook-status="'+escapeHtml(record.documentId)+'" data-updated="'+escapeHtml(record.updatedAt)+'" data-target="Inactive">無効化</button>':(record.status==='Inactive'&&record.fileId?'<button class="small-button" data-pitchbook-status="'+escapeHtml(record.documentId)+'" data-updated="'+escapeHtml(record.updatedAt)+'" data-target="Active">再有効化</button>':'');return '<tr><td>'+escapeHtml(record.date)+'</td><td>'+escapeHtml(record.gpName)+'</td><td>'+escapeHtml(record.assetClassName)+(record.fundStrategy?'<br><span class="hint">'+escapeHtml(record.fundStrategy)+'</span>':'')+'</td><td><span class="file-name">'+escapeHtml(record.savedFilename||record.originalFilename)+'</span></td><td><span class="badge '+escapeHtml(record.status)+'">'+escapeHtml(record.status)+'</span></td><td class="row-actions">'+(editable?'<button class="small-button" data-pitchbook-edit="'+escapeHtml(record.documentId)+'">編集</button>':'')+(record.fileUrl?'<a class="small-link" href="'+escapeHtml(record.fileUrl)+'" target="_blank" rel="noopener">開く</a>':'')+statusAction+(!editable&&record.status!=='Inactive'?'<span class="hint">登録画面で再試行</span>':'')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="empty-cell">該当なし</td></tr>'}
async function openPitchbookEdit(documentId){try{const result=await serverCall('getPitchbookMaintenanceRecord',documentId);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');const r=result.record;el('pitchbook-edit-documentId').value=r.documentId;el('pitchbook-edit-expectedUpdatedAt').value=r.updatedAt;el('pitchbook-edit-id').textContent=r.documentId+' / '+r.savedFilename;['date','gpId','assetClassId','capitalTypeId','fundStrategy'].forEach(field=>{el('pitchbook-edit-'+field).value=r[field]||''});el('pitchbook-edit-card').classList.remove('hidden-panel');el('pitchbook-edit-card').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
async function changePitchbookRecordStatus(button){const target=button.dataset.target,id=button.dataset.pitchbookStatus,updated=button.dataset.updated;if(!confirm((target==='Inactive'?'無効化':'再有効化')+'しますか？'))return;try{const result=await serverCall('changePitchbookStatus',{documentId:id,expectedUpdatedAt:updated,targetStatus:target});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Status変更に失敗しました。');await searchPitchbooks()}catch(error){showStatus('pitchbook-past-status','error',error.message||String(error))}}
el('pitchbook-past-results').addEventListener('click',event=>{const edit=event.target.closest('[data-pitchbook-edit]');if(edit)openPitchbookEdit(edit.dataset.pitchbookEdit);const status=event.target.closest('[data-pitchbook-status]');if(status)changePitchbookRecordStatus(status)});
el('pitchbook-past-search').onclick=searchPitchbooks;el('pitchbook-edit-close').onclick=()=>el('pitchbook-edit-card').classList.add('hidden-panel');
el('pitchbook-edit-form').addEventListener('submit',async event=>{event.preventDefault();clearStatus('pitchbook-edit-status');const payload={documentId:el('pitchbook-edit-documentId').value,expectedUpdatedAt:el('pitchbook-edit-expectedUpdatedAt').value,date:el('pitchbook-edit-date').value,gpId:el('pitchbook-edit-gpId').value,assetClassId:el('pitchbook-edit-assetClassId').value,capitalTypeId:el('pitchbook-edit-capitalTypeId').value,fundStrategy:el('pitchbook-edit-fundStrategy').value};try{const result=await serverCall('updatePitchbookMaintenance',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'更新に失敗しました。');el('pitchbook-edit-expectedUpdatedAt').value=result.record.updatedAt;el('pitchbook-edit-id').textContent=result.record.documentId+' / '+result.record.savedFilename;showStatus('pitchbook-edit-status','success','更新しました。');await searchPitchbooks()}catch(error){showStatus('pitchbook-edit-status','error',error.message||String(error))}});

function renderMasters(masters){maintenanceBootstrap=maintenanceBootstrap||{};maintenanceBootstrap.masters=masters;el('gp-master-results').innerHTML=(masters.gps||[]).map(row=>'<tr><td>'+escapeHtml(row.name)+'</td><td><span class="badge '+escapeHtml(row.status)+'">'+escapeHtml(row.status)+'</span></td><td class="row-actions"><button class="small-button" data-master-rename="GP" data-id="'+escapeHtml(row.id)+'" data-name="'+escapeHtml(row.name)+'">名称変更</button><button class="small-button" data-master-status="GP" data-id="'+escapeHtml(row.id)+'" data-target="'+(row.status==='Active'?'DEACTIVATE':'REACTIVATE')+'">'+(row.status==='Active'?'無効化':'再有効化')+'</button></td></tr>').join('');el('option-master-results').innerHTML=(masters.options||[]).map(row=>'<tr><td>'+escapeHtml(row.type)+'</td><td>'+escapeHtml(row.name)+'</td><td>'+escapeHtml(row.sortOrder)+'</td><td><span class="badge '+escapeHtml(row.status)+'">'+escapeHtml(row.status)+'</span></td><td class="row-actions"><button class="small-button" data-master-rename="OPTION" data-id="'+escapeHtml(row.id)+'" data-name="'+escapeHtml(row.name)+'">名称変更</button><button class="small-button" data-master-reorder="OPTION" data-id="'+escapeHtml(row.id)+'" data-order="'+escapeHtml(row.sortOrder)+'">順序</button><button class="small-button" data-master-status="OPTION" data-id="'+escapeHtml(row.id)+'" data-target="'+(row.status==='Active'?'DEACTIVATE':'REACTIVATE')+'">'+(row.status==='Active'?'無効化':'再有効化')+'</button></td></tr>').join('')}
function optionsFromMasters(masters,activeOnly){return maintenanceOptionSets(masters,activeOnly)}
async function performMasterMutation(payload){clearStatus('masters-status');const result=await serverCall('mutateMaster',payload);if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Master変更に失敗しました。');renderMasters(result.masters);populateSharedOptions(optionsFromMasters(result.masters,true));populateMaintenanceSelects(optionsFromMasters(result.masters,false));showStatus('masters-status','success','Masterを更新しました。')}
el('gp-add-form').addEventListener('submit',async event=>{event.preventDefault();try{await performMasterMutation({entity:'GP',action:'ADD',name:el('gp-add-name').value});el('gp-add-name').value=''}catch(error){showStatus('masters-status','error',error.message||String(error))}});
el('option-add-form').addEventListener('submit',async event=>{event.preventDefault();try{await performMasterMutation({entity:'OPTION',action:'ADD',type:el('option-add-type').value,name:el('option-add-name').value});el('option-add-name').value=''}catch(error){showStatus('masters-status','error',error.message||String(error))}});
function masterClickHandler(event){const rename=event.target.closest('[data-master-rename]'),reorder=event.target.closest('[data-master-reorder]'),status=event.target.closest('[data-master-status]');(async()=>{try{if(rename){const name=prompt('新しい名称',rename.dataset.name);if(name===null)return;await performMasterMutation({entity:rename.dataset.masterRename,action:'RENAME',id:rename.dataset.id,name})}else if(reorder){const order=prompt('新しいSort Order',reorder.dataset.order);if(order===null)return;await performMasterMutation({entity:'OPTION',action:'REORDER',id:reorder.dataset.id,sortOrder:Number(order)})}else if(status){if(!confirm((status.dataset.target==='DEACTIVATE'?'無効化':'再有効化')+'しますか？'))return;await performMasterMutation({entity:status.dataset.masterStatus,action:status.dataset.target,id:status.dataset.id})}}catch(error){showStatus('masters-status','error',error.message||String(error))}})()}
el('gp-master-results').addEventListener('click',masterClickHandler);el('option-master-results').addEventListener('click',masterClickHandler);
el('masters-refresh').onclick=async()=>{try{const result=await serverCall('getPhase1MaintenanceBootstrapData');if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'読込に失敗しました。');bootstrapMaintenance(result);showStatus('masters-status','info','再読込しました。')}catch(error){showStatus('masters-status','error',error.message||String(error))}};
</script>
