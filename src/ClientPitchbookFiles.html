<script>

function fileDescriptor(file,index){return{ordinal:index+1,originalFilename:file.name,sizeBytes:file.size,mimeType:file.type||'application/octet-stream'}}
function extension(name){const m=/\.([^.]+)$/.exec(name||'');return m?m[1].toLowerCase():''}
function validateFiles(files){if(!files.length)return'ファイルを1つ以上選択してください。';if(files.length>KSP_PITCHBOOK_LIMITS.fileCount)return'ファイルは10件までです。';let total=0;for(const file of files){if(file.size<=0)return'空のファイルは登録できません。';if(file.size>KSP_PITCHBOOK_LIMITS.fileBytes)return file.name+' は25MBを超えています。';if(!KSP_ALLOWED_EXTENSIONS.includes(extension(file.name)))return file.name+' は対応形式ではありません。';total+=file.size}if(total>KSP_PITCHBOOK_LIMITS.totalBytes)return'合計サイズは100MBまでです。';return''}
function formatBytes(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/1024/1024).toFixed(1)+' MB'}
let pitchbookActionButton=null;
function pitchbookSetDisabled(button,disabled){if(disabled&&!pitchbookBusy&&document.activeElement===button)el('pitchbook-status').focus({preventScroll:true});button.disabled=disabled}
function setPitchbookBusy(busy,trigger){pitchbookBusy=busy;if(busy&&trigger)pitchbookActionButton=trigger;if(busy&&!pitchbookActionButton)pitchbookActionButton=el('pitchbook-submit');if(pitchbookActionButton)kspSetActionBusy(pitchbookActionButton,busy,pitchbookActionButton===el('pitchbook-retry')?'再試行中…':'資料を保存中…');if(!busy)pitchbookActionButton=null;const submit=el('pitchbook-submit'),retry=el('pitchbook-retry');pitchbookSetDisabled(submit,!kspActionKeepsFocus(submit)&&(busy||pitchbookLoading||!pitchbookParent||!selectedPitchbookFiles.length||Boolean(pitchbookSlots.length)));pitchbookSetDisabled(retry,!kspActionKeepsFocus(retry)&&(busy||(pitchbookMode!=='standalone'&&!pitchbookParent)||!(pitchbookSlots.some(slot=>!slot.linkConfirmed)||pendingExistingDocumentIds.length||selectedPitchbookFiles.length||pitchbookPrepareRequest)));el('pitchbook-clear').disabled=busy;const standalone=el('standalone-pitchbook-submit');if(standalone)pitchbookSetDisabled(standalone,!kspActionKeepsFocus(standalone)&&(busy||pitchbookLoading));fileInput.disabled=busy;kspSetRegionBusy(el('meeting-file-panel'),busy)}
function savePitchbookSlots(){if(pitchbookParent||pitchbookSlots.length||pitchbookPrepareUnknown||pitchbookPrepareRequest||pendingExistingDocumentIds.length)writeEnvelope(KSP_PITCHBOOK_SLOT_KEY,{mode:pitchbookMode,parent:pitchbookMode==='standalone'?null:pitchbookParent,slots:pitchbookSlots,pendingExistingDocumentIds,prepareUnknown:pitchbookPrepareUnknown,prepareRequest:pitchbookPrepareRequest});else safeRemove(KSP_PITCHBOOK_SLOT_KEY)}
function restorePitchbookSlots(){const saved=readEnvelope(KSP_PITCHBOOK_SLOT_KEY);pitchbookSlots=Array.isArray(saved)?saved:(saved&&saved.slots||[]);pitchbookParent=saved&&!Array.isArray(saved)?saved.parent:null;pitchbookMode=saved&&saved.mode==='standalone'?'standalone':'meeting';pendingExistingDocumentIds=saved&&saved.pendingExistingDocumentIds||[];pitchbookPrepareUnknown=Boolean(saved&&saved.prepareUnknown);pitchbookPrepareRequest=saved&&saved.prepareRequest||null;renderPitchbookFiles();if(pitchbookParent){el('pitchbook-parent-label').textContent='保存済み親記録: '+pitchbookParent.meetingId+'（再試行前に最新状態を照合します）';setRegisteredMeetingLocked(true);el('pitchbook-submit').hidden=false;el('pitchbook-submit').disabled=true}if(pitchbookSlots.length||pitchbookPrepareRequest)showStatus('pitchbook-status','warning','未完了の資料保存を復元しました。ファイル未保存分だけ原本を再選択して再試行してください。')}
function renderPitchbookFiles(){
  const list=el('pitchbook-file-list');list.innerHTML='';
  const rows=pitchbookSlots.length?pitchbookSlots:selectedPitchbookFiles.map((file,index)=>({ordinal:index+1,originalFilename:file.name,status:'Selected',sizeBytes:file.size}));
  rows.forEach(row=>{
    const wrap=document.createElement('div');wrap.className='file-row';
    const identity=document.createElement('details');identity.className='file-identity';
    const summary=document.createElement('summary'),name=document.createElement('span');name.className='file-primary-name';name.textContent=row.originalFilename;summary.appendChild(name);identity.appendChild(summary);
    const detail=document.createElement('div');detail.className='file-detail';detail.textContent='元ファイル名: '+row.originalFilename+(row.savedFilename?' / 保存名: '+row.savedFilename:'');identity.appendChild(detail);
    const size=document.createElement('div');size.className='file-size';size.textContent=row.sizeBytes?formatBytes(row.sizeBytes):'';
    const badge=document.createElement('span');badge.className='badge '+String(row.status||'');badge.textContent=row.linkConfirmed?'関連付け済み':row.fileSaved?'保存済み・関連付け未完了':row.outcomeUnknown?'保存結果を確認中':(row.status||'');
    wrap.append(identity,size,badge);list.appendChild(wrap)
  });
  const total=selectedPitchbookFiles.reduce((sum,file)=>sum+file.size,0);el('pitchbook-file-summary').textContent=selectedPitchbookFiles.length?selectedPitchbookFiles.length+'件 / '+formatBytes(total):(pitchbookSlots.length?'ファイルを再選択すると失敗分を再試行できます。':'');setPitchbookBusy(pitchbookBusy)
}
function matchReselectedFiles(files){if(!pitchbookSlots.length)return;const pool=[...files];pitchbookSlots.forEach(slot=>{const index=pool.findIndex(file=>file.name===slot.originalFilename&&(!slot.sizeBytes||file.size===slot.sizeBytes));if(index>=0)pool.splice(index,1)})}
function setSelectedFiles(files){const array=[...files];if(!array.length){selectedPitchbookFiles=[];kspSetInlineError(el('pitchbook-drop-zone'),'');renderPitchbookFiles();clearStatus('pitchbook-status');return}const error=validateFiles(array);if(error){kspSetInlineError(el('pitchbook-drop-zone'),error);showStatus('pitchbook-status','error',error);return}selectedPitchbookFiles=array;kspSetInlineError(el('pitchbook-drop-zone'),'');matchReselectedFiles(array);renderPitchbookFiles();clearStatus('pitchbook-status')}
const drop=el('pitchbook-drop-zone'),fileInput=el('pitchbook-files');drop.onclick=()=>fileInput.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}};['dragenter','dragover'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.add('dragover')}));['dragleave','drop'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('dragover')}));drop.addEventListener('drop',e=>setSelectedFiles(e.dataTransfer.files));fileInput.onchange=()=>setSelectedFiles(fileInput.files);
function pitchbookMetadata(){const prefix=pitchbookMode==='standalone'?'pitchbook':'meeting';return{date:el(prefix+'-date').value,counterpartyId:pitchbookMode==='standalone'?el('pitchbook-counterpartyId').value:el('meeting-counterpartyId').value,assetClassId:el(prefix+'-assetClassId').value,capitalTypeId:el(prefix+'-capitalTypeId').value,fundStrategy:el(prefix+'-fundStrategy').value}}
function fileForSlot(slot){const direct=selectedPitchbookFiles[Math.max(0,(slot.ordinal||1)-1)];if(direct&&direct.name===slot.originalFilename&&(!slot.sizeBytes||direct.size===slot.sizeBytes))return direct;return selectedPitchbookFiles.find(file=>file.name===slot.originalFilename&&(!slot.sizeBytes||file.size===slot.sizeBytes))||null}
function readBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||'').split('base64,')[1]||'');reader.onerror=()=>reject(reader.error||new Error('ファイルを読み込めませんでした。'));reader.readAsDataURL(file)})}
</script>
