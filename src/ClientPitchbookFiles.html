<script>

function fileDescriptor(file,index){return{ordinal:index+1,originalFilename:file.name,sizeBytes:file.size,mimeType:file.type||'application/octet-stream'}}
function extension(name){const m=/\.([^.]+)$/.exec(name||'');return m?m[1].toLowerCase():''}
function validateFiles(files){if(!files.length)return'ファイルを1つ以上選択してください。';if(files.length>KSP_PITCHBOOK_LIMITS.fileCount)return'ファイルは10仰までです。';let total=0;for(const file of files){if(file.size<=0)return'空のファイルは登録できません。';if(file.size>KSP_PITCHBOOK_LIMITS.fileBytes)return file.name+' は25MBを超えています。';if(!KSP_ALLOWED_EXTENSIONS.includes(extension(file.name)))return file.name+' は対応形式ではありません。';total+=file.size}if(total>KSP_PITCHBOOK_LIMITS.totalBytes)return'合計サイズは100MBまでです。';return''}
function formatBytes(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/1024/1024).toFixed(1)+' MB'}
function setPitchbookBusy(busy){el('pitchbook-submit').disabled=busy||pitchbookLoading||!selectedPitchbookFiles.length;el('pitchbook-retry').disabled=busy||!pitchbookSlots.some(slot=>slot.status==='Failed'||slot.status==='Pending');el('pitchbook-clear').disabled=busy;el('pitchbook-submit').textContent=busy?'処理中…':'登録'}
function savePitchbookSlots(){if(pitchbookSlots.length)writeEnvelope(KSP_PITCHBOOK_SLOT_KEY,pitchbookSlots);else safeRemove(KSP_PITCHBOOK_SLOT_KEY)}
function restorePitchbookSlots(){const saved=readEnvelope(KSP_PITCHBOOK_SLOT_KEY);pitchbookSlots=Array.isArray(saved)?saved:[];renderPitchbookFiles();if(pitchbookSlots.length)showStatus('pitchbook-status','warning','前回のupload slotを復元しました。ファイル本体は再選択してください。')}
function renderPitchbookFiles(){const list=el('pitchbook-file-list');list.innerHTML='';const rows=pitchbookSlots.length?pitchbookSlots:selectedPitchbookFiles.map((file,index)=>({ordinal:index+1,originalFilename:file.name,status:'Selected',sizeBytes:file.size}));rows.forEach(row=>{const wrap=document.createElement('div');wrap.className='file-row';const name=document.createElement('div');name.className='file-name';name.textContent=row.originalFilename+(row.savedFilename?' → '+row.savedFilename:'');const size=document.createElement('div');size.textContent=row.sizeBytes?formatBytes(row.sizeBytes):'';const badge=document.createElement('span');badge.className='badge '+String(row.status||'');badge.textContent=row.status||'';wrap.append(name,size,badge);list.appendChild(wrap)});const total=selectedPitchbookFiles.reduce((sum,file)=>sum+file.size,0);el('pitchbook-file-summary').textContent=selectedPitchbookFiles.length?selectedPitchbookFiles.length+'件 / '+formatBytes(total):(pitchbookSlots.length?'ファイルを再選択すると失敗分を再試行できます。':'');setPitchbookBusy(false)}
function matchReselectedFiles(files){if(!pitchbookSlots.length)return;const pool=[...files];pitchbookSlots.forEach(slot=>{const index=pool.findIndex(file=>file.name===slot.originalFilename&&(!slot.sizeBytes||file.size===slot.sizeBytes));if(index>=0)pool.splice(index,1)})}
function setSelectedFiles(files){const array=[...files];const error=validateFiles(array);if(error){showStatus('pitchbook-status','error',error);return}selectedPitchbookFiles=array;matchReselectedFiles(array);renderPitchbookFiles();clearStatus('pitchbook-status')}
const drop=el('pitchbook-drop-zone'),fileInput=el('pitchbook-files');drop.onclick=()=>fileInput.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click()}};['dragenter','dragover'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.add('dragover')}));['dragleave','drop'].forEach(name=>drop.addEventListener(name,e=>{e.preventDefault();drop.classList.remove('dragover')}));drop.addEventListener('drop',e=>setSelectedFiles(e.dataTransfer.files));fileInput.onchange=()=>setSelectedFiles(fileInput.files);
function pitchbookMetadata(){return{date:el('pitchbook-date').value,gpId:el('pitchbook-gpId').value,assetClassId:el('pitchbook-assetClassId').value,capitalTypeId:el('pitchbook-capitalTypeId').value,fundStrategy:el('pitchbook-fundStrategy').value}}
function fileForSlot(slot){const direct=selectedPitchbookFiles[Math.max(0,(slot.ordinal||1)-1)];if(direct&&direct.name===slot.originalFilename&&(!slot.sizeBytes||direct.size===slot.sizeBytes))return direct;return selectedPitchbookFiles.find(file=>file.name===slot.originalFilename&&(!slot.sizeBytes||file.size===slot.sizeBytes))||null}
function readBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||'').split('base64,')[1]||'');reader.onerror=()=>reject(reader.error||new Error('ファイルを読み込めませんでした。'));reader.readAsDataURL(file)})}
</script>
