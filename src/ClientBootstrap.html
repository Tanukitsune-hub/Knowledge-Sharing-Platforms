<script>
// Keep the shared file controller in the real registration form; move it only for a saved parent.
el('meeting-file-home').appendChild(el('meeting-file-panel'));
showPage('knowledge');
const summarySwitch=document.createElement('div');summarySwitch.className='actions';
summarySwitch.innerHTML='<button type="button" id="summary-show-gp" class="small-button">GPサマリー</button><button type="button" id="summary-show-entity" class="small-button">面談先サマリー</button>';
el('page-entity-workspace').prepend(summarySwitch);
el('summary-show-gp').onclick=()=>{showPage('gp-workspace');el('page-gp-workspace').prepend(summarySwitch);el('nav-entity-workspace').classList.add('active')};
el('summary-show-entity').onclick=()=>{showPage('entity-workspace');el('page-entity-workspace').prepend(summarySwitch);loadEntityWorkspaceCatalog()};
el('nav-meeting').addEventListener('click',()=>{el('meeting-file-home').appendChild(el('meeting-file-panel'));el('pitchbook-submit').hidden=!(pitchbookParent&&pitchbookParent.existing)});
function bootstrapMeeting(result){if(!result||!result.ok){meetingLoading=false;setMeetingBusy(false);showStatus('meeting-status','error',result&&result.error?result.error.message:'初期データを読み込めませんでした。');return}populateSharedOptions(result.options);restoreMeetingDraft();refreshMeetingRelatedPitchbooks(selectedOptionValues('meeting-relatedPitchbookIds'));meetingLoading=false;setMeetingBusy(false);showStatus('meeting-status','info','面談入力の準備ができました。')}
function bootstrapPitchbook(result){if(!result||!result.ok){pitchbookLoading=false;setPitchbookBusy(false);showStatus('pitchbook-status','error',result&&result.error?result.error.message:'初期データを読み込めませんでした。');return}populateSharedOptions(result.options);applyShared(readEnvelope(KSP_SHARED_DRAFT_KEY));restorePitchbookSlots();pitchbookLoading=false;setPitchbookBusy(false)}
google.script.run.withSuccessHandler(bootstrapMeeting).withFailureHandler(error=>{meetingLoading=false;setMeetingBusy(false);showStatus('meeting-status','error',error&&error.message?error.message:String(error))}).getMeetingBootstrapData();
google.script.run.withSuccessHandler(bootstrapPitchbook).withFailureHandler(error=>{pitchbookLoading=false;setPitchbookBusy(false);showStatus('pitchbook-status','error',error&&error.message?error.message:String(error))}).getPitchbookBootstrapData();
google.script.run.withSuccessHandler(bootstrapMaintenance).withFailureHandler(error=>{showStatus('masters-status','error',error&&error.message?error.message:String(error))}).getPhase1MaintenanceBootstrapData();
</script>
