<script>
function applyMasterData(masters){maintenanceMasters=masters||{gps:[],options:[]};populateMaintenanceSelects();const active={gps:maintenanceMasters.gps.filter(item=>item.status==='Active'),assetClasses:optionRowsByType('ASSET_CLASS').filter(item=>item.status==='Active'),capitalTypes:optionRowsByType('CAPITAL_TYPE').filter(item=>item.status==='Active'),locations:optionRowsByType('LOCATION').filter(item=>item.status==='Active')};populateSharedOptions(active);renderMasterTable()}
async function refreshMasterData(){try{const result=await serverCall('getMasterData');if(!result||!result.ok){showStatus('master-status-box','error',result&&result.error?result.error.message:'マスターを取得できませんでした。');return}applyMasterData(result.masters)}catch(error){showStatus('master-status-box','error',error&&error.message?error.message:String(error))}}
function currentMasterRows(){const type=el('master-type').value;if(type==='GP')return maintenanceMasters.gps.map(item=>({...item,kind:'GP'}));return maintenanceMasters.options.filter(item=>item.type===type).map(item=>({...item,kind:'OPTION'}))}
function renderMasterTable(){const rows=currentMasterRows(),body=el('master-results-body');body.innerHTML='';rows.forEach((item,index)=>{const tr=document.createElement('tr');[item.id,item.name,item.status,item.kind==='OPTION'?String(item.sortOrder||''):'—'].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td)});const actions=document.createElement('td');actions.className='table-actions';const rename=document.createElement('button');rename.className='table-action';rename.textContent='名称変更';rename.onclick=()=>renameMaster(item);actions.appendChild(rename);const status=document.createElement('button');status.className='table-action';status.textContent=item.status==='Active'?'無効化':'再有効化';status.onclick=()=>toggleMasterStatus(item);actions.appendChild(status);if(item.kind==='OPTION'){const up=document.createElement('button');up.className='table-action';up.textContent='↑';up.disabled=index===0;up.onclick=()=>moveOption(item,index-1);actions.appendChild(up);const down=document.createElement('button');down.className='table-action';down.textContent='↓';down.disabled=index===rows.length-1;down.onclick=()=>moveOption(item,index+1);actions.appendChild(down)}tr.appendChild(actions);body.appendChild(tr)});if(!rows.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=5;td.className='empty-cell';td.textContent='マスターがありません。';tr.appendChild(td);body.appendChild(tr)}}
el('master-type').onchange=()=>{el('master-new-name').value='';renderMasterTable();clearStatus('master-status-box')};
el('master-add').onclick=async()=>{const type=el('master-type').value,name=el('master-new-name').value.trim();if(!name){showStatus('master-status-box','error','名称を入力してください。');return}const payload=type==='GP'?{kind:'GP',name}:{kind:'OPTION',type,name};try{const result=await serverCall('addMasterItem',payload);if(!result||!result.ok){showStatus('master-status-box','error',result&&result.error?result.error.message:'追加に失敗しました。');return}el('master-new-name').value='';showStatus('master-status-box','success','追加しました: '+result.item.name);await refreshMasterData()}catch(error){showStatus('master-status-box','error',error&&error.message?error.message:String(error))}};
async function renameMaster(item){const name=prompt('新しい名称を入力してください。',item.name);if(name===null)return;const trimmed=name.trim();if(!trimmed||trimmed===item.name)return;if(!confirm('名称を「'+item.name+'」から「'+trimmed+'」へ変更しますか？'))return;try{const result=await serverCall('renameMasterItem',{kind:item.kind,id:item.id,name:trimmed,expectedUpdatedAt:item.updatedAt});if(!result||!result.ok){showStatus('master-status-box','error',result&&result.error?result.error.message:'名称変更に失敗しました。');return}showStatus('master-status-box','success','名称を変更しました。');await refreshMasterData()}catch(error){showStatus('master-status-box','error',error&&error.message?error.message:String(error))}}
async function toggleMasterStatus(item){const next=item.status==='Active'?'Inactive':'Active';if(!confirm(next==='Inactive'?'「'+item.name+'」を無効化しますか？':'「'+item.name+'」を再有効化しますか？'))return;try{const result=await serverCall('setMasterItemStatus',{kind:item.kind,id:item.id,status:next,expectedUpdatedAt:item.updatedAt});if(!result||!result.ok){showStatus('master-status-box','error',result&&result.error?result.error.message:'Status変更に失敗しました。');return}showStatus('master-status-box','success',next==='Inactive'?'無効化しました。':'再有効化しました。');await refreshMasterData()}catch(error){showStatus('master-status-box','error',error&&error.message?error.message:String(error))}}
async function moveOption(item,targetIndex){const rows=currentMasterRows();const currentIndex=rows.findIndex(row=>row.id===item.id);if(currentIndex<0||targetIndex<0||targetIndex>=rows.length)return;const reordered=rows.slice();const moved=reordered.splice(currentIndex,1)[0];reordered.splice(targetIndex,0,moved);try{const result=await serverCall('reorderOptionItems',{type:el('master-type').value,orderedIds:reordered.map(row=>row.id)});if(!result||!result.ok){showStatus('master-status-box','error',result&&result.error?result.error.message:'並び替えに失敗しました。');return}showStatus('master-status-box','success','並び順を更新しました。');await refreshMasterData()}catch(error){showStatus('master-status-box','error',error&&error.message?error.message:String(error))}}
el('phase1-diagnostics').onclick=async()=>{try{const result=await serverCall('getPhase1Diagnostics');if(!result||!result.ok){showStatus('master-status-box','error',result&&result.error?result.error.message:'診断に失敗しました。');return}const summary='Backend/Audit分離: '+(result.backendAndAuditSeparated?'OK':'要確認')+' / 必須資源: '+(result.requiredResourcesConfigured?'OK':'要確認')+' / Actor: '+result.actor+' / 実機検証: 未実施';showStatus('master-status-box',result.backendAndAuditSeparated&&result.requiredResourcesConfigured?'info':'warning',summary)}catch(error){showStatus('master-status-box','error',error&&error.message?error.message:String(error))}};
</script>
