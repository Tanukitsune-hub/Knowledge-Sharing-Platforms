<script>

const KSP_SHARED_DRAFT_KEY='ksp.shared.registration.v1';
const KSP_MEETING_DRAFT_KEY='ksp.meeting.draft.v1';
const KSP_MEETING_RETRY_KEY='ksp.meeting.retry.v1';
const KSP_PITCHBOOK_SLOT_KEY='ksp.pitchbook.slots.v1';
const KSP_DRAFT_TTL_MS=24*60*60*1000;
const KSP_PITCHBOOK_LIMITS={fileBytes:25*1024*1024,fileCount:10,totalBytes:100*1024*1024};
const KSP_ALLOWED_EXTENSIONS=['pdf','pptx','xlsx','docx','txt','eml'];
const SHARED_FIELDS=['date','assetClassId','capitalTypeId','fundStrategy'];
const MEETING_FIELDS=['time','locationId','counterpartyType','counterpartyId','teamId','counterparty','internalParticipants','followUpNote','notes'];
let meetingRelatedPitchbookCatalog=[];
let meetingCounterpartyEntities=[];
const pages={
  meeting:document.getElementById('page-meeting'),
  pitchbook:document.getElementById('page-pitchbook'),
  knowledge:document.getElementById('page-knowledge'),
  'gp-workspace':document.getElementById('page-gp-workspace'),
  'meeting-past':document.getElementById('page-meeting-past'),
  'pitchbook-past':document.getElementById('page-pitchbook-past'),
  masters:document.getElementById('page-masters')
};
let retryContext=null,meetingLoading=true,pitchbookLoading=true,selectedPitchbookFiles=[],pitchbookSlots=[];
function el(id){return document.getElementById(id)}
function showPage(name){Object.keys(pages).forEach(key=>{if(pages[key])pages[key].classList.toggle('active',key===name);const button=el('nav-'+key);if(button)button.classList.toggle('active',key===name)});}
Object.keys(pages).forEach(name=>{const button=el('nav-'+name);if(button)button.onclick=()=>showPage(name)});
function kspSafeDriveUrl(value){const candidate=String(value==null?'':value).trim();return /^https:\/\/(?:drive|docs)\.google\.com\//.test(candidate)?candidate:''}
function kspEscapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function kspSanitizeStatusHtml(value){return String(value==null?'':value).replace(/href="([^"]*)"/gi,(match,href)=>{const safe=kspSafeDriveUrl(href);return safe?'href="'+kspEscapeHtml(safe)+'"':'href="#" aria-disabled="true"'})}
function showStatus(id,kind,message,html){const box=el(id);box.className='status visible '+kind;if(html)box.innerHTML=kspSanitizeStatusHtml(message);else box.textContent=message}
function clearStatus(id){const box=el(id);box.className='status';box.textContent=''}
function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}function safeSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}function safeRemove(key){try{localStorage.removeItem(key)}catch(e){}}
function readEnvelope(key){const raw=safeGet(key);if(!raw)return null;try{const env=JSON.parse(raw);if(!env||typeof env.savedAt!=='number'||Date.now()-env.savedAt>KSP_DRAFT_TTL_MS){safeRemove(key);return null}return env.data||null}catch(e){safeRemove(key);return null}}
function writeEnvelope(key,data){safeSet(key,JSON.stringify({savedAt:Date.now(),data}))}
function sharedId(page,field){return page+'-'+field}function getShared(page){const out={};SHARED_FIELDS.forEach(field=>out[field]=el(sharedId(page,field)).value);return out}
function applyShared(values){if(!values)return;['meeting','pitchbook'].forEach(page=>SHARED_FIELDS.forEach(field=>{const node=el(sharedId(page,field));if(node&&values[field]!=null)node.value=String(values[field])}))}
function syncShared(sourcePage){const values=getShared(sourcePage);applyShared(values);if(sourcePage==='meeting'&&el('meeting-counterpartyType').value==='GP')el('pitchbook-gpId').value=el('meeting-counterpartyId').value;if(sourcePage==='pitchbook'&&el('meeting-counterpartyType').value==='GP'){el('meeting-counterpartyId').value=el('pitchbook-gpId').value;ensurePrimaryGpRelated()}writeEnvelope(KSP_SHARED_DRAFT_KEY,values);clearRetryContext()}
function addOptions(id,options){const select=el(id);if(!select)return;const current=select.value;select.innerHTML='<option value="">未選択</option>';(options||[]).forEach(option=>{const node=document.createElement('option');node.value=option.id;node.textContent=option.name+(option.status==='Inactive'?'（Inactive）':'');select.appendChild(node)});if([...select.options].some(option=>option.value===current))select.value=current}
function populateSharedOptions(options){addOptions('pitchbook-gpId',options.gps);['meeting','pitchbook'].forEach(page=>{addOptions(page+'-assetClassId',options.assetClasses);addOptions(page+'-capitalTypeId',options.capitalTypes)});if(Array.isArray(options.locations))addOptions('meeting-locationId',options.locations);if(Array.isArray(options.teams))addOptions('meeting-teamId',options.teams);if(Array.isArray(options.counterpartyTypes)){const node=el('meeting-counterpartyType'),current=node.value;node.innerHTML='<option value="">未選択</option>';options.counterpartyTypes.forEach(item=>{const option=document.createElement('option');option.value=item.code;option.textContent=item.label;option.dataset.optionType=item.optionType||'';node.appendChild(option)});node.value=current;node.dataset.previous=node.value}if(Array.isArray(options.counterpartyEntities)){meetingCounterpartyEntities=options.counterpartyEntities;refreshMeetingCounterpartyEntities()}if(Array.isArray(options.gps)){const current=selectedOptionValues('meeting-relatedGpIds');const node=el('meeting-relatedGpIds');node.innerHTML='';options.gps.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name;node.appendChild(option)});setSelectedOptionValues('meeting-relatedGpIds',current);ensurePrimaryGpRelated()}if(Array.isArray(options.relatedPitchbooks)){meetingRelatedPitchbookCatalog=options.relatedPitchbooks;refreshMeetingRelatedPitchbooks()}}
function refreshMeetingCounterpartyEntities(preferred){const node=el('meeting-counterpartyId');if(!node)return;const selected=preferred===undefined?node.value:String(preferred||'');const type=el('meeting-counterpartyType').value;node.innerHTML='<option value="">未選択</option>';meetingCounterpartyEntities.filter(item=>item.type===type).forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name+(item.status==='Inactive'?'（Inactive）':'');node.appendChild(option)});if([...node.options].some(option=>option.value===selected))node.value=selected}
function ensurePrimaryGpRelated(){if(el('meeting-counterpartyType').value!=='GP')return;const id=el('meeting-counterpartyId').value;if(!id)return;const values=selectedOptionValues('meeting-relatedGpIds');if(!values.includes(id))setSelectedOptionValues('meeting-relatedGpIds',[...values,id])}
function selectedOptionValues(id){const node=el(id);return node?[...node.options].filter(option=>option.selected).map(option=>option.value).filter(Boolean):[]}
function setSelectedOptionValues(id,values){const selected=new Set((values||[]).map(String));const node=el(id);if(node)[...node.options].forEach(option=>option.selected=selected.has(option.value))}
function meetingTypeValues(prefix){return[...document.querySelectorAll('[data-meeting-type="'+prefix+'"]:checked')].map(node=>node.value)}
function setMeetingTypeValues(prefix,values){const selected=new Set((values||[]).map(String));document.querySelectorAll('[data-meeting-type="'+prefix+'"]').forEach(node=>node.checked=selected.has(node.value))}
function refreshMeetingRelatedPitchbooks(previousSelection){const node=el('meeting-relatedPitchbookIds');if(!node)return;const selected=new Set((previousSelection||selectedOptionValues('meeting-relatedPitchbookIds')).map(String));const gps=new Set(selectedOptionValues('meeting-relatedGpIds')),asset=el('meeting-assetClassId').value;const choices=meetingRelatedPitchbookCatalog.filter(item=>item.status==='Active'&&gps.has(item.gpId)&&item.assetClassId===asset);node.innerHTML='';choices.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.date+' / '+item.id+' / '+item.title;option.selected=selected.has(item.id);node.appendChild(option)})}
SHARED_FIELDS.forEach(field=>['meeting','pitchbook'].forEach(page=>el(sharedId(page,field)).addEventListener('change',()=>syncShared(page))));
el('meeting-counterpartyType').addEventListener('change',()=>{const node=el('meeting-counterpartyType'),entity=el('meeting-counterpartyId').value;if(entity&&!confirm('面談先区分を変更すると現在の面談先を解除します。続けますか？')){node.value=node.dataset.previous||'';return}node.dataset.previous=node.value;refreshMeetingCounterpartyEntities('');ensurePrimaryGpRelated();refreshMeetingRelatedPitchbooks([])});
el('meeting-counterpartyId').addEventListener('change',()=>{ensurePrimaryGpRelated();if(el('meeting-counterpartyType').value==='GP')el('pitchbook-gpId').value=el('meeting-counterpartyId').value;refreshMeetingRelatedPitchbooks([])});
el('meeting-relatedGpIds').addEventListener('change',()=>{ensurePrimaryGpRelated();refreshMeetingRelatedPitchbooks([]);clearRetryContext();saveMeetingDraft()});
el('meeting-assetClassId').addEventListener('change',()=>{ensurePrimaryGpRelated();refreshMeetingRelatedPitchbooks([])});
el('pitchbook-gpId').addEventListener('change',()=>syncShared('pitchbook'));
function serverCall(name,payload){return new Promise((resolve,reject)=>{let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)})}

</script>
