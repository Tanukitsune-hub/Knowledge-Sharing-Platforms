<script>
const KSP_SHARED_DRAFT_KEY='ksp.shared.registration.v1';
const KSP_MEETING_DRAFT_KEY='ksp.meeting.draft.v1';
const KSP_MEETING_RETRY_KEY='ksp.meeting.retry.v1';
const KSP_PITCHBOOK_SLOT_KEY='ksp.pitchbook.slots.v1';
const KSP_DRAFT_TTL_MS=24*60*60*1000;
const KSP_PITCHBOOK_LIMITS={fileBytes:25*1024*1024,fileCount:10,totalBytes:100*1024*1024};
const KSP_ALLOWED_EXTENSIONS=['pdf','pptx','xlsx','docx','txt','eml'];
const SHARED_FIELDS=['date','gpId','assetClassId','capitalTypeId'];
const MEETING_FIELDS=['time','locationId','counterparty','internalParticipants','notes'];
const pages={meeting:document.getElementById('page-meeting'),pitchbook:document.getElementById('page-pitchbook'),masters:document.getElementById('page-masters')};
let retryContext=null,meetingLoading=true,pitchbookLoading=true,selectedPitchbookFiles=[],pitchbookSlots=[];
let maintenanceMasters={gps:[],options:[]},meetingEditRecord=null,pitchbookEditRecord=null;
function el(id){return document.getElementById(id)}
function showPage(name){Object.keys(pages).forEach(key=>{pages[key].classList.toggle('active',key===name);el('nav-'+key).classList.toggle('active',key===name)});}
el('nav-meeting').onclick=()=>showPage('meeting');el('nav-pitchbook').onclick=()=>showPage('pitchbook');el('nav-masters').onclick=()=>showPage('masters');
function showStatus(id,kind,message,html){const box=el(id);box.className='status visible '+kind;if(html)box.innerHTML=message;else box.textContent=message}
function clearStatus(id){const box=el(id);box.className='status';box.textContent=''}
function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}function safeSet(key,value){try{localStorage.setItem(key,value)}catch(e){}}function safeRemove(key){try{localStorage.removeItem(key)}catch(e){}}
function readEnvelope(key){const raw=safeGet(key);if(!raw)return null;try{const env=JSON.parse(raw);if(!env||typeof env.savedAt!=='number'||Date.now()-env.savedAt>KSP_DRAFT_TTL_MS){safeRemove(key);return null}return env.data||null}catch(e){safeRemove(key);return null}}
function writeEnvelope(key,data){safeSet(key,JSON.stringify({savedAt:Date.now(),data}))}
function sharedId(page,field){return page+'-'+field}function getShared(page){const out={};SHARED_FIELDS.forEach(field=>out[field]=el(sharedId(page,field)).value);return out}
function applyShared(values){if(!values)return;['meeting','pitchbook'].forEach(page=>SHARED_FIELDS.forEach(field=>{const node=el(sharedId(page,field));if(node&&values[field]!=null)node.value=String(values[field])}))}
function syncShared(sourcePage){const values=getShared(sourcePage);applyShared(values);writeEnvelope(KSP_SHARED_DRAFT_KEY,values);clearRetryContext()}
function addOptions(id,options,includeStatus){const select=el(id);if(!select)return;const current=select.value;select.innerHTML='<option value="">未選択</option>';(options||[]).forEach(option=>{const node=document.createElement('option');node.value=option.id;node.textContent=option.name+(includeStatus&&option.status==='Inactive'?'（Inactive）':'');select.appendChild(node)});if([...select.options].some(option=>option.value===current))select.value=current}
function populateSharedOptions(options){['meeting','pitchbook'].forEach(page=>{addOptions(page+'-gpId',options.gps);addOptions(page+'-assetClassId',options.assetClasses);addOptions(page+'-capitalTypeId',options.capitalTypes)});if(Array.isArray(options.locations))addOptions('meeting-locationId',options.locations)}
SHARED_FIELDS.forEach(field=>['meeting','pitchbook'].forEach(page=>el(sharedId(page,field)).addEventListener('change',()=>syncShared(page))));
function serverCall(name,payload){return new Promise((resolve,reject)=>{let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)})}
function setSubpage(group,name){['new','past'].forEach(key=>{el(group+'-view-'+key).classList.toggle('active',key===name);el(group+'-tab-'+key).classList.toggle('active',key===name)});}
el('meeting-tab-new').onclick=()=>setSubpage('meeting','new');el('meeting-tab-past').onclick=()=>setSubpage('meeting','past');
el('pitchbook-tab-new').onclick=()=>setSubpage('pitchbook','new');el('pitchbook-tab-past').onclick=()=>setSubpage('pitchbook','past');
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function formatDateTime(value){if(!value)return'';return String(value).replace('T',' ').replace(/\.\d{3}Z$/,'Z')}
function optionRowsByType(type){return maintenanceMasters.options.filter(item=>item.type===type)}
function populateMaintenanceSelects(){
  const gps=maintenanceMasters.gps,assets=optionRowsByType('ASSET_CLASS'),capitals=optionRowsByType('CAPITAL_TYPE'),locations=optionRowsByType('LOCATION');
  ['meeting-search-gpId','meeting-edit-gpId','pitchbook-search-gpId','pitchbook-edit-gpId'].forEach(id=>addOptions(id,gps,true));
  ['meeting-search-assetClassId','meeting-edit-assetClassId','pitchbook-search-assetClassId','pitchbook-edit-assetClassId'].forEach(id=>addOptions(id,assets,true));
  ['meeting-search-capitalTypeId','meeting-edit-capitalTypeId','pitchbook-search-capitalTypeId','pitchbook-edit-capitalTypeId'].forEach(id=>addOptions(id,capitals,true));
  addOptions('meeting-edit-locationId',locations,true);
}
</script>
