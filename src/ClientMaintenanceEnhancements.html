<script>
function maintenanceOptionSets(masters, activeOnly) {
  const counterparties=(masters.counterparties||[]).filter(item=>!activeOnly||item.status==='Active');
  const source=masters.options||[];
  const mapType=type=>source
    .filter(item=>item.type===type&&(!activeOnly||item.status==='Active'))
    .map(item=>({id:item.id,name:item.name,status:item.status,sortOrder:item.sortOrder}));
  const counterpartyTypes=[
    {code:'GP',label:'GP / 運用会社',optionType:''},{code:'LP_ASSET_OWNER',label:'LP / Asset Owner',optionType:'COUNTERPARTY_LP'},
    {code:'NISSAY_INTERNAL',label:'日本生命',optionType:'COUNTERPARTY_NISSAY_DEPARTMENT'},
    {code:'GROUP_COMPANY',label:'グループ会社',optionType:'COUNTERPARTY_GROUP_COMPANY'},
    {code:'CONSULTANT_GATEKEEPER',label:'Consultant / Gatekeeper',optionType:'COUNTERPARTY_CONSULTANT_GATEKEEPER'},
    {code:'OTHER',label:'その他',optionType:'COUNTERPARTY_OTHER'}
  ];
  const counterpartyEntities=counterparties.map(item=>({id:item.id,type:item.type,name:item.name,status:item.status,entityKey:'COUNTERPARTY:'+item.id}));
  return {
    counterparties,
    gps:counterparties.filter(item=>item.type==='GP'),
    assetClasses:mapType('ASSET_CLASS'),
    capitalTypes:mapType('CAPITAL_TYPE'),
    locations:mapType('LOCATION'),
    teams:mapType('TEAM'),counterpartyTypes,counterpartyEntities
  };
}

function applyMaintenanceMasterData(masters) {
  maintenanceBootstrap=maintenanceBootstrap||{};
  maintenanceBootstrap.masters=masters||{counterparties:[],options:[]};
  renderMasters(maintenanceBootstrap.masters);
  populateMaintenanceSelects(maintenanceOptionSets(maintenanceBootstrap.masters,false));
  populateSharedOptions(maintenanceOptionSets(maintenanceBootstrap.masters,true));
}

function bootstrapMaintenance(result) {
  if(!result||!result.ok){
    const message=result&&result.error?result.error.message:'保守機能を読み込めませんでした。';
    showStatus('masters-status','error',message);
    return;
  }
  maintenanceBootstrap=result;
  applyMaintenanceMasterData(result.masters||{counterparties:[],options:[]});
}

async function performMasterMutation(payload) {
  clearStatus('masters-status');
  const result=await serverCall('mutateMaster',payload);
  if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Master変更に失敗しました。');
  applyMaintenanceMasterData(result.masters);
  showStatus('masters-status','success','Masterを更新しました。');
}

const KSP_COUNTERPARTY_MODAL_TYPES=['GP','LP_ASSET_OWNER','NISSAY_INTERNAL','GROUP_COMPANY','CONSULTANT_GATEKEEPER','OTHER'];
const counterpartyModalState={origin:'',trigger:null,busy:false};
function counterpartyModalStatus(kind,message){const box=el('counterparty-modal-status');box.className=message?'status visible '+kind:'status';box.textContent=message||''}
function counterpartyModalFocusable(){return[...el('counterparty-modal').querySelectorAll('button:not([disabled]),select:not([disabled]),input:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(node=>!node.hidden)}
function openCounterpartyModal(origin,trigger){
  counterpartyModalState.origin=origin;counterpartyModalState.trigger=trigger||document.activeElement;counterpartyModalState.busy=false;
  el('counterparty-modal-type').value='';el('counterparty-modal-name').value='';counterpartyModalStatus('','');
  el('counterparty-modal-submit').disabled=false;el('counterparty-modal-backdrop').hidden=false;
  document.querySelector('main').setAttribute('inert','');document.body.classList.add('modal-open');
  setTimeout(()=>el('counterparty-modal-type').focus(),0);
}
function closeCounterpartyModal(){
  if(counterpartyModalState.busy)return;
  el('counterparty-modal-backdrop').hidden=true;document.querySelector('main').removeAttribute('inert');document.body.classList.remove('modal-open');
  const trigger=counterpartyModalState.trigger;counterpartyModalState.origin='';counterpartyModalState.trigger=null;counterpartyModalStatus('','');
  if(trigger&&typeof trigger.focus==='function')trigger.focus();
}
async function submitCounterpartyModal(event){
  event.preventDefault();if(counterpartyModalState.busy)return;
  const type=el('counterparty-modal-type').value,name=el('counterparty-modal-name').value.trim();
  if(!KSP_COUNTERPARTY_MODAL_TYPES.includes(type)){counterpartyModalStatus('error','面談先種別を選択してください。');el('counterparty-modal-type').focus();return}
  if(!name){counterpartyModalStatus('error','面談先名を入力してください。');el('counterparty-modal-name').focus();return}
  counterpartyModalState.busy=true;el('counterparty-modal-submit').disabled=true;counterpartyModalStatus('info','登録しています…');
  try{
    const result=await serverCall('quickAddCounterparty',{name,type});
    if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'面談先追加に失敗しました。');
    applyMaintenanceMasterData(result.masters);
    if(counterpartyModalState.origin==='meeting'){
      const id=result.counterparty&&result.counterparty.id;
      clearRetryContext();refreshMeetingCounterpartyEntities(id||'');refreshMeetingRelatedPitchbooks([]);saveMeetingDraft();
      showStatus('meeting-status','success','面談先を追加して選択しました。');
    }else{
      showStatus('masters-status','success','面談先マスターを更新しました。');
    }
    counterpartyModalState.busy=false;closeCounterpartyModal();
  }catch(error){counterpartyModalState.busy=false;el('counterparty-modal-submit').disabled=false;counterpartyModalStatus('error',error.message||String(error))}
}
function counterpartyModalKeydown(event){
  if(event.key==='Escape'){event.preventDefault();closeCounterpartyModal();return}
  if(event.key!=='Tab')return;
  const focusable=counterpartyModalFocusable();if(!focusable.length){event.preventDefault();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
}
el('counterparty-modal-form').addEventListener('submit',submitCounterpartyModal);
el('counterparty-modal-cancel').onclick=closeCounterpartyModal;el('counterparty-modal-close').onclick=closeCounterpartyModal;
el('counterparty-modal').addEventListener('keydown',counterpartyModalKeydown);
el('counterparty-modal-backdrop').addEventListener('click',event=>{if(event.target===el('counterparty-modal-backdrop'))closeCounterpartyModal()});
el('meeting-quick-add-counterparty').onclick=event=>openCounterpartyModal('meeting',event.currentTarget);
el('masters-add-counterparty').onclick=event=>openCounterpartyModal('masters',event.currentTarget);
const meetingMaterialPickerState={open:false,busy:false,request:0,trigger:null,candidates:[]};
function meetingMaterialPickerStatus(kind,message){const box=el('meeting-material-modal-status');box.className=message?'status visible '+kind:'status';box.textContent=message||''}
function meetingMaterialPickerFocusable(){return[...el('meeting-material-modal').querySelectorAll('button:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(node=>!node.hidden)}
function meetingMaterialCandidateLabel(record){
  const title=record.savedFilename||record.originalFilename||'名称未設定';
  return [record.date||'日付未設定',title,record.fundStrategy?'Fund / Strategy: '+record.fundStrategy:'',record.assetClassName?'アセットクラス: '+record.assetClassName:''].filter(Boolean).join(' / ');
}
function meetingMaterialCandidates(records,linkedIds){
  const linked=new Set((linkedIds||[]).map(String));
  return (records||[]).filter(record=>record&&record.documentId&&record.status==='Active'&&!linked.has(String(record.documentId))).slice(0,100);
}
function renderMeetingMaterialCandidates(){
  const candidates=meetingMaterialPickerState.candidates.filter(item=>item);
  el('meeting-material-modal-results').innerHTML=candidates.map((record,index)=>'<div class="meeting-material-candidate" role="listitem"><div class="meeting-material-candidate-label">'+escapeHtml(meetingMaterialCandidateLabel(record))+'</div><button class="small-button" type="button" data-meeting-material-index="'+index+'"'+(meetingMaterialPickerState.busy?' disabled':'')+'>この資料を関連付ける</button></div>').join('')||'<div class="meeting-material-empty">一致する未関連のActive資料はありません。</div>';
}
function closeMeetingMaterialPicker(){
  if(meetingMaterialPickerState.busy)return;
  meetingMaterialPickerState.open=false;meetingMaterialPickerState.request+=1;meetingMaterialPickerState.candidates=[];
  el('meeting-material-modal-backdrop').hidden=true;document.querySelector('main').removeAttribute('inert');document.body.classList.remove('modal-open');
  el('meeting-material-modal-results').innerHTML='';meetingMaterialPickerStatus('','');
  const trigger=meetingMaterialPickerState.trigger;meetingMaterialPickerState.trigger=null;if(trigger&&typeof trigger.focus==='function')trigger.focus();
}
async function openMeetingMaterialPicker(trigger){
  if(meetingMaterialPickerState.busy||!meetingDetailRecord||meetingDetailRecord.status!=='Active')return;
  const record=meetingDetailRecord,request=++meetingMaterialPickerState.request;
  meetingMaterialPickerState.open=true;meetingMaterialPickerState.busy=true;meetingMaterialPickerState.trigger=trigger||document.activeElement;meetingMaterialPickerState.candidates=[];
  if(trigger)trigger.disabled=true;el('meeting-material-modal').setAttribute('aria-busy','true');
  el('meeting-material-modal-results').innerHTML='';meetingMaterialPickerStatus('info busy','資料候補を読み込んでいます…');
  el('meeting-material-modal-backdrop').hidden=false;document.querySelector('main').setAttribute('inert','');document.body.classList.add('modal-open');
  setTimeout(()=>el('meeting-material-modal').focus(),0);
  try{
    const result=await serverCall('searchPitchbookRecords',{counterpartyId:record.counterpartyId,assetClassId:record.assetClassId,status:'Active',limit:100});
    if(!meetingMaterialPickerState.open||request!==meetingMaterialPickerState.request)return;
    if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'資料候補を読み込めません。');
    meetingMaterialPickerState.candidates=meetingMaterialCandidates(result.records||[],record.relatedPitchbookIds||[]);
    meetingMaterialPickerStatus('info',meetingMaterialPickerState.candidates.length+'件の候補を表示しています。');renderMeetingMaterialCandidates();
  }catch(error){if(meetingMaterialPickerState.open&&request===meetingMaterialPickerState.request){meetingMaterialPickerStatus('error',error.message||String(error));renderMeetingMaterialCandidates()}}
  finally{if(request===meetingMaterialPickerState.request){meetingMaterialPickerState.busy=false;el('meeting-material-modal').setAttribute('aria-busy','false');if(meetingMaterialPickerState.open)renderMeetingMaterialCandidates();if(trigger&&trigger.isConnected)trigger.disabled=false}}
}
async function selectMeetingMaterialCandidate(index){
  if(meetingMaterialPickerState.busy||!meetingMaterialPickerState.open)return;
  const candidate=meetingMaterialPickerState.candidates[Number(index)];if(!candidate)return;
  meetingMaterialPickerState.busy=true;if(typeof el==='function')el('meeting-material-modal').setAttribute('aria-busy','true');meetingMaterialPickerStatus('info busy','関連付けています…');renderMeetingMaterialCandidates();
  const linked=await changeDetailRelation(candidate.documentId,'add');
  meetingMaterialPickerState.busy=false;
  if(typeof el==='function')el('meeting-material-modal').setAttribute('aria-busy','false');
  if(linked){closeMeetingMaterialPicker();return}
  meetingMaterialPickerStatus('error','関連付けを完了できませんでした。現在の詳細を確認してください。');renderMeetingMaterialCandidates();
}
function meetingMaterialPickerKeydown(event){
  if(event.key==='Escape'){event.preventDefault();closeMeetingMaterialPicker();return}
  if(event.key!=='Tab')return;
  const focusable=meetingMaterialPickerFocusable();if(!focusable.length){event.preventDefault();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
}
el('meeting-material-modal-close').onclick=closeMeetingMaterialPicker;el('meeting-material-modal-cancel').onclick=closeMeetingMaterialPicker;
el('meeting-material-modal').addEventListener('keydown',meetingMaterialPickerKeydown);
el('meeting-material-modal-backdrop').addEventListener('click',event=>{if(event.target===el('meeting-material-modal-backdrop'))closeMeetingMaterialPicker()});
el('meeting-material-modal-results').addEventListener('click',event=>{const button=event.target.closest('[data-meeting-material-index]');if(button)selectMeetingMaterialCandidate(button.dataset.meetingMaterialIndex)});
let meetingDetailRecord=null,meetingDetailBusy=false,meetingDetailReadBusy=false,meetingDetailRequest=0;
const meetingDetailKnownDocuments=new Map();
function renderMeetingDetail(record){
  meetingDetailRecord=record;
  el('meeting-detail-identity').textContent=record.meetingId+' / Version '+record.version+' / '+record.status;
  const fields=[['日付',record.date],['時間',record.time],['面談場所',record.locationName],['面談先',record.counterpartyEntityName],['面談先種別',record.counterpartyType],['アセットクラス',record.assetClassName],['Equity / Debt',record.capitalTypeName],['チーム',record.teamName],['Fund / Strategy',record.fundStrategy],['MTG種別',(record.meetingTypeLabels||[]).join(' / ')],['面談相手',record.counterparty],['当社側',record.internalParticipants]];
  el('meeting-detail-attributes').innerHTML=fields.map(([label,value])=>'<div><strong>'+escapeHtml(label)+'</strong><div>'+escapeHtml(value||'—')+'</div></div>').join('');
  el('meeting-detail-body').textContent=record.notes||'（本文なし）';
  const original=kspSafeDriveUrl(record.documentUrl);el('meeting-detail-original').hidden=!original;if(original)el('meeting-detail-original').href=original;else el('meeting-detail-original').removeAttribute('href');
  el('meeting-detail-lifecycle').textContent='記録を削除';
  ['meeting-detail-add-files','meeting-detail-link','meeting-detail-lifecycle'].forEach(id=>el(id).disabled=record.status!=='Active');
  const known=meetingDetailKnownDocuments.get(record.meetingId)||new Map();
  (record.relatedPitchbooks||[]).forEach(item=>{if((record.relatedPitchbookIds||[]).includes(item.id))known.set(item.id,item)});
  (record.relatedPitchbookIds||[]).forEach(id=>{if(!known.has(id))known.set(id,{id,title:id})});
  meetingDetailKnownDocuments.set(record.meetingId,known);
  el('meeting-detail-files').innerHTML=[...known.values()].map(item=>{const linked=(record.relatedPitchbookIds||[]).includes(item.id);return'<div class="file-row"><div><strong>'+escapeHtml(item.title||item.id)+'</strong><div class="hint">'+escapeHtml(item.id)+' / '+escapeHtml(item.status||'状態未確認')+' / '+(linked?'関連あり':'この記録から解除済み')+'</div></div><button class="small-button" data-detail-file-open="'+escapeHtml(item.id)+'">原本</button><div class="row-actions"><button class="small-button" data-detail-classify="'+escapeHtml(item.id)+'">分類を編集</button><button class="small-button" data-detail-relation="'+escapeHtml(item.id)+'" data-operation="'+(linked?'remove':'add')+'"'+(record.status!=='Active'?' disabled':'')+'>'+(linked?'削除':'削除を取り消す')+'</button></div></div>'}).join('')||'<p class="hint">関連資料はありません。</p>';
  el('meeting-detail-empty').hidden=true;el('meeting-detail-content').hidden=false;el('meeting-detail-related-empty').hidden=true;el('meeting-detail-related-content').hidden=false;el('meeting-detail-close').disabled=false;
}
function resetMeetingDetailSelection(){
  meetingDetailRequest+=1;meetingDetailRecord=null;el('meeting-detail-identity').textContent='';el('meeting-detail-empty').hidden=false;el('meeting-detail-content').hidden=true;el('meeting-detail-related-empty').hidden=false;el('meeting-detail-related-content').hidden=true;el('meeting-detail-close').disabled=true;el('meeting-detail-card').setAttribute('aria-busy','false');clearStatus('meeting-detail-status');
  if(el('meeting-file-panel')&&el('meeting-file-home'))el('meeting-file-home').appendChild(el('meeting-file-panel'));if(el('meeting-file-actions')&&el('meeting-file-actions-home'))el('meeting-file-actions-home').appendChild(el('meeting-file-actions'));
  resetMeetingEditState();
}
async function openMeetingDetail(meetingId,trigger,internalRefresh){
  if(meetingDetailReadBusy||(!internalRefresh&&meetingDetailBusy))return false;
  meetingDetailReadBusy=true;if(trigger)trigger.disabled=true;el('meeting-detail-card').setAttribute('aria-busy','true');
  const request=++meetingDetailRequest;
  showStatus('meeting-detail-status','info busy','記録を読み込んでいます…');
  try{const result=await serverCall('getMeetingMaintenanceRecord',meetingId);if(request!==meetingDetailRequest)return false;if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'記録を読み込めません。');renderMeetingDetail(result.record);clearStatus('meeting-detail-status');el('meeting-detail-card').scrollIntoView({behavior:'smooth',block:'start'});return true}catch(error){showStatus('meeting-detail-status','error',error.message||String(error));return false}finally{meetingDetailReadBusy=false;el('meeting-detail-card').setAttribute('aria-busy','false');if(trigger&&trigger.isConnected)trigger.disabled=false}
}
async function changeDetailRelation(documentId,operation,trigger){
  if(meetingDetailBusy||pitchbookBusy||!meetingDetailRecord||!documentId)return false;
  meetingDetailBusy=true;if(trigger)trigger.disabled=true;el('meeting-detail-card').setAttribute('aria-busy','true');showStatus('meeting-detail-status','info busy','関連を更新しています…');
  try{
    bindPitchbookParent(meetingDetailRecord,true);
    await linkParentDocument(documentId,operation);
    await openMeetingDetail(meetingDetailRecord.meetingId,null,true);
    showStatus('meeting-detail-status','success',operation==='remove'?'この記録との関連のみ解除しました。原本と他の関連は維持されます。':'関連付けました。資料のStatusは変更していません。');
    return true;
  }catch(error){showStatus('meeting-detail-status','error',(error.message||String(error))+' 再試行時に現在の関係を照合します。');return false}
  finally{meetingDetailBusy=false;el('meeting-detail-card').setAttribute('aria-busy','false');if(trigger&&trigger.isConnected)trigger.disabled=false}
}
el('meeting-past-results').addEventListener('click',event=>{const button=event.target.closest('[data-meeting-detail]');if(button)openMeetingDetail(button.dataset.meetingDetail,button)});
el('meeting-detail-close').onclick=resetMeetingDetailSelection;
el('meeting-detail-edit').onclick=event=>{if(meetingDetailRecord)openMeetingEdit(meetingDetailRecord.meetingId,event.currentTarget)};
el('meeting-detail-lifecycle').onclick=async()=>{
  if(meetingDetailBusy||pitchbookBusy||!meetingDetailRecord)return;
  const record=meetingDetailRecord;if(record.status!=='Active'||!confirm('この記録を削除します。記録本体は完全には削除されず、管理者ページから復元できます。'))return;
  meetingDetailBusy=true;el('meeting-detail-lifecycle').disabled=true;el('meeting-detail-card').setAttribute('aria-busy','true');showStatus('meeting-detail-status','info busy','削除中…');
  try{const result=await serverCall('changeMeetingStatus',{meetingId:record.meetingId,expectedVersion:record.version,targetStatus:'Inactive'});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'削除できません。');resetMeetingDetailSelection();await searchMeetings()}catch(error){showStatus('meeting-detail-status','error',error.message||String(error))}finally{meetingDetailBusy=false;el('meeting-detail-card').setAttribute('aria-busy','false');if(meetingDetailRecord)el('meeting-detail-lifecycle').disabled=false}
};
el('meeting-detail-add-files').onclick=()=>{
  if(pitchbookBusy||meetingDetailBusy||!meetingDetailRecord)return;
  try{bindPitchbookParent(meetingDetailRecord,true);el('meeting-detail-file-home').appendChild(el('meeting-file-panel'));el('meeting-detail-file-home').appendChild(el('meeting-file-actions'));setPitchbookBusy(false);el('meeting-file-panel').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){showStatus('meeting-detail-status','error',error.message||String(error))}
};
el('meeting-detail-link').onclick=event=>openMeetingMaterialPicker(event.currentTarget);
el('meeting-detail-files').addEventListener('click',async event=>{
  const relation=event.target.closest('[data-detail-relation]'),classify=event.target.closest('[data-detail-classify]'),open=event.target.closest('[data-detail-file-open]');
  if(relation){relation.disabled=true;await changeDetailRelation(relation.dataset.detailRelation,relation.dataset.operation);if(relation.isConnected&&meetingDetailRecord)relation.disabled=meetingDetailRecord.status!=='Active';return}
  if(classify){el('meeting-detail-classification-home').appendChild(el('pitchbook-edit-card'));await openPitchbookEdit(classify.dataset.detailClassify);return}
  if(open){try{const result=await serverCall('getPitchbookMaintenanceRecord',open.dataset.detailFileOpen);if(!result||!result.ok)throw new Error('原本情報を読み込めません。');const url=kspSafeDriveUrl(result.record.fileUrl);if(!url)throw new Error('有効な原本リンクがありません。');showStatus('meeting-detail-status','info','<a target="_blank" rel="noopener" href="'+escapeHtml(url)+'">資料原本を開く</a>',true)}catch(error){showStatus('meeting-detail-status','error',error.message||String(error))}}
});
</script>
