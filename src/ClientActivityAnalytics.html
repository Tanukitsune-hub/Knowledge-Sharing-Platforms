<script>
let activityAnalyticsData=null,activityAnalyticsRequestSequence=0,activityAnalyticsLoaded=false,activityActiveView='graph',activityAdminCheckBusy=false;
const ACTIVITY_ANALYTICS_FILTERS=[
  ['counterpartyEntities','activity-filter-counterpartyEntity'],
  ['assetClasses','activity-filter-assetClass'],
  ['teams','activity-filter-team'],
  ['meetingTypes','activity-filter-meetingType'],
  ['statuses','activity-filter-status']
];
function activityDisplay(value){return String(value||'')==='__UNSET__'?'未設定':String(value==null?'':value)}
function activityPeriodLabel(value){return ({monthly:'月次',quarter:'四半期',calendarYear:'暦年',fiscalYear:'会計年度',custom:'日次',cumulative:'累積'})[value]||'期間'}
function activitySelectOptions(id,items){const node=el(id);if(!node)return;const current=node.value;node.innerHTML='<option value="">未選択</option>';(items||[]).forEach(item=>{const option=document.createElement('option');option.value=String(item.value||'');option.textContent=activityDisplay(item.label||item.value);node.appendChild(option)});if([...node.options].some(option=>option.value===current))node.value=current}
function activityPayload(){return{period:el('activity-period').value,dateFrom:el('activity-date-from').value,dateTo:el('activity-date-to').value,dimension:el('activity-dimension').value,filters:{counterpartyType:'',counterpartyEntity:el('activity-filter-counterpartyEntity').value,assetClass:el('activity-filter-assetClass').value,team:el('activity-filter-team').value,meetingType:el('activity-filter-meetingType').value,status:el('activity-filter-status').value}}}
function activityFilterOptions(data){ACTIVITY_ANALYTICS_FILTERS.forEach(([key,id])=>activitySelectOptions(id,data&&data.filterOptions?data.filterOptions[key]:[]))}
function activityMetricCards(metrics){const source=metrics||{};return[['面談件数',source.meetingCount||0],['有効な面談記録',source.activeMeetingCount||0],['面談先',source.distinctCounterpartyCount||0]].map(([label,value])=>'<div class="analytics-stat"><strong>'+kspEscapeHtml(value)+'</strong><span>'+label+'</span></div>').join('')}
function activityChart(items,field,label){const values=(items||[]).map(item=>Number(item[field]||0));if(!values.length)return'<p class="hint">該当するデータがありません。</p>';const max=Math.max(...values,1),width=Math.max(560,values.length*86),chartHeight=150,barWidth=Math.max(18,Math.min(58,Math.floor(width/Math.max(values.length*1.7,1))));return'<svg class="analytics-svg" viewBox="0 0 '+width+' 190" role="img" aria-label="'+kspEscapeHtml(label)+'"><line class="analytics-axis" x1="30" y1="'+(chartHeight+10)+'" x2="'+(width-12)+'" y2="'+(chartHeight+10)+'"></line>'+items.map((item,index)=>{const value=Number(item[field]||0),height=value/max*chartHeight,x=38+index*(width-54)/Math.max(items.length,1),y=chartHeight+10-height;return'<rect class="analytics-bar" x="'+x+'" y="'+y+'" width="'+barWidth+'" height="'+height+'" rx="3"><title>'+kspEscapeHtml(item.label)+': '+value+'</title></rect><text class="analytics-label" x="'+(x+barWidth/2)+'" y="'+Math.max(12,y-4)+'" text-anchor="middle">'+value+'</text><text class="analytics-label" x="'+(x+barWidth/2)+'" y="180" text-anchor="middle" transform="rotate(-35 '+(x+barWidth/2)+' 180)">'+kspEscapeHtml(item.label)+'</text>'}).join('')+'</svg>'}
function activityRenderSeries(series){const rows=(series||[]).map(item=>'<tr><td>'+kspEscapeHtml(item.label)+'</td><td>'+kspEscapeHtml(item.meetingCount)+'</td><td>'+kspEscapeHtml(item.activeMeetingCount)+'</td><td>'+kspEscapeHtml(item.distinctCounterpartyCount)+'</td></tr>').join('');el('activity-series-results').innerHTML=rows||'<tr><td colspan="4" class="empty-cell">該当なし</td></tr>';el('activity-series-chart').innerHTML=activityChart(series,'meetingCount','面談件数の期間推移')}
function activityRenderBreakdown(breakdown){const items=breakdown&&breakdown.items||[];const rows=items.map(item=>'<tr><td>'+kspEscapeHtml(item.label)+'</td><td>'+kspEscapeHtml(item.meetingCount)+'</td><td>'+kspEscapeHtml(item.activeMeetingCount)+'</td><td>'+kspEscapeHtml(item.distinctCounterpartyCount)+'</td></tr>').join('');el('activity-breakdown-results').innerHTML=rows||'<tr><td colspan="4" class="empty-cell">該当なし</td></tr>';el('activity-breakdown-chart').innerHTML=activityChart(items,'meetingCount','選択した内訳別の面談件数');const omitted=Number(breakdown&&breakdown.omittedCount||0);el('activity-breakdown-summary').textContent=(breakdown&&breakdown.totalCount||0)+'区分'+(omitted?'（'+omitted+'区分は省略）':'')}
function activityRenderDrill(records,omitted){const rows=(records||[]).map(record=>{const link=record.documentUrl?'<a class="small-link" href="'+kspEscapeHtml(kspSafeDriveUrl(record.documentUrl))+'" target="_blank" rel="noopener">原本</a>':'';const labels=(record.meetingTypeLabels||[]).join(' / ')||'未設定';const checkbox='<input class="activity-admin-check-input" type="checkbox" data-activity-admin-meeting="'+kspEscapeHtml(record.meetingId)+'" aria-label="'+kspEscapeHtml(record.meetingId)+' 確認済み"'+(record.adminCheckCompleted?' checked':'')+'>';return'<tr><td>'+kspEscapeHtml(record.date)+(record.time?'<br><span class="hint">'+kspEscapeHtml(record.time)+'</span>':'')+'</td><td>'+kspEscapeHtml(record.meetingId)+'</td><td>'+kspEscapeHtml(record.counterpartyName||'未設定')+'</td><td>'+kspEscapeHtml(record.teamName||'未設定')+'</td><td>'+kspEscapeHtml(labels)+'</td><td><span class="badge '+kspEscapeHtml(record.status)+'">'+kspEscapeHtml(record.status||'未設定')+'</span></td><td>'+link+'</td><td class="activity-admin-check-cell">'+checkbox+'</td></tr>'}).join('');el('activity-drill-results').innerHTML=rows||'<tr><td colspan="8" class="empty-cell">該当なし</td></tr>';el('activity-drill-summary').textContent=(records||[]).length+'件を表示'+(omitted?'（'+omitted+'件は省略）':'')}
function selectActivityView(view,focus){const next=view==='list'?'list':'graph';activityActiveView=next;document.querySelectorAll('[data-activity-view]').forEach(button=>{const selected=button.dataset.activityView===next;button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;if(selected&&focus)button.focus()});el('activity-graph-panel').hidden=next!=='graph';el('activity-list-panel').hidden=next!=='list'}
function activityRender(data){activityAnalyticsData=data;activityFilterOptions(data);const period=data.period||{};el('activity-period-summary').textContent=activityPeriodLabel(period.mode)+' / '+(period.startDate||'')+' - '+(period.endDate||'')+' / '+(period.bucketCount||0)+'期間';el('activity-headline').innerHTML=activityMetricCards(data.headline);activityRenderSeries(data.series||[]);activityRenderBreakdown(data.breakdown||{});activityRenderDrill(data.drill&&data.drill.records||[],data.drill&&data.drill.omittedCount||0)}
async function loadActivityAnalytics(trigger){const requestId=++activityAnalyticsRequestSequence;kspSetActionBusy(trigger,true,'集計中…');kspSetRegionBusy(el('page-activity-analytics'),true);showStatus('activity-analytics-status','info busy','集計中…');try{const result=await serverCall('getMeetingActivityAnalytics',activityPayload());if(requestId!==activityAnalyticsRequestSequence)return;if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'面談実績を集計できませんでした。');activityAnalyticsLoaded=true;activityRender(result);showStatus('activity-analytics-status','success','集計しました。')}catch(error){if(requestId===activityAnalyticsRequestSequence)showStatus('activity-analytics-status','error',error.message||String(error))}finally{kspSetActionBusy(trigger,false);if(requestId===activityAnalyticsRequestSequence)kspSetRegionBusy(el('page-activity-analytics'),false)}}
async function updateActivityAdminCheck(checkbox){if(activityAdminCheckBusy)return;const records=activityAnalyticsData&&activityAnalyticsData.drill&&activityAnalyticsData.drill.records;if(!Array.isArray(records))return;const meetingId=checkbox.dataset.activityAdminMeeting;const record=records.find(item=>item.meetingId===meetingId);if(!record){checkbox.checked=!checkbox.checked;await loadActivityAnalytics();showStatus('activity-admin-check-status','error','対象の面談記録を読み直しました。');return}const expectedCompleted=Boolean(record.adminCheckCompleted),expectedUpdatedAt=record.adminCheckUpdatedAt||'',desiredCompleted=Boolean(checkbox.checked);activityAdminCheckBusy=true;document.querySelectorAll('[data-activity-admin-meeting]').forEach(node=>{node.disabled=true});checkbox.setAttribute('aria-busy','true');kspSetRegionBusy(el('activity-list-panel'),true);showStatus('activity-admin-check-status','info busy','月次管理状態を更新中…');try{const result=await serverCall('updateMeetingAdminCheck',{meetingId:record.meetingId,desiredCompleted:desiredCompleted,expectedAdminCheckCompleted:expectedCompleted,expectedAdminCheckUpdatedAt:expectedUpdatedAt});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'月次管理状態の更新に失敗しました。');if(!result.adminCheck)throw new Error('月次管理状態の更新結果を読み込めません。');record.adminCheckCompleted=Boolean(result.adminCheck.completed);record.adminCheckUpdatedAt=result.adminCheck.updatedAt||'';record.adminCheckUpdatedBy=result.adminCheck.updatedBy||'';checkbox.checked=record.adminCheckCompleted;showStatus('activity-admin-check-status','success',result.changed?'月次管理状態を更新しました。':'状態は既に同じです。')}catch(error){checkbox.checked=expectedCompleted;await loadActivityAnalytics();showStatus('activity-admin-check-status','error',error.message||String(error))}finally{activityAdminCheckBusy=false;checkbox.setAttribute('aria-busy','false');kspSetRegionBusy(el('activity-list-panel'),false);document.querySelectorAll('[data-activity-admin-meeting]').forEach(node=>{node.disabled=false})}}
document.querySelectorAll('[data-activity-view]').forEach(button=>{button.addEventListener('click',()=>selectActivityView(button.dataset.activityView));button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?'graph':event.key==='End'?'list':activityActiveView==='graph'?'list':'graph';selectActivityView(next,true)})});
el('activity-analytics-refresh').onclick=event=>loadActivityAnalytics(event.currentTarget);el('activity-drill-results').addEventListener('change',event=>{const checkbox=event.target.closest('[data-activity-admin-meeting]');if(checkbox)updateActivityAdminCheck(checkbox)});el('nav-activity-analytics').onclick=()=>{showPage('activity-analytics');selectActivityView(activityActiveView);if(!activityAnalyticsLoaded)loadActivityAnalytics()};['activity-period','activity-date-from','activity-date-to','activity-dimension','activity-filter-counterpartyEntity','activity-filter-assetClass','activity-filter-team','activity-filter-meetingType','activity-filter-status'].forEach(id=>el(id).addEventListener('change',()=>{if(activityAnalyticsLoaded)loadActivityAnalytics()}));
</script>
