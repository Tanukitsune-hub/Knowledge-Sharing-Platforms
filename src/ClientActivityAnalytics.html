<script>
let activityAnalyticsData=null,activityAnalyticsRequestSequence=0,activityAnalyticsLoaded=false;
const ACTIVITY_ANALYTICS_FILTERS=[
  ['counterpartyType','activity-filter-counterpartyType'],
  ['counterpartyEntities','activity-filter-counterpartyEntity'],
  ['relatedGps','activity-filter-relatedGp'],
  ['assetClasses','activity-filter-assetClass'],
  ['teams','activity-filter-team'],
  ['meetingTypes','activity-filter-meetingType'],
  ['statuses','activity-filter-status']
];
function activityDisplay(value){return String(value||'')==='__UNSET__'?'未設定':String(value==null?'':value)}
function activitySelectOptions(id,items){const node=el(id);if(!node)return;const current=node.value;node.innerHTML='<option value="">未選択</option>';(items||[]).forEach(item=>{const option=document.createElement('option');option.value=String(item.value||'');option.textContent=activityDisplay(item.label||item.value);node.appendChild(option)});if([...node.options].some(option=>option.value===current))node.value=current}
function activityPayload(){return{period:el('activity-period').value,dateFrom:el('activity-date-from').value,dateTo:el('activity-date-to').value,dimension:el('activity-dimension').value,filters:{counterpartyType:el('activity-filter-counterpartyType').value,counterpartyEntity:el('activity-filter-counterpartyEntity').value,relatedGp:el('activity-filter-relatedGp').value,assetClass:el('activity-filter-assetClass').value,team:el('activity-filter-team').value,meetingType:el('activity-filter-meetingType').value,status:el('activity-filter-status').value}}}
function activityFilterOptions(data){ACTIVITY_ANALYTICS_FILTERS.forEach(([key,id])=>activitySelectOptions(id,data&&data.filterOptions?data.filterOptions[key]:[]))}
function activityMetricCards(metrics){const source=metrics||{};return[['Meeting',source.meetingCount||0],['Active',source.activeMeetingCount||0],['Counterparty',source.distinctCounterpartyCount||0],['要フォロー',source.openFollowUpCount||0]].map(([label,value])=>'<div class="analytics-stat"><strong>'+kspEscapeHtml(value)+'</strong><span>'+label+'</span></div>').join('')}
function activityChart(items,field,label){const values=(items||[]).map(item=>Number(item[field]||0));if(!values.length)return'<p class="hint">該当するデータがありません。</p>';const max=Math.max(...values,1),width=Math.max(560,values.length*86),chartHeight=150,barWidth=Math.max(18,Math.min(58,Math.floor(width/Math.max(values.length*1.7,1))));return'<svg class="analytics-svg" viewBox="0 0 '+width+' 190" role="img" aria-label="'+kspEscapeHtml(label)+'"><line class="analytics-axis" x1="30" y1="'+(chartHeight+10)+'" x2="'+(width-12)+'" y2="'+(chartHeight+10)+'"></line>'+items.map((item,index)=>{const value=Number(item[field]||0),height=value/max*chartHeight,x=38+index*(width-54)/Math.max(items.length,1),y=chartHeight+10-height;return'<rect class="analytics-bar" x="'+x+'" y="'+y+'" width="'+barWidth+'" height="'+height+'" rx="3"><title>'+kspEscapeHtml(item.label)+': '+value+'</title></rect><text class="analytics-label" x="'+(x+barWidth/2)+'" y="'+Math.max(12,y-4)+'" text-anchor="middle">'+value+'</text><text class="analytics-label" x="'+(x+barWidth/2)+'" y="180" text-anchor="middle" transform="rotate(-35 '+(x+barWidth/2)+' 180)">'+kspEscapeHtml(item.label)+'</text>'}).join('')+'</svg>'}
function activityRenderSeries(series){const rows=(series||[]).map(item=>'<tr><td>'+kspEscapeHtml(item.label)+'</td><td>'+kspEscapeHtml(item.meetingCount)+'</td><td>'+kspEscapeHtml(item.activeMeetingCount)+'</td><td>'+kspEscapeHtml(item.distinctCounterpartyCount)+'</td><td>'+kspEscapeHtml(item.openFollowUpCount)+'</td></tr>').join('');el('activity-series-results').innerHTML=rows||'<tr><td colspan="5" class="empty-cell">該当なし</td></tr>';el('activity-series-chart').innerHTML=activityChart(series,'meetingCount','Meeting件数の期間推移')}
function activityRenderBreakdown(breakdown){const items=breakdown&&breakdown.items||[];const rows=items.map(item=>'<tr><td>'+kspEscapeHtml(item.label)+'</td><td>'+kspEscapeHtml(item.meetingCount)+'</td><td>'+kspEscapeHtml(item.activeMeetingCount)+'</td><td>'+kspEscapeHtml(item.distinctCounterpartyCount)+'</td><td>'+kspEscapeHtml(item.openFollowUpCount)+'</td></tr>').join('');el('activity-breakdown-results').innerHTML=rows||'<tr><td colspan="5" class="empty-cell">該当なし</td></tr>';el('activity-breakdown-chart').innerHTML=activityChart(items,'meetingCount','選択した内訳別Meeting件数');const omitted=Number(breakdown&&breakdown.omittedCount||0);el('activity-breakdown-summary').textContent=(breakdown&&breakdown.totalCount||0)+'区分'+(omitted?'（'+omitted+'区分は省略）':'')}
function activityRenderDrill(records,omitted){const rows=(records||[]).map(record=>{const link=record.documentUrl?'<a class="small-link" href="'+kspEscapeHtml(kspSafeDriveUrl(record.documentUrl))+'" target="_blank" rel="noopener">Doc</a>':'';return'<tr><td>'+kspEscapeHtml(record.date)+(record.time?'<br><span class="hint">'+kspEscapeHtml(record.time)+'</span>':'')+'</td><td>'+kspEscapeHtml(record.meetingId)+'</td><td>'+kspEscapeHtml(record.counterpartyEntityKey||record.counterpartyId||'未設定')+'</td><td>'+kspEscapeHtml((record.relatedGpIds||[]).join(', ')||'未設定')+'</td><td>'+kspEscapeHtml(record.teamId||'未設定')+'<br><span class="hint">'+kspEscapeHtml((record.meetingTypeCodes||[]).join(', ')||'未設定')+'</span></td><td><span class="badge '+kspEscapeHtml(record.status)+'">'+kspEscapeHtml(record.status||'未設定')+'</span>'+(record.followUpRequired?'<br><span class="badge Pending">要フォロー</span>':'')+'</td><td>'+link+'</td></tr>'}).join('');el('activity-drill-results').innerHTML=rows||'<tr><td colspan="7" class="empty-cell">該当なし</td></tr>';el('activity-drill-summary').textContent=(records||[]).length+'件を表示'+(omitted?'（'+omitted+'件は省略）':'')}
function activityRenderAdminChecks(data){const card=el('activity-admin-check-card');if(!data||!data.adminCheckAvailable){card.classList.add('hidden-panel');el('activity-admin-check-results').innerHTML='';return}card.classList.remove('hidden-panel');const records=data.adminChecks||[];el('activity-admin-check-results').innerHTML=records.map(record=>'<tr><td>'+kspEscapeHtml(record.meetingId)+'</td><td>'+kspEscapeHtml(record.date)+'</td><td>'+kspEscapeHtml(record.counterpartyEntityKey||record.counterpartyId||'未設定')+'</td><td>'+(record.adminCheckCompleted?'反映済み':'未反映')+'</td><td><button class="small-button" type="button" data-activity-admin-meeting="'+kspEscapeHtml(record.meetingId)+'" data-activity-admin-desired="'+(!record.adminCheckCompleted)+'">'+(record.adminCheckCompleted?'未反映に戻す':'反映済みにする')+'</button></td></tr>').join('')||'<tr><td colspan="5" class="empty-cell">該当なし</td></tr>'}
function activityRender(data){activityAnalyticsData=data;activityFilterOptions(data);const period=data.period||{};el('activity-period-summary').textContent=(period.mode||'')+' / '+(period.startDate||'')+' - '+(period.endDate||'')+' / '+(period.bucketCount||0)+' bucket';el('activity-headline').innerHTML=activityMetricCards(data.headline);activityRenderSeries(data.series||[]);activityRenderBreakdown(data.breakdown||{});activityRenderDrill(data.drill&&data.drill.records||[],data.drill&&data.drill.omittedCount||0);activityRenderAdminChecks(data)}
async function loadActivityAnalytics(){const requestId=++activityAnalyticsRequestSequence;clearStatus('activity-analytics-status');showStatus('activity-analytics-status','info','集計中…');try{const result=await serverCall('getMeetingActivityAnalytics',activityPayload());if(requestId!==activityAnalyticsRequestSequence)return;if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Activity Analyticsの読み込みに失敗しました。');activityAnalyticsLoaded=true;activityRender(result);showStatus('activity-analytics-status','success','集計しました。')}catch(error){if(requestId===activityAnalyticsRequestSequence)showStatus('activity-analytics-status','error',error.message||String(error))}}
async function updateActivityAdminCheck(button){if(!activityAnalyticsData||!activityAnalyticsData.adminChecks)return;const meetingId=button.dataset.activityAdminMeeting;const record=activityAnalyticsData.adminChecks.find(item=>item.meetingId===meetingId);if(!record)return;button.disabled=true;clearStatus('activity-admin-check-status');try{const result=await serverCall('updateMeetingAdminCheck',{meetingId:record.meetingId,desiredCompleted:button.dataset.activityAdminDesired==='true',expectedAdminCheckCompleted:record.adminCheckCompleted,expectedAdminCheckUpdatedAt:record.adminCheckUpdatedAt||''});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'月次管理状態の更新に失敗しました。');showStatus('activity-admin-check-status','success',result.changed?'月次管理状態を更新しました。':'状態は既に同じです。');await loadActivityAnalytics()}catch(error){button.disabled=false;showStatus('activity-admin-check-status','error',error.message||String(error))}}
el('activity-analytics-refresh').onclick=loadActivityAnalytics;el('activity-admin-check-results').addEventListener('click',event=>{const button=event.target.closest('[data-activity-admin-meeting]');if(button)updateActivityAdminCheck(button)});el('nav-activity-analytics').onclick=()=>{showPage('activity-analytics');if(!activityAnalyticsLoaded)loadActivityAnalytics()};['activity-period','activity-date-from','activity-date-to','activity-dimension','activity-filter-counterpartyType','activity-filter-counterpartyEntity','activity-filter-relatedGp','activity-filter-assetClass','activity-filter-team','activity-filter-meetingType','activity-filter-status'].forEach(id=>el(id).addEventListener('change',()=>{if(activityAnalyticsLoaded)loadActivityAnalytics()}));
</script>
