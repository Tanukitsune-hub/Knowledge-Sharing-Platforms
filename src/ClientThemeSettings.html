<script>
let themeSettingsState=null;
let themeSettingsDraft=null;
let themeSettingsBusy=false;
let themeSettingsBusyButton=null;
let themeColorToolState=null;
function themeSettingsElement(id){return document.getElementById(id)}
function themeSettingsClone(value){return JSON.parse(JSON.stringify(value))}
function themeSettingsBootstrap(){
  const node=themeSettingsElement('ksp-theme-bootstrap');
  if(!node)return null;
  try{const value=JSON.parse(node.textContent||'{}');return value&&value.ok?value:null}catch(ignored){return null}
}
function themeSettingsHex(value){const normalized=String(value||'').trim().toUpperCase();return /^#[0-9A-F]{6}$/.test(normalized)?normalized:''}
function themeSettingsChannels(hex){const value=themeSettingsHex(hex);return value?[parseInt(value.slice(1,3),16),parseInt(value.slice(3,5),16),parseInt(value.slice(5,7),16)]:null}
function themeSettingsChannelsHex(channels){return'#'+channels.map(value=>Math.max(0,Math.min(255,Math.round(value))).toString(16).toUpperCase().padStart(2,'0')).join('')}
function themeColorHexToHsv(hex){
  const channels=themeSettingsChannels(hex);if(!channels)return null;
  const [red,green,blue]=channels.map(value=>value/255),max=Math.max(red,green,blue),min=Math.min(red,green,blue),difference=max-min;
  let hue=0;
  if(difference){if(max===red)hue=((green-blue)/difference)%6;else if(max===green)hue=(blue-red)/difference+2;else hue=(red-green)/difference+4;hue=(hue*60+360)%360}
  return{hue,saturation:max?difference/max:0,value:max};
}
function themeColorHsvToHex(hue,saturation,value){
  const h=((Number(hue)%360)+360)%360,s=Math.max(0,Math.min(1,Number(saturation))),v=Math.max(0,Math.min(1,Number(value)));
  const chroma=v*s,secondary=chroma*(1-Math.abs((h/60)%2-1)),offset=v-chroma;
  const sectors=[[chroma,secondary,0],[secondary,chroma,0],[0,chroma,secondary],[0,secondary,chroma],[secondary,0,chroma],[chroma,0,secondary]];
  return themeSettingsChannelsHex(sectors[Math.floor(h/60)].map(channel=>(channel+offset)*255));
}
function themeColorToolStatus(kind,message){showStatus('theme-color-tool-status',kind,message)}
function themeColorToolRender(){
  const state=themeColorToolState;if(!state)return;
  const valid=themeSettingsHex(themeSettingsElement('theme-color-hex').value);
  const hex=state.currentHex,hsv=state.hsv;
  themeSettingsElement('theme-color-swatch').style.backgroundColor=hex;
  themeSettingsElement('theme-color-rgb').textContent=themeSettingsChannels(hex).join(', ');
  themeSettingsElement('theme-color-hue').value=String(Math.round(hsv.hue));
  const field=themeSettingsElement('theme-color-sv');field.style.setProperty('--theme-color-hue',themeColorHsvToHex(hsv.hue,1,1));
  field.setAttribute('aria-valuenow',String(Math.round(hsv.value*100)));
  field.setAttribute('aria-valuetext','彩度 '+Math.round(hsv.saturation*100)+'%、明るさ '+Math.round(hsv.value*100)+'%');
  const handle=themeSettingsElement('theme-color-sv-handle');handle.style.left=(hsv.saturation*100)+'%';handle.style.top=((1-hsv.value)*100)+'%';
  themeSettingsElement('theme-color-apply').disabled=themeSettingsBusy||!valid;
}
function themeColorToolLoad(hex){
  const normalized=themeSettingsHex(hex);if(!normalized)return;
  themeColorToolState.currentHex=normalized;themeColorToolState.hsv=themeColorHexToHsv(normalized);
  const input=themeSettingsElement('theme-color-hex');input.value=normalized;input.setAttribute('aria-invalid','false');
  themeSettingsElement('theme-color-hex-error').hidden=true;themeColorToolRender();
}
function themeColorToolSelectKey(key){
  if(!themeColorToolState||!Object.hasOwn(themeSettingsDraft,key))return;
  themeColorToolState.activeKey=key;themeSettingsElement('theme-color-target').value=key;themeColorToolLoad(themeSettingsDraft[key]);clearStatus('theme-color-tool-status');
}
function themeColorToolSetHsv(hsv){
  themeColorToolState.hsv=hsv;themeColorToolState.currentHex=themeColorHsvToHex(hsv.hue,hsv.saturation,hsv.value);
  const input=themeSettingsElement('theme-color-hex');input.value=themeColorToolState.currentHex;input.setAttribute('aria-invalid','false');themeSettingsElement('theme-color-hex-error').hidden=true;
  themeColorToolRender();clearStatus('theme-color-tool-status');
}
function themeColorToolSetFromPoint(event){
  const rect=themeSettingsElement('theme-color-sv').getBoundingClientRect();
  themeColorToolSetHsv({...themeColorToolState.hsv,saturation:Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),value:1-Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))});
}
function themeColorToolInit(){
  const target=themeSettingsElement('theme-color-target');
  themeSettingsState.definitions.forEach(definition=>{const option=document.createElement('option');option.value=definition.key;option.textContent=definition.label;target.appendChild(option)});
  themeColorToolState={activeKey:themeSettingsState.definitions[0].key,currentHex:'',hsv:null};themeColorToolSelectKey(themeColorToolState.activeKey);
  target.addEventListener('change',()=>themeColorToolSelectKey(target.value));
  const field=themeSettingsElement('theme-color-sv');
  field.addEventListener('pointerdown',event=>{if(themeSettingsBusy)return;field.setPointerCapture(event.pointerId);themeColorToolSetFromPoint(event)});
  field.addEventListener('pointermove',event=>{if(!themeSettingsBusy&&field.hasPointerCapture(event.pointerId))themeColorToolSetFromPoint(event)});
  field.addEventListener('keydown',event=>{
    if(themeSettingsBusy)return;
    const delta=event.shiftKey?0.1:0.01,hsv={...themeColorToolState.hsv};
    if(event.key==='ArrowLeft')hsv.saturation=Math.max(0,hsv.saturation-delta);
    else if(event.key==='ArrowRight')hsv.saturation=Math.min(1,hsv.saturation+delta);
    else if(event.key==='ArrowUp')hsv.value=Math.min(1,hsv.value+delta);
    else if(event.key==='ArrowDown')hsv.value=Math.max(0,hsv.value-delta);
    else return;
    event.preventDefault();themeColorToolSetHsv(hsv);
  });
  themeSettingsElement('theme-color-hue').addEventListener('input',event=>{if(!themeSettingsBusy)themeColorToolSetHsv({...themeColorToolState.hsv,hue:Number(event.target.value)})});
  themeSettingsElement('theme-color-hex').addEventListener('input',event=>{
    const normalized=themeSettingsHex(event.target.value),invalid=!normalized;
    event.target.setAttribute('aria-invalid',String(invalid));themeSettingsElement('theme-color-hex-error').hidden=!invalid;
    if(normalized){event.target.value=normalized;themeColorToolState.currentHex=normalized;themeColorToolState.hsv=themeColorHexToHsv(normalized);themeColorToolRender()}
    else themeSettingsElement('theme-color-apply').disabled=true;
  });
  themeSettingsElement('theme-color-hex').addEventListener('change',event=>{const normalized=themeSettingsHex(event.target.value);if(normalized)event.target.value=normalized});
  themeSettingsElement('theme-color-apply').addEventListener('click',()=>{
    const hex=themeSettingsHex(themeSettingsElement('theme-color-hex').value);if(themeSettingsBusy||!hex)return;
    const key=themeColorToolState.activeKey;themeSettingsDraft[key]=hex;themeSettingsFillInputs();themeSettingsApplyPreview(themeSettingsDraft);themeSettingsMarkPreview();themeColorToolStatus('success','選択した色をプレビューへ適用しました。');
  });
  themeSettingsElement('theme-color-copy').addEventListener('click',async()=>{
    const hex=themeSettingsHex(themeSettingsElement('theme-color-hex').value);if(!hex)return;
    try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(hex);themeColorToolStatus('success','HEXコードをコピーしました。')}
    catch(ignored){const input=themeSettingsElement('theme-color-hex');input.focus();input.select();themeColorToolStatus('info','HEXコードを選択しました。コピーしてください。')}
  });
  if(typeof window.EyeDropper==='function'){
    const button=themeSettingsElement('theme-color-eyedropper');button.hidden=false;
    button.addEventListener('click',async()=>{try{const result=await new window.EyeDropper().open();if(result&&themeSettingsHex(result.sRGBHex))themeColorToolLoad(result.sRGBHex)}catch(ignored){/* Cancel is not an error. */}});
  }
}
function themeSettingsDerivedHex(sourceHex,sourceDefaultHex,targetDefaultHex){const source=themeSettingsChannels(sourceHex),sourceDefault=themeSettingsChannels(sourceDefaultHex),targetDefault=themeSettingsChannels(targetDefaultHex);return themeSettingsChannelsHex(source.map((value,index)=>value+targetDefault[index]-sourceDefault[index]))}
function themeSettingsCssVariables(palette){
  const variables={};
  themeSettingsState.definitions.forEach(definition=>{variables[definition.cssVariable]=palette[definition.key]});
  themeSettingsState.derivedRules.forEach(rule=>{variables[rule.cssVariable]=themeSettingsDerivedHex(palette[rule.sourceKey],rule.sourceDefaultHex,rule.defaultHex)});
  return variables;
}
function themeSettingsApplyPreview(palette){const style=document.documentElement.style;Object.entries(themeSettingsCssVariables(palette)).forEach(([name,value])=>style.setProperty(name,value))}
function themeSettingsSame(left,right){return themeSettingsState.definitions.every(definition=>left[definition.key]===right[definition.key])}
function themeSettingsStatus(kind,message){showStatus('theme-settings-status',kind,message)}
function themeSettingsSetBusy(busy,trigger,label){
  themeSettingsBusy=busy;
  if(busy&&trigger)themeSettingsBusyButton=trigger;
  if(themeSettingsBusyButton)kspSetActionBusy(themeSettingsBusyButton,busy,label||'処理中…');
  if(!busy)themeSettingsBusyButton=null;
  kspSetRegionBusy(themeSettingsElement('admin-panel-theme'),busy);
  ['theme-settings-save','theme-settings-discard','theme-settings-reset'].forEach(id=>{themeSettingsElement(id).disabled=busy});
  document.querySelectorAll('[data-theme-color],[data-theme-hex]').forEach(node=>{node.disabled=busy});
  ['theme-color-hue','theme-color-hex','theme-color-copy','theme-color-target','theme-color-eyedropper'].forEach(id=>{themeSettingsElement(id).disabled=busy});
  themeSettingsElement('theme-color-sv').setAttribute('aria-disabled',String(busy));
  if(themeColorToolState)themeColorToolRender();
}
function themeSettingsContrastRatio(left,right){
  const luminance=hex=>{const channels=themeSettingsChannels(hex).map(value=>{const normalized=value/255;return normalized<=.03928?normalized/12.92:Math.pow((normalized+.055)/1.055,2.4)});return .2126*channels[0]+.7152*channels[1]+.0722*channels[2]};
  const first=luminance(left),second=luminance(right);return(Math.max(first,second)+.05)/(Math.min(first,second)+.05)
}
function themeSettingsRenderContrast(){
  const palette=themeSettingsDraft;
  const softSurface=themeSettingsCssVariables(palette)['--theme-main-surface-soft'];
  const pairs=[
    ['Sidebar 文字 / 背景',palette['sidebar.text'],palette['sidebar.background']],
    ['メイン文字 / ページ背景',palette['text.primary'],palette['main.pageBackground']],
    ['メイン文字 / Card背景',palette['text.primary'],palette['main.cardBackground']],
    ['メイン文字 / Section見出し',palette['text.primary'],palette['main.sectionHeader']],
    ['補助文字 / ページ背景',palette['text.secondary'],palette['main.pageBackground']],
    ['補助文字 / Card背景',palette['text.secondary'],palette['main.cardBackground']],
    ['補助文字 / soft surface',palette['text.secondary'],softSurface],
    ['白文字 / Primary button','#FFFFFF',palette['action.primary']]
  ];
  const warnings=pairs.map(pair=>({label:pair[0],ratio:themeSettingsContrastRatio(pair[1],pair[2])})).filter(item=>item.ratio<4.5);
  if(warnings.length){showStatus('theme-contrast-warning','warning','コントラスト注意: '+warnings.map(item=>item.label+' '+item.ratio.toFixed(2)+':1').join(' / '))}
  else clearStatus('theme-contrast-warning');
}
function themeSettingsHasInvalid(){return[...document.querySelectorAll('[data-theme-hex]')].some(node=>node.getAttribute('aria-invalid')==='true')}
function themeSettingsRefreshState(){
  const dirty=!themeSettingsSame(themeSettingsDraft,themeSettingsState.palette);
  const invalid=themeSettingsHasInvalid();
  const saveAllowed=!themeSettingsBusy&&!invalid&&(dirty||!themeSettingsState.persisted);
  themeSettingsElement('theme-settings-save').disabled=!saveAllowed;
  themeSettingsElement('theme-settings-discard').disabled=themeSettingsBusy||!dirty;
  themeSettingsElement('theme-settings-state').textContent=(themeSettingsState.persisted?'共有設定を適用中':'既定の配色を使用中')+(dirty?' / 未保存のプレビュー':'');
  themeSettingsRenderContrast();
  return{dirty,invalid,saveAllowed};
}
function themeSettingsMarkPreview(){const state=themeSettingsRefreshState();if(state.invalid)themeSettingsStatus('error','色は#RRGGBB形式で入力してください。');else if(state.dirty)themeSettingsStatus('info','未保存のプレビュー');else clearStatus('theme-settings-status')}
function themeSettingsFillInputs(){
  themeSettingsState.definitions.forEach((definition,index)=>{
    const value=themeSettingsDraft[definition.key];
    themeSettingsElement('theme-color-'+index).value=value;
    const input=themeSettingsElement('theme-hex-'+index);input.value=value;input.setAttribute('aria-invalid','false');
  });
  if(themeColorToolState)themeColorToolLoad(themeSettingsDraft[themeColorToolState.activeKey]);
}
function themeSettingsRenderFields(){
  const host=themeSettingsElement('theme-settings-groups');host.innerHTML='';
  const groups=[];themeSettingsState.definitions.forEach(definition=>{if(!groups.includes(definition.group))groups.push(definition.group)});
  groups.forEach(group=>{
    const section=document.createElement('section');section.className='theme-settings-group';
    const heading=document.createElement('h3');heading.textContent=group;section.appendChild(heading);
    const grid=document.createElement('div');grid.className='theme-settings-grid';section.appendChild(grid);
    themeSettingsState.definitions.forEach((definition,index)=>{
      if(definition.group!==group)return;
      const row=document.createElement('div');row.className='theme-setting-row';row.dataset.themeKey=definition.key;
      const label=document.createElement('label');label.htmlFor='theme-hex-'+index;label.className='theme-setting-label';
      const title=document.createElement('strong');title.textContent=definition.label;const meta=document.createElement('span');meta.textContent=definition.colorName+' / 既定 '+definition.defaultHex;label.append(title,meta);
      const picker=document.createElement('input');picker.id='theme-color-'+index;picker.type='color';picker.value=themeSettingsDraft[definition.key];picker.dataset.themeColor=definition.key;picker.setAttribute('aria-label',definition.label+' カラーピッカー');
      const hex=document.createElement('input');hex.id='theme-hex-'+index;hex.type='text';hex.value=themeSettingsDraft[definition.key];hex.maxLength=7;hex.pattern='#[0-9A-Fa-f]{6}';hex.autocomplete='off';hex.spellcheck=false;hex.dataset.themeHex=definition.key;hex.setAttribute('aria-label',definition.label+' HEX');hex.setAttribute('aria-invalid','false');
      row.addEventListener('pointerdown',()=>themeColorToolSelectKey(definition.key));
      row.addEventListener('focusin',()=>{if(themeColorToolState.activeKey!==definition.key)themeColorToolSelectKey(definition.key)});
      picker.addEventListener('input',()=>{const value=picker.value.toUpperCase();themeSettingsDraft[definition.key]=value;hex.value=value;hex.setAttribute('aria-invalid','false');if(themeColorToolState.activeKey===definition.key)themeColorToolLoad(value);themeSettingsApplyPreview(themeSettingsDraft);themeSettingsMarkPreview()});
      hex.addEventListener('input',()=>{const value=themeSettingsHex(hex.value);hex.setAttribute('aria-invalid',String(!value));if(value){hex.value=value;picker.value=value;themeSettingsDraft[definition.key]=value;if(themeColorToolState.activeKey===definition.key)themeColorToolLoad(value);themeSettingsApplyPreview(themeSettingsDraft)}themeSettingsMarkPreview()});
      row.append(label,picker,hex);grid.appendChild(row);
    });
    host.appendChild(section);
  });
}
function themeSettingsAcceptState(result){themeSettingsState=themeSettingsClone(result);themeSettingsDraft=themeSettingsClone(result.palette);themeSettingsFillInputs();themeSettingsApplyPreview(themeSettingsDraft);themeSettingsRefreshState()}
async function themeSettingsSave(){
  if(themeSettingsBusy||themeSettingsHasInvalid()||(themeSettingsState.persisted&&themeSettingsSame(themeSettingsDraft,themeSettingsState.palette)))return;
  themeSettingsSetBusy(true,themeSettingsElement('theme-settings-save'),'保存中…');themeSettingsStatus('info busy','テーマ設定を保存中…');
  try{const result=await serverCall('mutateThemeSettings',{action:'SAVE',palette:themeSettingsDraft});if(!result||!result.ok)throw new Error(result&&result.error&&result.error.message||'テーマ設定を保存できませんでした。');themeSettingsAcceptState(result);themeSettingsStatus('success','保存しました')}
  catch(error){themeSettingsStatus('error',error.message||'テーマ設定を保存できませんでした。')}
  finally{themeSettingsSetBusy(false);themeSettingsRefreshState()}
}
function themeSettingsDiscard(){if(themeSettingsBusy)return;themeSettingsDraft=themeSettingsClone(themeSettingsState.palette);themeSettingsFillInputs();themeSettingsApplyPreview(themeSettingsDraft);themeSettingsRefreshState();themeSettingsStatus('info','変更を破棄しました。')}
async function themeSettingsReset(){
  if(themeSettingsBusy||!window.confirm('保存済みのテーマ設定を削除し、既定の配色に戻しますか？'))return;
  themeSettingsSetBusy(true,themeSettingsElement('theme-settings-reset'),'初期化中…');themeSettingsStatus('info busy','既定の配色へ戻しています…');
  try{const result=await serverCall('mutateThemeSettings',{action:'RESET'});if(!result||!result.ok)throw new Error(result&&result.error&&result.error.message||'既定の配色に戻せませんでした。');themeSettingsAcceptState(result);themeSettingsStatus('success','既定の配色に戻しました')}
  catch(error){themeSettingsStatus('error',error.message||'既定の配色に戻せませんでした。')}
  finally{themeSettingsSetBusy(false);themeSettingsRefreshState()}
}
themeSettingsState=themeSettingsBootstrap();
if(themeSettingsState){
  themeSettingsDraft=themeSettingsClone(themeSettingsState.palette);themeSettingsRenderFields();themeColorToolInit();themeSettingsApplyPreview(themeSettingsDraft);themeSettingsRefreshState();
  if(themeSettingsState.corruptOverrideIgnored)themeSettingsStatus('warning','保存済みテーマを確認できなかったため、既定の配色を表示しています。');
  themeSettingsElement('theme-settings-save').addEventListener('click',themeSettingsSave);
  themeSettingsElement('theme-settings-discard').addEventListener('click',themeSettingsDiscard);
  themeSettingsElement('theme-settings-reset').addEventListener('click',themeSettingsReset);
}else{
  themeSettingsSetBusy(true);themeSettingsStatus('error','テーマ設定を読み込めませんでした。');
}
</script>
