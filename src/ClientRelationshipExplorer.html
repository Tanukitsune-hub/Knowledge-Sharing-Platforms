<script>
let relationshipExplorerData=null,relationshipExplorerRequestSequence=0,relationshipExplorerLoaded=false;
const RELATIONSHIP_EXPLORER_FILTERS=[
  ['counterpartyTypes','relationship-counterparty-type'],
  ['counterpartyEntities','relationship-counterparty-entity'],
  ['relatedGps','relationship-related-gp'],
  ['pitchbookGps','relationship-pitchbook-gp'],
  ['assetClasses','relationship-asset-class'],
  ['fundStrategies','relationship-fund-strategy'],
  ['meetingStatuses','relationship-meeting-status'],
  ['pitchbookStatuses','relationship-pitchbook-status']
];
function relationshipText(value){return String(value==null?'':value)}
function relationshipBadge(value){const text=relationshipText(value||'未設定');return '<span class="badge '+kspEscapeHtml(text)+'">'+kspEscapeHtml(text)+'</span>'}
function relationshipSafeLink(url,label){const safe=kspSafeDriveUrl(url);return safe?'<a class="small-link" href="'+kspEscapeHtml(safe)+'" target="_blank" rel="noopener">'+kspEscapeHtml(label)+'</a>':''}
function relationshipSelectOptions(id,items){const node=el(id);if(!node)return;const current=node.value;node.innerHTML='<option value="">未選択</option>';(items||[]).forEach(item=>{const option=document.createElement('option');option.value=relationshipText(item.value);option.textContent=relationshipText(item.label||item.value);node.appendChild(option)});if([...node.options].some(option=>option.value===current))node.value=current}
function relationshipPayload(){return{dateFrom:el('relationship-date-from').value,dateTo:el('relationship-date-to').value,filters:{counterpartyType:el('relationship-counterparty-type').value,counterpartyEntity:el('relationship-counterparty-entity').value,relatedGp:el('relationship-related-gp').value,pitchbookGp:el('relationship-pitchbook-gp').value,assetClass:el('relationship-asset-class').value,fundStrategy:el('relationship-fund-strategy').value,meetingStatus:el('relationship-meeting-status').value,pitchbookStatus:el('relationship-pitchbook-status').value}}}
function relationshipApplyFilterOptions(data){RELATIONSHIP_EXPLORER_FILTERS.forEach(([key,id])=>relationshipSelectOptions(id,data&&data.filterOptions?data.filterOptions[key]:[]))}
function relationshipCounterparty(meeting){const type=meeting.counterpartyTypeLabel||meeting.counterpartyType||'未設定';const entity=meeting.counterpartyEntityName||meeting.counterpartyEntityKey||meeting.counterpartyId||'未設定';return '<strong>Meeting Counterparty</strong>: '+kspEscapeHtml(type)+' / '+kspEscapeHtml(entity)}
function relationshipRelatedGps(meeting){return (meeting.relatedGpNames||meeting.relatedGpIds||[]).map(kspEscapeHtml).join(', ')||'未設定'}
function relationshipTarget(target){if(target.unresolved)return '<div class="relationship-unresolved"><span class="badge Failed">未解決</span> '+kspEscapeHtml(target.documentId)+' <span class="hint">'+kspEscapeHtml(target.unresolvedReason||'PITCHBOOK_NOT_FOUND')+'</span></div>';return '<div><strong>Pitchbook GP</strong>: '+kspEscapeHtml(target.gpName||target.gpId||'未設定')+' / '+kspEscapeHtml(target.gpId||'未設定')+'<br>'+kspEscapeHtml(target.documentId)+' / '+kspEscapeHtml(target.savedFilename||target.originalFilename||'')+' '+relationshipBadge(target.status)+' '+relationshipSafeLink(target.fileUrl,'原本')+'<br><span class="hint">Asset Class: '+kspEscapeHtml(target.assetClassName||target.assetClassId||'未設定')+' / Fund / Strategy: '+kspEscapeHtml(target.fundStrategy||'未設定')+' / Date: '+kspEscapeHtml(target.date||'未設定')+'</span></div>'}
function relationshipRenderSummary(data){const summary=data&&data.summary||{};const cards=[['Relationships',summary.relationships||0],['Meetings',summary.meetings||0],['Pitchbooks',summary.pitchbooks||0],['Unresolved',summary.unresolved||0],['Inactive Meetings',summary.inactiveMeetings||0],['Inactive Pitchbooks',summary.inactivePitchbooks||0]];el('relationship-summary').innerHTML=cards.map(([label,value])=>'<div class="relationship-stat"><strong>'+kspEscapeHtml(value)+'</strong><span>'+kspEscapeHtml(label)+'</span></div>').join('');el('relationship-summary-note').textContent='明示的なstable ID関係 '+(summary.relationships||0)+'件。未解決・Inactiveも省略しません。'}
function relationshipRenderForward(records,omitted){const rows=(records||[]).map(item=>'<tr><td>'+kspEscapeHtml(item.date||'未設定')+(item.time?'<br><span class="hint">'+kspEscapeHtml(item.time)+'</span>':'')+'</td><td>'+kspEscapeHtml(item.meetingId)+'</td><td>'+relationshipCounterparty(item)+'</td><td>'+relationshipRelatedGps(item)+'</td><td>'+kspEscapeHtml(item.relatedPitchbookCount)+' / 全'+kspEscapeHtml(item.fullRelatedPitchbookCount)+'</td><td>'+relationshipBadge(item.status)+'</td><td><button class="small-button" type="button" data-relationship-meeting="'+kspEscapeHtml(item.meetingId)+'">詳細</button></td></tr>').join('');el('relationship-forward-results').innerHTML=rows||'<tr><td colspan="7" class="empty-cell">該当する明示的関係がありません。</td></tr>';const more=Number(omitted||0);if(more)el('relationship-forward-results').insertAdjacentHTML('beforeend','<tr><td colspan="7" class="empty-cell">さらに'+kspEscapeHtml(more)+'件は省略されています。</td></tr>')}
function relationshipRenderReverse(records,omitted){const rows=(records||[]).map(item=>'<tr><td>'+kspEscapeHtml(item.date||'未設定')+'</td><td>'+kspEscapeHtml(item.documentId)+'</td><td><strong>Pitchbook GP</strong>: '+kspEscapeHtml(item.gpName||item.gpId||'未設定')+' / '+kspEscapeHtml(item.gpId||'未設定')+'</td><td>'+kspEscapeHtml(item.assetClassName||item.assetClassId||'未設定')+'<br><span class="hint">'+kspEscapeHtml(item.fundStrategy||'未設定')+'</span></td><td>'+kspEscapeHtml(item.referencingMeetingCount)+' / 全'+kspEscapeHtml(item.fullReferencingMeetingCount)+'</td><td>'+relationshipBadge(item.status)+'</td><td><button class="small-button" type="button" data-relationship-pitchbook="'+kspEscapeHtml(item.documentId)+'">詳細</button></td></tr>').join('');el('relationship-reverse-results').innerHTML=rows||'<tr><td colspan="7" class="empty-cell">該当する解決済みPitchbookがありません。</td></tr>';const more=Number(omitted||0);if(more)el('relationship-reverse-results').insertAdjacentHTML('beforeend','<tr><td colspan="7" class="empty-cell">さらに'+kspEscapeHtml(more)+'件は省略されています。</td></tr>')}
function relationshipRenderForwardDetail(meetingId){const host=el('relationship-forward-detail');const item=(relationshipExplorerData&&relationshipExplorerData.forward&&relationshipExplorerData.forward.records||[]).find(record=>record.meetingId===meetingId);if(!item){host.innerHTML='';return}const targets=(item.relatedPitchbooks||[]).map(target=>'<div class="relationship-target">'+relationshipTarget(target)+'</div>').join('');host.innerHTML='<div class="relationship-detail-heading"><h3>Meeting '+kspEscapeHtml(item.meetingId)+'</h3><button class="small-button" type="button" data-relationship-edit-meeting="'+kspEscapeHtml(item.meetingId)+'">既存の面談保守で開く</button></div><div class="relationship-detail-grid"><div><strong>Meeting Counterparty</strong><br>'+relationshipCounterparty(item)+'</div><div><strong>Related GP</strong><br>'+relationshipRelatedGps(item)+'</div><div><strong>Meeting Asset Class / Team</strong><br>'+kspEscapeHtml(item.assetClassName||item.assetClassId||'未設定')+' / '+kspEscapeHtml(item.teamName||item.teamId||'未設定')+'</div><div><strong>Meeting Fund / Strategy</strong><br>'+kspEscapeHtml(item.fundStrategy||'未設定')+'</div><div><strong>Meeting Doc</strong><br>'+relationshipSafeLink(item.documentUrl,'原本')+'</div><div><strong>状態</strong><br>'+relationshipBadge(item.status)+'</div></div><h4>関連Pitchbook（表示 '+kspEscapeHtml((item.relatedPitchbooks||[]).length)+' / 条件一致 '+kspEscapeHtml(item.relatedPitchbookCount)+' / 全'+kspEscapeHtml(item.fullRelatedPitchbookCount)+'）</h4><div class="relationship-target-list">'+(targets||'<div class="empty-cell">該当なし</div>')+'</div>'}
function relationshipRenderReverseDetail(documentId){const host=el('relationship-reverse-detail');const item=(relationshipExplorerData&&relationshipExplorerData.reverse&&relationshipExplorerData.reverse.records||[]).find(record=>record.documentId===documentId);if(!item){host.innerHTML='';return}const meetings=(item.referencingMeetings||[]).map(meeting=>'<div class="relationship-target"><strong>Meeting '+kspEscapeHtml(meeting.meetingId)+'</strong> / '+kspEscapeHtml(meeting.date||'未設定')+' '+relationshipBadge(meeting.status)+'<br>'+relationshipCounterparty(meeting)+'<br><span class="hint">Related GP: '+relationshipRelatedGps(meeting)+' / Asset Class: '+kspEscapeHtml(meeting.assetClassName||meeting.assetClassId||'未設定')+' / Team: '+kspEscapeHtml(meeting.teamName||meeting.teamId||'未設定')+' / Fund / Strategy: '+kspEscapeHtml(meeting.fundStrategy||'未設定')+'</span> '+relationshipSafeLink(meeting.documentUrl,'Doc')+'</div>').join('');host.innerHTML='<div class="relationship-detail-heading"><h3>Pitchbook '+kspEscapeHtml(item.documentId)+'</h3></div><div class="relationship-detail-grid"><div><strong>Pitchbook GP</strong><br>'+kspEscapeHtml(item.gpName||item.gpId||'未設定')+' / '+kspEscapeHtml(item.gpId||'未設定')+'</div><div><strong>Pitchbook Asset Class / Fund</strong><br>'+kspEscapeHtml(item.assetClassName||item.assetClassId||'未設定')+' / '+kspEscapeHtml(item.fundStrategy||'未設定')+'</div><div><strong>Pitchbook Date / Filename</strong><br>'+kspEscapeHtml(item.date||'未設定')+' / '+kspEscapeHtml(item.savedFilename||item.originalFilename||'未設定')+'</div><div><strong>Pitchbook File</strong><br>'+relationshipSafeLink(item.fileUrl,'原本')+'</div><div><strong>状態</strong><br>'+relationshipBadge(item.status)+'</div></div><h4>参照Meeting（表示 '+kspEscapeHtml((item.referencingMeetings||[]).length)+' / 条件一致 '+kspEscapeHtml(item.referencingMeetingCount)+' / 全'+kspEscapeHtml(item.fullReferencingMeetingCount)+'）</h4><div class="relationship-target-list">'+(meetings||'<div class="empty-cell">該当なし</div>')+'</div>'}
function relationshipRender(data){relationshipExplorerData=data;relationshipExplorerLoaded=true;relationshipApplyFilterOptions(data);relationshipRenderSummary(data);relationshipRenderForward(data.forward&&data.forward.records||[],data.forward&&data.forward.omittedCount);relationshipRenderReverse(data.reverse&&data.reverse.records||[],data.reverse&&data.reverse.omittedCount);el('relationship-forward-detail').innerHTML='';el('relationship-reverse-detail').innerHTML=''}
async function loadRelationshipExplorer(){const requestId=++relationshipExplorerRequestSequence;clearStatus('relationship-explorer-status');showStatus('relationship-explorer-status','info','Relationship Explorerを読み込んでいます。');try{const result=await serverCall('getRelationshipExplorerData',relationshipPayload());if(requestId!==relationshipExplorerRequestSequence)return;if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'Relationship Explorerの読み込みに失敗しました。');relationshipRender(result);showStatus('relationship-explorer-status','success','明示的な関係を読み込みました。')}catch(error){if(requestId===relationshipExplorerRequestSequence)showStatus('relationship-explorer-status','error',error.message||String(error))}}
el('relationship-explorer-refresh').onclick=loadRelationshipExplorer;el('relationship-explorer-clear').onclick=()=>{['relationship-date-from','relationship-date-to','relationship-counterparty-type','relationship-counterparty-entity','relationship-related-gp','relationship-pitchbook-gp','relationship-asset-class','relationship-fund-strategy','relationship-meeting-status','relationship-pitchbook-status'].forEach(id=>{el(id).value='' });if(relationshipExplorerLoaded)loadRelationshipExplorer()};el('relationship-forward-results').addEventListener('click',event=>{const button=event.target.closest('[data-relationship-meeting]');if(button)relationshipRenderForwardDetail(button.dataset.relationshipMeeting)});el('relationship-reverse-results').addEventListener('click',event=>{const button=event.target.closest('[data-relationship-pitchbook]');if(button)relationshipRenderReverseDetail(button.dataset.relationshipPitchbook)});el('relationship-forward-detail').addEventListener('click',event=>{const button=event.target.closest('[data-relationship-edit-meeting]');if(button)showPage('meeting-past')});el('nav-relationship-explorer').onclick=()=>{showPage('relationship-explorer');if(!relationshipExplorerLoaded)loadRelationshipExplorer()};
</script>
