<style>
:root{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#202124;background:#f7f8fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f8fa}button,input,select,textarea{font:inherit}
.app-shell{max-width:1180px;margin:0 auto;padding:24px 18px 48px}.page-header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}.page-header h1{margin:0 0 6px;font-size:28px}.page-header p{margin:0;color:#5f6368;line-height:1.5}
.nav,.subnav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.subnav button{border:1px solid #c9cdd2;background:#fff;color:#174ea6;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}.nav button.active,.subnav button.active{background:#1a73e8;color:#fff;border-color:#1a73e8}.subnav{margin-bottom:14px}
.page,.subpage{display:none}.page.active,.subpage.active{display:block}.card{background:#fff;border:1px solid #dadce0;border-radius:14px;padding:22px;box-shadow:0 2px 8px rgba(60,64,67,.08);margin-bottom:16px}.card h2{margin:0 0 14px;font-size:20px}
.grid,.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field.grow{flex:1}label{font-size:14px;font-weight:600}.required::after{content:" *";color:#c5221f}
input,select,textarea{width:100%;border:1px solid #bdc1c6;border-radius:8px;padding:10px 12px;background:#fff;color:#202124}input:focus,select:focus,textarea:focus{outline:2px solid #1a73e8;outline-offset:1px;border-color:#1a73e8}textarea{min-height:220px;resize:vertical;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#5f6368;font-size:12px;line-height:1.5}
.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}.action-group{display:flex;gap:10px;flex-wrap:wrap}button.action,.action-link{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}button.primary{background:#1a73e8;color:#fff}button.secondary,.action-link{background:#eef2f7;color:#174ea6}button.warning{background:#fef7e0;color:#8a4b00}button:disabled{opacity:.55;cursor:default}

.retry-note{display:none;margin-top:12px;padding:10px 12px;background:#fef7e0;border-radius:8px;color:#8a4b00;font-size:13px}.retry-note.visible{display:block}.drop-zone{border:2px dashed #9aa0a6;border-radius:12px;padding:28px;text-align:center;background:#fafbfc;cursor:pointer}.drop-zone.dragover{border-color:#1a73e8;background:#e8f0fe}.file-list{margin-top:14px;display:grid;gap:9px}.file-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid #e0e3e7;border-radius:8px}.file-name{overflow-wrap:anywhere}.badge{font-size:12px;border-radius:999px;padding:4px 9px;background:#eef2f7}.badge.Active{background:#e6f4ea;color:#137333}.badge.Failed{background:#fce8e6;color:#a50e0e}.badge.Pending{background:#fef7e0;color:#8a4b00}.badge.Inactive{background:#eceff1;color:#5f6368}.summary{margin-top:10px;color:#5f6368;font-size:13px}.hidden-input,.hidden{display:none!important}
.table-wrap{margin-top:16px;overflow:auto;border:1px solid #e0e3e7;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e0e3e7;vertical-align:top}th{font-size:12px;color:#5f6368;background:#f8f9fa;position:sticky;top:0}tr:last-child td{border-bottom:0}.table-action{border:1px solid #c9cdd2;background:#fff;color:#174ea6;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700}.table-actions{display:flex;gap:6px;flex-wrap:wrap}.empty-cell{text-align:center;color:#5f6368;padding:24px}
.edit-panel{border-color:#aecbfa}.panel-header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.panel-header h2{margin:0 0 5px}.icon-button{border:1px solid #c9cdd2;background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}.readonly-box{border:1px solid #e0e3e7;border-radius:8px;padding:11px 12px;background:#f8f9fa;overflow-wrap:anywhere}.master-toolbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.master-toolbar .field{min-width:200px}.align-end{margin-bottom:1px}
