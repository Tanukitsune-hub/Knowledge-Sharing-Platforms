<script>
const KSP_QUERY_AUTO_POLL_LIMIT=12;
const KSP_QUERY_STORAGE_KEY='ksp.knowledge.query.v1';
const KSP_KNOWLEDGE_SOURCE_CONTROLS=[['Meeting','knowledge-source-meeting'],['Pitchbook','knowledge-source-pitchbook'],['News','knowledge-source-news'],['Internal Assessment','knowledge-source-assessment']];
const knowledgeState={freeQuestionDraft:'',appliedMode:'自由質問',savedPeriod:null,loading:true,configured:false,modeDefinitions:{},modelPolicies:{},options:{},exportPreview:null,exportBusy:false,exportRequestId:0,exportActionButton:null,pendingQueryToken:'',pendingQueryRoute:'OPENAI',pendingQueryFingerprint:'',pendingQueryStartedAt:0,pendingQueryPollCount:0,pendingQueryPolling:false,pendingQueryAutoStopped:false,pendingQueryTimer:null,startingQuery:false,queryRequestSequence:0};
function kEl(id){return document.getElementById(id)}
function kSafeKnowledgeDriveUrl(value){const candidate=String(value==null?'':value).trim();const docs=/^https:\/\/docs\.google\.com\/document\/d\/[^/?#&]+(?:[/?#]|$)/i;const file=/^https:\/\/drive\.google\.com\/file\/d\/[^/?#&]+(?:[/?#]|$)/i;const open=/^https:\/\/drive\.google\.com\/(?:open|uc)\?[^#]*\bid=[^&#]+/i;return docs.test(candidate)||file.test(candidate)||open.test(candidate)?candidate:''}
function kShowStatus(kind,message){const box=kEl('knowledge-status');box.className='status visible '+kind;box.textContent=message;if(kind==='error')kEl('knowledge-result').classList.add('hidden-panel')}
function kClearStatus(){const box=kEl('knowledge-status');box.className='status';box.textContent=''}
function kShowExportStatus(kind,message){const box=kEl('knowledge-export-status');box.className='status visible '+kind;box.textContent=message}
function kClearExportStatus(){const box=kEl('knowledge-export-status');box.className='status';box.textContent=''}
function kServerCall(name,payload){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)})}
function kAddOptions(id,options){const select=kEl(id);select.innerHTML='<option value="">未選択</option>';(options||[]).forEach(option=>{const node=document.createElement('option');node.value=option.id;node.textContent=option.name+(option.status==='Inactive'?'（Inactive）':'');select.appendChild(node)})}
function kRefreshEntityOptions(){const type=kEl('knowledge-counterpartyType').value;const selected=kEl('knowledge-entityKey').value;kAddOptions('knowledge-entityKey',(knowledgeState.options.counterpartyEntities||[]).filter(item=>!type||item.type===type));if([...kEl('knowledge-entityKey').options].some(option=>option.value===selected))kEl('knowledge-entityKey').value=selected}
function kRefreshMultiEntityOptions(){const select=kEl('knowledge-entityKeys');const selected=new Set([...select.selectedOptions].map(option=>option.value));select.innerHTML='';(knowledgeState.options.counterpartyEntities||[]).forEach(item=>{const option=document.createElement('option');option.value=item.entityKey||item.id;option.textContent=(item.type||'Entity')+' / '+item.name+(item.status==='Inactive'?'（Inactive）':'');option.selected=selected.has(option.value);select.appendChild(option)})}
function kSelectedEntityKeys(){return[...kEl('knowledge-entityKeys').selectedOptions].map(option=>option.value)}
function kSelectedSourceTypes(){return KSP_KNOWLEDGE_SOURCE_CONTROLS.filter(item=>kEl(item[1]).checked).map(item=>item[0])}
function kSourceTypeLabel(sourceType){const catalog=knowledgeState.options.sourceTypes||[];const item=catalog.find(option=>option.id===sourceType);return item&&item.name||String(sourceType||'')}
function kSelectedSourceScopeText(){const types=kSelectedSourceTypes();return '情報ソース: '+(types.length?types.map(kSourceTypeLabel).join('・'):'未選択')}
function kSourceSelectionIssue(filters){const types=filters.sourceTypes||[];if(!types.length)return '情報ソースを1つ以上選択してください。';if((filters.teamId||filters.followUp||filters.meetingTypeCode||filters.relatedGpId)&&(types.length!==1||types[0]!=='Meeting'))return 'チーム・MTG種別などの面談条件は「面談メモ」のみを選択してください。';return ''}
function kSetBusy(busy){const route=kEl('knowledge-route').value;const pending=Boolean(knowledgeState.pendingQueryToken);const waiting=Boolean(busy)||knowledgeState.startingQuery,actionBusy=waiting||pending,button=kEl('knowledge-submit'),busyLabel=knowledgeState.startingQuery?'AI検索を開始中…':pending?'検索結果を確認中…':'AI検索中…';kspSetActionBusy(button,actionBusy,busyLabel);button.disabled=actionBusy||knowledgeState.loading||!knowledgeState.configured||route==='FULL_EXPORT'||!kSelectedSourceTypes().length;kspSetRegionBusy(kEl('knowledge-form'),actionBusy);kEl('knowledge-clear').disabled=waiting;kEl('knowledge-model-profile').disabled=waiting||pending||route==='FULL_EXPORT'||!kEl('knowledge-model-profile').options.length;kEl('knowledge-thinking-profile').disabled=waiting||pending||route==='FULL_EXPORT'||!kEl('knowledge-thinking-profile').options.length;const recheck=kEl('knowledge-recheck');if(recheck){recheck.hidden=!pending;recheck.disabled=waiting||knowledgeState.pendingQueryPolling}}
function kSetExportBusy(busy,trigger,label){knowledgeState.exportBusy=busy;if(busy&&trigger)knowledgeState.exportActionButton=trigger;if(knowledgeState.exportActionButton)kspSetActionBusy(knowledgeState.exportActionButton,busy,label||'処理中…');if(!busy)knowledgeState.exportActionButton=null;kspSetRegionBusy(kEl('knowledge-export-section'),busy);const missingSource=!kSelectedSourceTypes().length;kEl('knowledge-export-preview-button').disabled=busy||missingSource;kEl('knowledge-full-output').disabled=busy||missingSource;kEl('knowledge-export-prompt').disabled=busy||missingSource;const preview=knowledgeState.exportPreview;const blocked=!preview||preview.noResults||preview.hardStop;kEl('knowledge-export-copy').disabled=busy||blocked||!preview.packageText;kEl('knowledge-export-docs').disabled=busy||blocked;kEl('knowledge-export-pdf').disabled=busy||blocked}
function kRenderCitations(citations,evidence){const list=kEl('knowledge-citations');list.innerHTML='';const all=citations||[];const appendCitation=citation=>{const item=document.createElement('li');item.className='citation-item';const link=document.createElement('a');const safeUrl=kSafeKnowledgeDriveUrl(citation.driveUrl);if(safeUrl)link.href=safeUrl;else link.setAttribute('aria-disabled','true');link.target='_blank';link.rel='noopener';link.textContent=citation.title||citation.sourceId;const meta=document.createElement('div');meta.className='citation-meta';meta.textContent=[kSourceTypeLabel(citation.sourceType),citation.sourceId,citation.entityKey,citation.date,citation.provenanceSummary,citation.pageNumber?'p.'+citation.pageNumber:''].filter(Boolean).join(' / ');item.append(link,meta);list.appendChild(item)};if((evidence||[]).length){(evidence||[]).forEach(entity=>{const heading=document.createElement('li');heading.className='citation-item';const strong=document.createElement('strong');strong.textContent=(entity.displayName||entity.entityKey)+' / '+entity.entityKey;heading.appendChild(strong);list.appendChild(heading);(entity.citations||[]).forEach(appendCitation);if(!(entity.citations||[]).length){const gap=document.createElement('li');gap.className='hint';gap.textContent='この面談先の参照資料はありません。';list.appendChild(gap)}})}else{all.forEach(appendCitation)}if(!all.length&&!(evidence||[]).length){const item=document.createElement('li');item.className='hint';item.textContent='参照できる原本はありません。';list.appendChild(item)}}
function kRenderEntityEvidence(evidence){const box=kEl('knowledge-entity-evidence');const items=evidence||[];box.hidden=!items.length;box.textContent='';if(!items.length)return;items.forEach(item=>{const row=document.createElement('div');const label=document.createElement('strong');label.textContent=(item.displayName||item.entityKey)+' / '+item.entityKey;const state=document.createElement('span');state.className='hint';state.textContent=' — '+(item.evidenceStatus==='CITED'?'根拠資料 '+Number(item.citationCount||0)+'件':'証拠不足');row.append(label,state);box.appendChild(row)})}
function kClearPendingQuery(){if(knowledgeState.pendingQueryTimer){clearTimeout(knowledgeState.pendingQueryTimer);knowledgeState.pendingQueryTimer=null}knowledgeState.pendingQueryToken='';knowledgeState.pendingQueryRoute='OPENAI';knowledgeState.pendingQueryFingerprint='';knowledgeState.pendingQueryStartedAt=0;knowledgeState.pendingQueryPollCount=0;knowledgeState.pendingQueryPolling=false;knowledgeState.pendingQueryAutoStopped=false;try{if(typeof sessionStorage!=='undefined')sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY)}catch(error){}const recheck=kEl('knowledge-recheck');if(recheck)recheck.hidden=true;kSetBusy(false)}
function kPersistPendingQuery(){if(!knowledgeState.pendingQueryToken)return;try{if(typeof sessionStorage!=='undefined')sessionStorage.setItem(KSP_QUERY_STORAGE_KEY,JSON.stringify({queryToken:knowledgeState.pendingQueryToken,route:knowledgeState.pendingQueryRoute,fingerprint:knowledgeState.pendingQueryFingerprint,startedAt:knowledgeState.pendingQueryStartedAt,pollCount:knowledgeState.pendingQueryPollCount,autoStopped:knowledgeState.pendingQueryAutoStopped}))}catch(error){}}
function kLoadPendingQuery(){try{if(typeof sessionStorage==='undefined')return;const raw=sessionStorage.getItem(KSP_QUERY_STORAGE_KEY);if(!raw)return;const saved=JSON.parse(raw);if(!saved||typeof saved.queryToken!=='string'||!saved.queryToken.trim()||saved.queryToken.length>128){sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY);return}knowledgeState.pendingQueryToken=saved.queryToken.trim();knowledgeState.pendingQueryRoute=saved.route==='GEMINI'?'GEMINI':'OPENAI';knowledgeState.pendingQueryFingerprint=typeof saved.fingerprint==='string'?saved.fingerprint:'';knowledgeState.pendingQueryStartedAt=Number(saved.startedAt)||Date.now();knowledgeState.pendingQueryPollCount=Number(saved.pollCount)||0;knowledgeState.pendingQueryAutoStopped=Boolean(saved.autoStopped)}catch(error){try{sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY)}catch(ignored){}}}
function kKnowledgeQueryFingerprint(payload){const value=payload||{};const identity=JSON.stringify({route:value.route||'',modelProfileId:value.modelProfileId||'',thinkingProfileId:value.thinkingProfileId||'',mode:value.mode||'',questionOrInstruction:value.questionOrInstruction||'',filters:value.filters||{},selectedEntityKeys:value.selectedEntityKeys||[]});let hash=0xcbf29ce484222325n;for(let i=0;i<identity.length;i++)hash=((hash^BigInt(identity.charCodeAt(i)))*0x100000001b3n)&0xffffffffffffffffn;return identity.length.toString(16)+':'+hash.toString(16).padStart(16,'0')}
function kKnowledgeRequestIsCurrent(requestId,fingerprint){return requestId===knowledgeState.queryRequestSequence&&fingerprint===kKnowledgeQueryFingerprint(kPayload())}
function kKnowledgePendingElapsed(){return knowledgeState.pendingQueryStartedAt?Math.max(0,Date.now()-knowledgeState.pendingQueryStartedAt):0}
function kShowPendingStatus(result){const elapsed=Math.floor(kKnowledgePendingElapsed()/1000);const long=Boolean(result&&result.longRunning)||knowledgeState.pendingQueryAutoStopped||elapsed>=60;kShowStatus((long?'warning':'info')+' busy',kSelectedSourceScopeText()+' / 検索を処理中です。経過 '+elapsed+'秒'+(long?'（時間がかかっていますが、失敗ではありません）':'。結果を確認しています。'));const recheck=kEl('knowledge-recheck');if(recheck)recheck.hidden=false}
function kClearPendingQueryForTerminal(){if(knowledgeState.pendingQueryTimer){clearTimeout(knowledgeState.pendingQueryTimer);knowledgeState.pendingQueryTimer=null}knowledgeState.pendingQueryToken='';knowledgeState.pendingQueryRoute='OPENAI';knowledgeState.pendingQueryFingerprint='';knowledgeState.pendingQueryStartedAt=0;knowledgeState.pendingQueryPollCount=0;knowledgeState.pendingQueryAutoStopped=false;try{if(typeof sessionStorage!=='undefined')sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY)}catch(error){}const recheck=kEl('knowledge-recheck');if(recheck)recheck.hidden=true}
function kRenderResult(result){kClearPendingQueryForTerminal();kEl('knowledge-result').classList.remove('hidden-panel');const selection=result.effectiveSelection||{};kEl('knowledge-result-scope').textContent=[result.mode,kSelectedSourceScopeText(),result.scopeSummary,selection.modelProfileId,selection.thinkingProfileId].filter(Boolean).join(' / ');kEl('knowledge-answer').textContent=result.answer||'確認できる根拠が不足しています。';kEl('knowledge-evidence-note').textContent=result.insufficientEvidence?'根拠が不足している可能性があります。':'回答は下記の原資料に基づきます。';kRenderEntityEvidence(result.entityEvidence||[]);kRenderCitations(result.citations||[],result.entityEvidence||[]);kSetBusy(false)}
function kCommonKnowledgeFilters(){const filters={dateFrom:kEl('knowledge-dateFrom').value,dateTo:kEl('knowledge-dateTo').value,entityKey:kEl('knowledge-entityKey').value,assetClassId:kEl('knowledge-assetClassId').value,capitalTypeId:kEl('knowledge-capitalTypeId').value,teamId:kEl('knowledge-teamId').value,fundStrategy:kEl('knowledge-fundStrategy').value,followUp:kEl('knowledge-followUp').value,meetingTypeCode:kEl('knowledge-meetingTypeCode').value,sourceTypes:kSelectedSourceTypes()};return filters}
function kPayload(){const comparison=kEl('knowledge-mode').value==='比較';const filters=kCommonKnowledgeFilters();if(comparison)filters.entityKey='';return{route:kEl('knowledge-route').value,mode:kEl('knowledge-mode').value,questionOrInstruction:kEl('knowledge-instruction').value,filters:filters,selectedEntityKeys:comparison?kSelectedEntityKeys():(filters.entityKey?[filters.entityKey]:[]),modelProfileId:kEl('knowledge-model-profile').value,thinkingProfileId:kEl('knowledge-thinking-profile').value}}
function kExportPayload(){const comparison=kEl('knowledge-mode').value==='比較';const filters=kCommonKnowledgeFilters();if(comparison)filters.entityKey='';return{route:'FULL_EXPORT',filters:filters,selectedEntityKeys:comparison?kSelectedEntityKeys():(filters.entityKey?[filters.entityKey]:[])}}
function kSetDefaultKnowledgePeriod(){kspSetDefaultDateRange('knowledge-dateFrom','knowledge-dateTo')}
function kApplyAllPeriod(){const all=kEl('knowledge-all-period').checked;if(all){knowledgeState.savedPeriod=[kEl('knowledge-dateFrom').value,kEl('knowledge-dateTo').value];kEl('knowledge-dateFrom').value='';kEl('knowledge-dateTo').value=''}else if(knowledgeState.savedPeriod){[kEl('knowledge-dateFrom').value,kEl('knowledge-dateTo').value]=knowledgeState.savedPeriod}kEl('knowledge-dateFrom').disabled=all;kEl('knowledge-dateTo').disabled=all;kInvalidateKnowledgeSelection()}
function kScheduleKnowledgePoll(payload,delay){if(!knowledgeState.pendingQueryToken||knowledgeState.pendingQueryAutoStopped)return;if(knowledgeState.pendingQueryTimer)clearTimeout(knowledgeState.pendingQueryTimer);const wait=Math.min(30000,Math.max(1000,Number(delay)||1000));knowledgeState.pendingQueryTimer=setTimeout(()=>{knowledgeState.pendingQueryTimer=null;kPollKnowledgeQuery(payload,null)},wait)}
function kStartKnowledgeQuery(payload,requestId,fingerprint){const identity=fingerprint||kKnowledgeQueryFingerprint(payload),id=requestId===undefined?++knowledgeState.queryRequestSequence:requestId;return kServerCall('searchKnowledge',payload).then(result=>{if(!kKnowledgeRequestIsCurrent(id,identity))return{stale:true};if(result&&result.pending&&result.queryToken){knowledgeState.pendingQueryToken=String(result.queryToken);knowledgeState.pendingQueryRoute=payload&&payload.route==='GEMINI'?'GEMINI':'OPENAI';knowledgeState.pendingQueryFingerprint=identity;knowledgeState.pendingQueryStartedAt=Date.now();knowledgeState.pendingQueryPollCount=Number(result.pollCount)||0;knowledgeState.pendingQueryAutoStopped=false;kPersistPendingQuery();kShowPendingStatus(result);kSetBusy(false);kScheduleKnowledgePoll({route:knowledgeState.pendingQueryRoute},result.pollAfterMillis)}return result})}
async function kPollKnowledgeQuery(payload,initial){if(knowledgeState.pendingQueryPolling)return;const token=String((initial&&initial.queryToken)||knowledgeState.pendingQueryToken||'');if(!token)return;const route=payload&&payload.route?payload.route:knowledgeState.pendingQueryRoute||'OPENAI',requestId=knowledgeState.queryRequestSequence,fingerprint=knowledgeState.pendingQueryFingerprint;if(!kKnowledgeRequestIsCurrent(requestId,fingerprint)){kInvalidateKnowledgeSelection();return}knowledgeState.pendingQueryPolling=true;kSetBusy(false);try{const current=initial||await kServerCall('searchKnowledge',{route:route,queryPhase:'POLL',queryToken:token});if(!kKnowledgeRequestIsCurrent(requestId,fingerprint)||knowledgeState.pendingQueryToken!==token)return;if(current&&current.pending){knowledgeState.pendingQueryToken=String(current.queryToken||token);knowledgeState.pendingQueryPollCount=Number(current.pollCount)||knowledgeState.pendingQueryPollCount+1;kPersistPendingQuery();kShowPendingStatus(current);if(knowledgeState.pendingQueryPollCount>=KSP_QUERY_AUTO_POLL_LIMIT){knowledgeState.pendingQueryAutoStopped=true;kPersistPendingQuery();kShowPendingStatus({longRunning:true})}else{kScheduleKnowledgePoll({route:route},current.pollAfterMillis)}return}if(current&&current.ok){kRenderResult(current);const warningCount=(current.warnings||[]).length;kShowStatus(warningCount?'warning':'success',warningCount?'回答しましたが、参照資料と根拠を確認してください。':'回答しました。');return}kClearPendingQueryForTerminal();kShowStatus('error',current&&current.error?current.error.message:'検索に失敗しました。')}catch(error){if(kKnowledgeRequestIsCurrent(requestId,fingerprint)&&knowledgeState.pendingQueryToken===token)kShowPendingStatus({longRunning:true})}finally{if(requestId===knowledgeState.queryRequestSequence){knowledgeState.pendingQueryPolling=false;kSetBusy(false)}}}
function kResumePendingKnowledgeQuery(){if(!knowledgeState.pendingQueryToken)return;if(knowledgeState.pendingQueryFingerprint!==kKnowledgeQueryFingerprint(kPayload())){kClearPendingQuery();kEl('knowledge-result').classList.add('hidden-panel');kShowStatus('info','前回の検索条件が変わったため、検索を再実行してください。');return}knowledgeState.queryRequestSequence+=1;kShowPendingStatus({longRunning:knowledgeState.pendingQueryAutoStopped});kSetBusy(false);if(!knowledgeState.pendingQueryAutoStopped)kPollKnowledgeQuery({route:knowledgeState.pendingQueryRoute||'OPENAI'},null)}
function kRunKnowledgeQuery(payload){if(knowledgeState.pendingQueryToken)return Promise.resolve({ok:true,pending:true,queryToken:knowledgeState.pendingQueryToken});return kStartKnowledgeQuery(payload)}
function kApplyMode(){const mode=kEl('knowledge-mode').value;const instruction=kEl('knowledge-instruction');if(knowledgeState.appliedMode==='自由質問')knowledgeState.freeQuestionDraft=instruction.value;instruction.readOnly=mode!=='自由質問';instruction.value=instruction.readOnly?(knowledgeState.modeDefinitions[mode]||{}).instruction||'':knowledgeState.freeQuestionDraft;knowledgeState.appliedMode=mode;const comparison=mode==='比較';const definition=knowledgeState.modeDefinitions[mode]||{inputLabel:'追加指示',placeholder:'',inputRequired:false,targetRequired:false};const label=kEl('knowledge-instruction-label');label.textContent='質問・追加指示';label.classList.toggle('required',Boolean(definition.inputRequired));kEl('knowledge-instruction').placeholder=definition.placeholder||'';kEl('knowledge-entity-label').classList.toggle('required',Boolean(definition.targetRequired));kEl('knowledge-multi-entity-field').hidden=!comparison;kEl('knowledge-entityKey').disabled=false;kEl('knowledge-counterpartyType').disabled=comparison;kEl('knowledge-mode-help').textContent=definition.targetRequired?'面談準備は上段の面談先を使います。表示された質問は読み取り専用です。':(definition.inputRequired?'質問を入力してください。参照資料から原本を開けます。':(comparison?'比較する面談先を2–5件選択してください。':'表示された質問は読み取り専用です。選択した条件の資料を横断して整理します。'))}
function kSelectedModelProfile(){const route=kEl('knowledge-route').value;const policy=knowledgeState.modelPolicies[route]||{profiles:[]};return(policy.profiles||[]).find(profile=>profile.profileId===kEl('knowledge-model-profile').value)||null}
function kApplyThinkingChoices(){const select=kEl('knowledge-thinking-profile');const profile=kSelectedModelProfile();select.innerHTML='';(profile&&profile.thinkingProfiles||[]).forEach(thinking=>{const option=document.createElement('option');option.value=thinking.thinkingProfileId;option.textContent=thinking.label;if(thinking.isDefault)option.selected=true;select.appendChild(option)});kSetBusy(false)}
function kApplyModelPolicy(){const route=kEl('knowledge-route').value;const controls=kEl('knowledge-model-controls');controls.hidden=route==='FULL_EXPORT';const select=kEl('knowledge-model-profile');select.innerHTML='';const policy=knowledgeState.modelPolicies[route]||{profiles:[]};(policy.profiles||[]).forEach(profile=>{const option=document.createElement('option');option.value=profile.profileId;option.textContent=profile.displayName;if(profile.isDefault)option.selected=true;select.appendChild(option)});kApplyThinkingChoices()}
function kApplyRouteSurface(){const routeSelect=kEl('knowledge-route');const geminiReady=Boolean(knowledgeState.modelPolicies.GEMINI&&(knowledgeState.modelPolicies.GEMINI.profiles||[]).length);const geminiOption=[...routeSelect.options].find(option=>option.value==='GEMINI');if(geminiOption&&!geminiReady){const wasGemini=routeSelect.value==='GEMINI';geminiOption.remove();if(wasGemini)routeSelect.value='OPENAI'}const full=routeSelect.value==='FULL_EXPORT';kSetBusy(false)}
function kUpdateExportScope(){kEl('knowledge-export-scope').textContent=kSelectedSourceScopeText()+' / 選択した面談先・期間・条件を適用します。'}
function kInvalidateExportPreview(){knowledgeState.exportRequestId+=1;knowledgeState.exportPreview=null;kEl('knowledge-export-preview-summary').textContent='対象資料を確認すると、件数と文字数を表示します。';kEl('knowledge-export-body-preview').textContent='';const stop=kEl('knowledge-export-hard-stop');stop.className='status error';stop.textContent='';kEl('knowledge-export-prompt-preview').classList.add('hidden-panel');kUpdateExportScope();kSetExportBusy(false)}
function kRenderExportPreview(preview){knowledgeState.exportPreview=preview;kUpdateExportScope();const characters=preview.characterCountDeferred?'計測保留（上限判定後は原文を読み取りません）':String(preview.totalCharacterCount===undefined?preview.meetingCharacterCount||0:preview.totalCharacterCount)+'文字';const summary=[preview.mode,preview.scopeSummary,'対象資料: '+preview.sourceIdCount+'件','原文: '+characters].filter(Boolean).join(' / ');const notes=[];if(preview.sourceIdCount>(preview.sourceIds||[]).length)notes.push('対象IDは先頭'+preview.sourceIds.length+'件のみ表示しています。');if(preview.noResults)notes.push('条件に合う有効な資料はありません。');if(preview.warning)notes.push((preview.warningReasons||[]).join(' '));kEl('knowledge-export-preview-summary').textContent=summary+(notes.length?' / '+notes.join(' '):'');kEl('knowledge-export-body-preview').textContent=preview.packageText||'';const stop=kEl('knowledge-export-hard-stop');if(preview.hardStop||preview.noResults){stop.className='status visible error';stop.textContent=preview.noResults?'条件に合う有効な資料がないため、全文出力できません。':(preview.hardStopReasons||[]).join(' ')||'選択した資料の本文を取得できないため、全文出力を停止しました。'}else{stop.className='status error';stop.textContent=''}kSetExportBusy(false)}
function kRenderExportArtifact(result){const box=kEl('knowledge-export-status');box.className='status visible success';box.textContent='';box.append(document.createTextNode((result.artifact.outputType==='PDF'?'PDF':'Google Docs')+'を書き出しました: '));const link=document.createElement('a');link.className='result-link';link.target='_blank';link.rel='noopener';link.textContent=result.artifact.name||result.artifact.id;const safeUrl=kSafeKnowledgeDriveUrl(result.artifact.url);if(safeUrl)link.href=safeUrl;else link.setAttribute('aria-disabled','true');box.append(link);if(result.warnings&&result.warnings.length){box.append(document.createTextNode(' / '+result.warnings.map(w=>w.message||w.code).join(' ')))}}
async function kCopyText(text){if(typeof navigator!=='undefined'&&navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){try{await navigator.clipboard.writeText(text);return true}catch(error){}}try{const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.focus();area.select();const copied=typeof document.execCommand==='function'&&document.execCommand('copy');document.body.removeChild(area);return Boolean(copied)}catch(error){return false}}
async function kPreviewExport(trigger){kEl('knowledge-export-section').classList.remove('hidden-panel');kInvalidateExportPreview();const issue=kSourceSelectionIssue(kCommonKnowledgeFilters());if(issue){kShowExportStatus('error',issue);return}const requestId=++knowledgeState.exportRequestId;kShowExportStatus('info busy',kSelectedSourceScopeText()+' / 対象資料を確認中…');kSetExportBusy(true,trigger,'確認中…');try{const result=await kServerCall('previewKnowledgeExport',kExportPayload());if(requestId!==knowledgeState.exportRequestId)return;if(!result||!result.ok){knowledgeState.exportPreview=null;kShowExportStatus('error',result&&result.error?result.error.message:'対象資料を読み込めませんでした。');kSetExportBusy(false);return}kRenderExportPreview(result.preview);if(result.preview.noResults)kShowExportStatus('warning','条件に合う有効な資料はありません。');else if(result.preview.hardStop)kShowExportStatus('error','全文出力を停止しました。詳細を確認してください。');else kShowExportStatus(result.preview.warning?'warning':'success','対象資料を確認しました。')}catch(error){if(requestId===knowledgeState.exportRequestId){knowledgeState.exportPreview=null;kShowExportStatus('error',error&&error.message?error.message:String(error));kSetExportBusy(false)}}}
async function kCopyExportPackage(){const preview=knowledgeState.exportPreview;if(!preview||preview.noResults||preview.hardStop||!preview.packageText)return;const copied=await kCopyText(preview.packageText);kShowExportStatus(copied?'success':'warning',copied?'対象資料の全文をコピーしました。':'自動コピーできませんでした。プレビューを手動でコピーしてください。')}
async function kCreateExport(outputType,trigger){const preview=knowledgeState.exportPreview;if(!preview||preview.noResults||preview.hardStop)return;const issue=kSourceSelectionIssue(kCommonKnowledgeFilters());if(issue){kShowExportStatus('error',issue);return}const label=outputType==='PDF'?'PDFを作成中…':'Google Docsを作成中…';kShowExportStatus('info busy',label);kSetExportBusy(true,trigger,label);try{const payload=Object.assign({},kExportPayload(),{previewFingerprint:preview.packageFingerprint||preview.previewFingerprint,outputType:outputType});const result=await kServerCall('createKnowledgeExport',payload);if(!result||!result.ok){if(result&&result.error&&result.error.code==='KNOWLEDGE_EXPORT_PREVIEW_STALE')kInvalidateExportPreview();kShowExportStatus('error',result&&result.error?result.error.message:'書き出しに失敗しました。');return}kRenderExportArtifact(result)}catch(error){kShowExportStatus('error',error&&error.message?error.message:String(error))}finally{kSetExportBusy(false)}}
async function kCopyExportPrompt(trigger){const issue=kSourceSelectionIssue(kCommonKnowledgeFilters());if(issue){kShowExportStatus('error',issue);return}kShowExportStatus('info busy','AI用プロンプトを作成中…');kSetExportBusy(true,trigger,'作成中…');try{const result=await kServerCall('getKnowledgeExportPrompt',kPayload());if(!result||!result.ok){kShowExportStatus('error',result&&result.error?result.error.message:'プロンプトを作成できませんでした。');return}kEl('knowledge-export-prompt-text').value=result.prompt||'';kEl('knowledge-export-prompt-preview').classList.remove('hidden-panel');const copied=await kCopyText(result.prompt||'');if(!copied){kShowExportStatus('warning','自動コピーできませんでした。表示されたプロンプトを手動でコピーしてください。');return}const audit=await kServerCall('recordKnowledgeExportPromptCopy',Object.assign({},kPayload(),{copyConfirmed:true}));if(audit&&audit.ok){kShowExportStatus('success','AI用プロンプトをコピーしました。')}else{kShowExportStatus('warning','プロンプトをコピーしましたが、操作履歴を保存できませんでした。')}}catch(error){kShowExportStatus('error',error&&error.message?error.message:String(error))}finally{kSetExportBusy(false)}}
function kBootstrap(result){knowledgeState.loading=false;if(!result||!result.ok){knowledgeState.configured=false;kSetBusy(false);kSetExportBusy(false);kShowStatus('error',result&&result.error?result.error.message:'検索設定を読み込めませんでした。');return}knowledgeState.configured=true;knowledgeState.modelPolicies=result.modelPolicies||{};knowledgeState.options=result.options||{};(result.modeDefinitions||[]).forEach(definition=>{knowledgeState.modeDefinitions[definition.mode]=definition});const options=knowledgeState.options;kAddOptions('knowledge-counterpartyType',options.counterpartyTypes);kRefreshEntityOptions();kRefreshMultiEntityOptions();kAddOptions('knowledge-meetingTypeCode',options.meetingTypes);kAddOptions('knowledge-assetClassId',options.assetClasses);kAddOptions('knowledge-capitalTypeId',options.capitalTypes);kAddOptions('knowledge-teamId',options.teams);kAddOptions('knowledge-fundStrategy',options.fundStrategies);const providers=result.providers||{};const openai=providers.OPENAI&&providers.OPENAI.configured?'ChatGPT設定済み':'ChatGPTは未設定';const gemini=providers.GEMINI&&providers.GEMINI.configured?'Gemini設定済み':'Geminiは未設定';kEl('knowledge-config-state').textContent=openai+' / '+gemini+' / 全文出力は利用可能';kApplyMode();kApplyModelPolicy();kApplyRouteSurface();kSetBusy(false);kSetExportBusy(false);if(knowledgeState.pendingQueryToken)kResumePendingKnowledgeQuery()}
function kInvalidateKnowledgeSelection(){knowledgeState.queryRequestSequence+=1;knowledgeState.startingQuery=false;if(knowledgeState.pendingQueryToken)kClearPendingQuery();kSetBusy(false);kInvalidateExportPreview();kEl('knowledge-result').classList.add('hidden-panel');kClearStatus();const issue=kSourceSelectionIssue(kCommonKnowledgeFilters());if(issue)kShowStatus('error',issue)}
kEl('knowledge-route').addEventListener('change',()=>{kInvalidateKnowledgeSelection();kApplyMode();kApplyModelPolicy();kApplyRouteSurface();kClearExportStatus()});
kEl('knowledge-model-profile').addEventListener('change',()=>{kInvalidateKnowledgeSelection();kApplyThinkingChoices()});
kEl('knowledge-thinking-profile').addEventListener('change',kInvalidateKnowledgeSelection);
kEl('knowledge-mode').addEventListener('change',()=>{kInvalidateKnowledgeSelection();kApplyMode();kClearStatus();kClearExportStatus()});
kEl('knowledge-counterpartyType').addEventListener('change',()=>{kRefreshEntityOptions();kEl('knowledge-entityKey').value='';kInvalidateKnowledgeSelection()});
['knowledge-dateFrom','knowledge-dateTo','knowledge-entityKey','knowledge-assetClassId','knowledge-capitalTypeId','knowledge-fundStrategy'].forEach(id=>kEl(id).addEventListener('change',kInvalidateKnowledgeSelection));
KSP_KNOWLEDGE_SOURCE_CONTROLS.forEach(item=>kEl(item[1]).addEventListener('change',kInvalidateKnowledgeSelection));
['knowledge-dateFrom','knowledge-dateTo','knowledge-fundStrategy'].forEach(id=>kEl(id).addEventListener('input',kInvalidateKnowledgeSelection));
['knowledge-entityKeys'].forEach(id=>kEl(id).addEventListener('change',kInvalidateKnowledgeSelection));
['knowledge-teamId','knowledge-followUp','knowledge-meetingTypeCode'].forEach(id=>kEl(id).addEventListener('change',kInvalidateKnowledgeSelection));
kEl('knowledge-instruction').addEventListener('input',kInvalidateKnowledgeSelection);
kEl('knowledge-form').addEventListener('submit',async event=>{
  event.preventDefault();const payload=kPayload();const definition=knowledgeState.modeDefinitions[payload.mode]||{};
  if(payload.mode==='比較'&&(payload.selectedEntityKeys.length<2||payload.selectedEntityKeys.length>5)){kShowStatus('error','比較する面談先を2–5件選択してください。');return}
  if(knowledgeState.startingQuery||knowledgeState.pendingQueryToken){kShowPendingStatus({longRunning:knowledgeState.pendingQueryAutoStopped});return}
  if(definition.inputRequired&&!payload.questionOrInstruction.trim()){kShowStatus('error','質問を入力してください。');return}
  if(definition.targetRequired&&!payload.filters.entityKey){kShowStatus('error','面談準備では面談先を選択してください。');return}
  if(!payload.modelProfileId){kShowStatus('error','AIモデルを選択してください。全文出力はAI未設定でも利用できます。');return}
  const sourceIssue=kSourceSelectionIssue(payload.filters);if(sourceIssue){kShowStatus('error',sourceIssue);return}
  const requestId=++knowledgeState.queryRequestSequence,fingerprint=kKnowledgeQueryFingerprint(payload);
  knowledgeState.startingQuery=true;kEl('knowledge-result').classList.add('hidden-panel');kShowStatus('info busy','AI検索を開始中…');kSetBusy(true);
  try{
    const result=await kStartKnowledgeQuery(payload,requestId,fingerprint);
    if(!kKnowledgeRequestIsCurrent(requestId,fingerprint))return;
    if(!result||!result.ok){kShowStatus('error',result&&result.error?result.error.message:'検索に失敗しました。');return}
    if(result.pending){kShowPendingStatus(result);return}
    kRenderResult(result);const warningCount=(result.warnings||[]).length;
    kShowStatus(warningCount?'warning':'success',warningCount?'回答しましたが、参照資料と根拠を確認してください。':'回答しました。');
  }catch(error){if(kKnowledgeRequestIsCurrent(requestId,fingerprint))kShowStatus('error',error&&error.message?error.message:String(error))}
  finally{if(requestId===knowledgeState.queryRequestSequence){knowledgeState.startingQuery=false;kSetBusy(false)}}
});
kEl('knowledge-clear').onclick=()=>{knowledgeState.queryRequestSequence+=1;knowledgeState.startingQuery=false;['knowledge-dateFrom','knowledge-dateTo','knowledge-counterpartyType','knowledge-entityKey','knowledge-entityKeys','knowledge-assetClassId','knowledge-capitalTypeId','knowledge-teamId','knowledge-fundStrategy','knowledge-followUp','knowledge-meetingTypeCode','knowledge-instruction'].forEach(id=>{kEl(id).value=''});KSP_KNOWLEDGE_SOURCE_CONTROLS.forEach(item=>{kEl(item[1]).checked=item[0]==='Meeting'});knowledgeState.freeQuestionDraft='';knowledgeState.appliedMode='自由質問';kEl('knowledge-all-period').checked=false;kEl('knowledge-dateFrom').disabled=false;kEl('knowledge-dateTo').disabled=false;knowledgeState.savedPeriod=null;kSetDefaultKnowledgePeriod();kClearPendingQuery();kEl('knowledge-route').value='OPENAI';kEl('knowledge-mode').value='要約';kRefreshEntityOptions();kApplyMode();kApplyModelPolicy();kApplyRouteSurface();kEl('knowledge-result').classList.add('hidden-panel');kClearStatus();kInvalidateExportPreview()};
kEl('knowledge-export-preview-button').onclick=event=>kPreviewExport(event&&event.currentTarget||kEl('knowledge-export-preview-button'));
kEl('knowledge-full-output').onclick=event=>kPreviewExport(event&&event.currentTarget||kEl('knowledge-full-output'));
kEl('knowledge-all-period').addEventListener('change',kApplyAllPeriod);
kSetDefaultKnowledgePeriod();
kspInstallNativeDatePickers(document);
kEl('knowledge-export-copy').onclick=kCopyExportPackage;
kEl('knowledge-export-docs').onclick=event=>kCreateExport('GOOGLE_DOCS',event&&event.currentTarget||kEl('knowledge-export-docs'));
kEl('knowledge-export-pdf').onclick=event=>kCreateExport('PDF',event&&event.currentTarget||kEl('knowledge-export-pdf'));
kEl('knowledge-export-prompt').onclick=event=>kCopyExportPrompt(event&&event.currentTarget||kEl('knowledge-export-prompt'));
kLoadPendingQuery();
const recheckButton=kEl('knowledge-recheck');if(recheckButton)recheckButton.onclick=()=>{if(!knowledgeState.pendingQueryToken)return;knowledgeState.pendingQueryAutoStopped=false;kPersistPendingQuery();kPollKnowledgeQuery({route:knowledgeState.pendingQueryRoute||'OPENAI'},null)};
const knowledgeBack=kEl('knowledge-back');if(knowledgeBack)knowledgeBack.onclick=()=>{window.location.search=''};
google.script.run.withSuccessHandler(kBootstrap).withFailureHandler(error=>{knowledgeState.loading=false;knowledgeState.configured=false;kSetBusy(false);kSetExportBusy(false);kShowStatus('error',error&&error.message?error.message:String(error))}).getKnowledgeSearchBootstrapData();
</script>
