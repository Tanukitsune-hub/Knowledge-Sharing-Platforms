<script>
const knowledgeState={loading:true,configured:false,modeDefinitions:{}};
const KSP_LEGACY_SEARCH_ENDPOINT='askKnowledgeQuestion';
function kEl(id){return document.getElementById(id)}
function kShowStatus(kind,message){const box=kEl('knowledge-status');box.className='status visible '+kind;box.textContent=message}
function kClearStatus(){const box=kEl('knowledge-status');box.className='status';box.textContent=''}
function kServerCall(name,payload){return new Promise((resolve,reject)=>{let runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)})}
function kAddOptions(id,options){const select=kEl(id);select.innerHTML='<option value="">未選択</option>';(options||[]).forEach(option=>{const node=document.createElement('option');node.value=option.id;node.textContent=option.name;select.appendChild(node)})}
function kSetBusy(busy){kEl('knowledge-submit').disabled=busy||knowledgeState.loading||!knowledgeState.configured;kEl('knowledge-clear').disabled=busy;kEl('knowledge-submit').textContent=busy?'検索中…':'検索'}
function kRenderCitations(citations){const list=kEl('knowledge-citations');list.innerHTML='';(citations||[]).forEach(citation=>{const item=document.createElement('li');item.className='citation-item';const link=document.createElement('a');link.href=citation.driveUrl;link.target='_blank';link.rel='noopener';link.textContent=citation.title||citation.sourceId;const meta=document.createElement('div');meta.className='citation-meta';meta.textContent=[citation.sourceType,citation.sourceId,citation.date,citation.pageNumber?'p.'+citation.pageNumber:''].filter(Boolean).join(' / ');item.append(link,meta);list.appendChild(item)});if(!citations||!citations.length){const item=document.createElement('li');item.className='hint';item.textContent='参照可能な原資料Citationはありません。';list.appendChild(item)}}
function kRenderResult(result){kEl('knowledge-result').classList.remove('hidden-panel');kEl('knowledge-answer').textContent=result.answer||'確認できる根拠が不足しています。';kEl('knowledge-evidence-note').textContent=result.insufficientEvidence?'根拠が不足している可能性があります。':'回答は下記の原資料に基づきます。';kRenderCitations(result.citations||[])}
function kPayload(){return{mode:kEl('knowledge-mode').value,questionOrInstruction:kEl('knowledge-instruction').value,dateFrom:kEl('knowledge-dateFrom').value,dateTo:kEl('knowledge-dateTo').value,gpId:kEl('knowledge-gpId').value,assetClassId:kEl('knowledge-assetClassId').value,capitalTypeId:kEl('knowledge-capitalTypeId').value,sourceType:kEl('knowledge-sourceType').value}}
function kApplyMode(){const mode=kEl('knowledge-mode').value;const definition=knowledgeState.modeDefinitions[mode]||{inputLabel:'追加指示',placeholder:'',inputRequired:false,gpRequired:false};const label=kEl('knowledge-instruction-label');label.textContent=definition.inputLabel;label.classList.toggle('required',Boolean(definition.inputRequired));kEl('knowledge-instruction').placeholder=definition.placeholder||'';kEl('knowledge-gp-label').classList.toggle('required',Boolean(definition.gpRequired));kEl('knowledge-mode-help').textContent=definition.gpRequired?'面談準備ではGPが必須です。追加指示は任意です。Citationから原資料へ戻れます。':(definition.inputRequired?'このモードでは質問が必須です。Citationから原資料へ戻れます。':'追加指示は任意です。選択した条件の資料を横断して整理します。')}
function kBootstrap(result){knowledgeState.loading=false;if(!result||!result.ok){knowledgeState.configured=false;kSetBusy(false);kShowStatus('error',result&&result.error?result.error.message:'検索設定を読み込めませんでした。');return}knowledgeState.configured=Boolean(result.configured);(result.modeDefinitions||[]).forEach(definition=>{knowledgeState.modeDefinitions[definition.mode]=definition});const options=result.options||{};kAddOptions('knowledge-gpId',options.gps);kAddOptions('knowledge-assetClassId',options.assetClasses);kAddOptions('knowledge-capitalTypeId',options.capitalTypes);kEl('knowledge-config-state').textContent=result.configured?'Gemini検索設定済み':'Gemini Store / modelは最終実機設定時に構成します';kApplyMode();kSetBusy(false);if(!result.configured)kShowStatus('warning','検索コードは実装済みですが、StoreとFlash model IDはまだ設定されていません。')}
kEl('knowledge-mode').addEventListener('change',()=>{kApplyMode();kClearStatus()});
kEl('knowledge-form').addEventListener('submit',async event=>{event.preventDefault();kClearStatus();const payload=kPayload();const definition=knowledgeState.modeDefinitions[payload.mode]||{};if(definition.inputRequired&&!payload.questionOrInstruction.trim()){kShowStatus('error','質問を入力してください。');return}if(definition.gpRequired&&!payload.gpId){kShowStatus('error','面談準備ではGPを選択してください。');return}kSetBusy(true);try{const result=await kServerCall('searchKnowledge',payload);kSetBusy(false);if(!result||!result.ok){kShowStatus('error',result&&result.error?result.error.message:'検索に失敗しました。');return}kRenderResult(result);const warningCount=(result.warnings||[]).length;kShowStatus(warningCount?'warning':'success',warningCount?'回答しました。根拠不足またはCitationに関する注意があります。':'回答しました。')}catch(error){kSetBusy(false);kShowStatus('error',error&&error.message?error.message:String(error))}});
kEl('knowledge-clear').onclick=()=>{['knowledge-dateFrom','knowledge-dateTo','knowledge-gpId','knowledge-assetClassId','knowledge-capitalTypeId','knowledge-sourceType','knowledge-instruction'].forEach(id=>{kEl(id).value=''});kEl('knowledge-mode').value='自由質問';kApplyMode();kEl('knowledge-result').classList.add('hidden-panel');kClearStatus()};
kEl('knowledge-back').onclick=()=>{window.location.search=''};
google.script.run.withSuccessHandler(kBootstrap).withFailureHandler(error=>{knowledgeState.loading=false;knowledgeState.configured=false;kSetBusy(false);kShowStatus('error',error&&error.message?error.message:String(error))}).getKnowledgeSearchBootstrapData();
</script>
