<script>
const knowledgeState={loading:true,configured:false,modeDefinitions:{},exportPreview:null,exportBusy:false,exportRequestId:0};
function kEl(id){return document.getElementById(id)}
function kSafeKnowledgeDriveUrl(value){const candidate=String(value==null?'':value).trim();const docs=/^https:\/\/docs\.google\.com\/document\/d\/[^/?#&]+(?:[/?#]|$)/i;const file=/^https:\/\/drive\.google\.com\/file\/d\/[^/?#&]+(?:[/?#]|$)/i;const open=/^https:\/\/drive\.google\.com\/(?:open|uc)\?[^#]*\bid=[^&#]+/i;return docs.test(candidate)||file.test(candidate)||open.test(candidate)?candidate:''}
function kShowStatus(kind,message){const box=kEl('knowledge-status');box.className='status visible '+kind;box.textContent=message}
function kClearStatus(){const box=kEl('knowledge-status');box.className='status';box.textContent=''}
function kShowExportStatus(kind,message){const box=kEl('knowledge-export-status');box.className='status visible '+kind;box.textContent=message}
function kClearExportStatus(){const box=kEl('knowledge-export-status');box.className='status';box.textContent=''}
function kServerCall(name,payload){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)})}
function kAddOptions(id,options){const select=kEl(id);select.innerHTML='<option value="">未選択</option>';(options||[]).forEach(option=>{const node=document.createElement('option');node.value=option.id;node.textContent=option.name;select.appendChild(node)})}
function kSetBusy(busy){kEl('knowledge-submit').disabled=busy||knowledgeState.loading||!knowledgeState.configured;kEl('knowledge-clear').disabled=busy;kEl('knowledge-submit').textContent=busy?'検索中…':'検索'}
function kSetExportBusy(busy){knowledgeState.exportBusy=busy;kEl('knowledge-export-preview-button').disabled=busy;kEl('knowledge-export-prompt').disabled=busy;const preview=knowledgeState.exportPreview;const blocked=!preview||preview.noResults||preview.hardStop;kEl('knowledge-export-docs').disabled=busy||blocked;kEl('knowledge-export-pdf').disabled=busy||blocked}
function kRenderCitations(citations){const list=kEl('knowledge-citations');list.innerHTML='';(citations||[]).forEach(citation=>{const item=document.createElement('li');item.className='citation-item';const link=document.createElement('a');const safeUrl=kSafeKnowledgeDriveUrl(citation.driveUrl);if(safeUrl)link.href=safeUrl;else link.setAttribute('aria-disabled','true');link.target='_blank';link.rel='noopener';link.textContent=citation.title||citation.sourceId;const meta=document.createElement('div');meta.className='citation-meta';meta.textContent=[citation.sourceType,citation.sourceId,citation.date,citation.pageNumber?'p.'+citation.pageNumber:''].filter(Boolean).join(' / ');item.append(link,meta);list.appendChild(item)});if(!citations||!citations.length){const item=document.createElement('li');item.className='hint';item.textContent='参照可能な原資料Citationはありません。';list.appendChild(item)}}
function kRenderResult(result){kEl('knowledge-result').classList.remove('hidden-panel');kEl('knowledge-answer').textContent=result.answer||'確認できる根拠が不足しています。';kEl('knowledge-evidence-note').textContent=result.insufficientEvidence?'根拠が不足している可能性があります。':'回答は下記の原資料に基づきます。';kRenderCitations(result.citations||[])}
function kPayload(){return{mode:kEl('knowledge-mode').value,questionOrInstruction:kEl('knowledge-instruction').value,dateFrom:kEl('knowledge-dateFrom').value,dateTo:kEl('knowledge-dateTo').value,gpId:kEl('knowledge-gpId').value,assetClassId:kEl('knowledge-assetClassId').value,capitalTypeId:kEl('knowledge-capitalTypeId').value,sourceType:kEl('knowledge-sourceType').value}}
function kApplyMode(){const mode=kEl('knowledge-mode').value;const definition=knowledgeState.modeDefinitions[mode]||{inputLabel:'追加指示',placeholder:'',inputRequired:false,gpRequired:false};const label=kEl('knowledge-instruction-label');label.textContent=definition.inputLabel;label.classList.toggle('required',Boolean(definition.inputRequired));kEl('knowledge-instruction').placeholder=definition.placeholder||'';kEl('knowledge-gp-label').classList.toggle('required',Boolean(definition.gpRequired));kEl('knowledge-mode-help').textContent=definition.gpRequired?'面談準備ではGPを選択してください。追加指示は任意です。Citationから原資料へ戻れます。':(definition.inputRequired?'このモードでは質問が必須です。Citationから原資料へ戻れます。':'追加指示は任意です。選択した条件の資料を横断して整理します。')}
function kSourceScopeText(sourceType){return sourceType==='Meeting'?'Source Type: Meetingのみ':sourceType==='Pitchbook'?'Source Type: Pitchbookのみ':'Source Type: 未選択（MeetingとPitchbook）'}
function kUpdateExportScope(){kEl('knowledge-export-scope').textContent=kSourceScopeText(kEl('knowledge-sourceType').value)}
function kInvalidateExportPreview(){knowledgeState.exportRequestId+=1;knowledgeState.exportPreview=null;kEl('knowledge-export-preview-summary').textContent='対象資料を確認すると、件数と文字数を表示します。';const stop=kEl('knowledge-export-hard-stop');stop.className='status error';stop.textContent='';kEl('knowledge-export-prompt-preview').classList.add('hidden-panel');kUpdateExportScope();kSetExportBusy(false)}
function kRenderExportPreview(preview){knowledgeState.exportPreview=preview;kUpdateExportScope();const meetingCharacters=preview.characterCountDeferred?'計測保留（上限判定後は原文を読み取りません）':preview.meetingCharacterCount+'文字';const summary='Meeting: '+preview.meetingCount+'件 / 原文: '+meetingCharacters+' / Pitchbook: '+preview.pitchbookCount+'件';const notes=[];if(preview.sourceIdCount>preview.sourceIds.length)notes.push('対象IDは先頭'+preview.sourceIds.length+'件のみ表示しています。');if(preview.noResults)notes.push('一致するActiveな資料はありません。');if(preview.warning)notes.push((preview.warningReasons||[]).join(' '));kEl('knowledge-export-preview-summary').textContent=summary+(notes.length?' / '+notes.join(' '):'');const stop=kEl('knowledge-export-hard-stop');if(preview.hardStop){stop.className='status visible error';stop.textContent=(preview.hardStopReasons||[]).join(' ')+' フィルターを絞ってください。'}else{stop.className='status error';stop.textContent=''}kSetExportBusy(false)}
function kRenderExportArtifact(result){const box=kEl('knowledge-export-status');box.className='status visible success';box.textContent='';box.append(document.createTextNode((result.artifact.outputType==='PDF'?'PDF':'Google Docs')+'を書き出しました: '));const link=document.createElement('a');link.className='result-link';link.target='_blank';link.rel='noopener';link.textContent=result.artifact.name||result.artifact.id;const safeUrl=kSafeKnowledgeDriveUrl(result.artifact.url);if(safeUrl)link.href=safeUrl;else link.setAttribute('aria-disabled','true');box.append(link);if(result.warnings&&result.warnings.length){box.append(document.createTextNode(' / '+result.warnings.map(w=>w.message||w.code).join(' ')))}}
async function kCopyText(text){if(typeof navigator!=='undefined'&&navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){try{await navigator.clipboard.writeText(text);return true}catch(error){}}
  try{const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.focus();area.select();const copied=typeof document.execCommand==='function'&&document.execCommand('copy');document.body.removeChild(area);return Boolean(copied)}catch(error){return false}}
async function kPreviewExport(){const requestId=++knowledgeState.exportRequestId;kClearExportStatus();kSetExportBusy(true);try{const result=await kServerCall('previewKnowledgeExport',kPayload());if(requestId!==knowledgeState.exportRequestId)return;if(!result||!result.ok){knowledgeState.exportPreview=null;kShowExportStatus('error',result&&result.error?result.error.message:'対象資料を確認できませんでした。');kSetExportBusy(false);return}kRenderExportPreview(result.preview);if(result.preview.noResults)kShowExportStatus('warning','一致するActiveな資料がありません。');else if(result.preview.hardStop)kShowExportStatus('error','上限を超えているため、書き出しはできません。');else kShowExportStatus(result.preview.warning?'warning':'success','対象資料を確認しました。')}catch(error){if(requestId===knowledgeState.exportRequestId){knowledgeState.exportPreview=null;kShowExportStatus('error',error&&error.message?error.message:String(error));kSetExportBusy(false)}}}
async function kCreateExport(outputType){const preview=knowledgeState.exportPreview;if(!preview||preview.noResults||preview.hardStop)return;kClearExportStatus();kSetExportBusy(true);try{const payload=Object.assign({},kPayload(),{previewFingerprint:preview.previewFingerprint,outputType:outputType});const result=await kServerCall('createKnowledgeExport',payload);if(!result||!result.ok){if(result&&result.error&&result.error.code==='KNOWLEDGE_EXPORT_PREVIEW_STALE')kInvalidateExportPreview();kShowExportStatus('error',result&&result.error?result.error.message:'書き出しに失敗しました。');return}kRenderExportArtifact(result)}catch(error){kShowExportStatus('error',error&&error.message?error.message:String(error))}finally{kSetExportBusy(false)}}
async function kCopyExportPrompt(){kClearExportStatus();kSetExportBusy(true);try{const result=await kServerCall('getKnowledgeExportPrompt',kPayload());if(!result||!result.ok){kShowExportStatus('error',result&&result.error?result.error.message:'プロンプトを作成できませんでした。');return}kEl('knowledge-export-prompt-text').value=result.prompt||'';kEl('knowledge-export-prompt-preview').classList.remove('hidden-panel');const copied=await kCopyText(result.prompt||'');if(!copied){kShowExportStatus('warning','自動コピーできませんでした。表示されたプロンプトを手動でコピーしてください。');return}const audit=await kServerCall('recordKnowledgeExportPromptCopy',Object.assign({},kPayload(),{copyConfirmed:true}));if(audit&&audit.ok){kShowExportStatus('success','AI用プロンプトをコピーしました。')}else{kShowExportStatus('warning','プロンプトはコピーしましたが、監査メタデータを記録できませんでした。')}}catch(error){kShowExportStatus('error',error&&error.message?error.message:String(error))}finally{kSetExportBusy(false)}}
function kBootstrap(result){knowledgeState.loading=false;if(!result||!result.ok){knowledgeState.configured=false;kSetBusy(false);kSetExportBusy(false);kShowStatus('error',result&&result.error?result.error.message:'検索設定を読み込めませんでした。');return}knowledgeState.configured=Boolean(result.configured);(result.modeDefinitions||[]).forEach(definition=>{knowledgeState.modeDefinitions[definition.mode]=definition});const options=result.options||{};kAddOptions('knowledge-gpId',options.gps);kAddOptions('knowledge-assetClassId',options.assetClasses);kAddOptions('knowledge-capitalTypeId',options.capitalTypes);kEl('knowledge-config-state').textContent=result.configured?'Gemini検索設定済み':'Gemini Store / modelは最終実機設定時に構成します';kApplyMode();kSetBusy(false);kSetExportBusy(false);if(!result.configured)kShowStatus('warning','検索コードは実装済みですが、StoreとFlash model IDはまだ設定されていません。')}
kEl('knowledge-mode').addEventListener('change',()=>{kApplyMode();kClearStatus();kClearExportStatus()});
kEl('knowledge-sourceType').addEventListener('change',kInvalidateExportPreview);
['knowledge-dateFrom','knowledge-dateTo','knowledge-gpId','knowledge-assetClassId','knowledge-capitalTypeId'].forEach(id=>kEl(id).addEventListener('change',kInvalidateExportPreview));
kEl('knowledge-form').addEventListener('submit',async event=>{event.preventDefault();kClearStatus();const payload=kPayload();const definition=knowledgeState.modeDefinitions[payload.mode]||{};if(definition.inputRequired&&!payload.questionOrInstruction.trim()){kShowStatus('error','質問を入力してください。');return}if(definition.gpRequired&&!payload.gpId){kShowStatus('error','面談準備ではGPを選択してください。');return}kSetBusy(true);try{const result=await kServerCall('searchKnowledge',payload);kSetBusy(false);if(!result||!result.ok){kShowStatus('error',result&&result.error?result.error.message:'検索に失敗しました。');return}kRenderResult(result);const warningCount=(result.warnings||[]).length;kShowStatus(warningCount?'warning':'success',warningCount?'回答しました。根拠不足またはCitationに関する注意があります。':'回答しました。')}catch(error){kSetBusy(false);kShowStatus('error',error&&error.message?error.message:String(error))}});
kEl('knowledge-clear').onclick=()=>{['knowledge-dateFrom','knowledge-dateTo','knowledge-gpId','knowledge-assetClassId','knowledge-capitalTypeId','knowledge-sourceType','knowledge-instruction'].forEach(id=>{kEl(id).value=''});kEl('knowledge-mode').value='自由質問';kApplyMode();kEl('knowledge-result').classList.add('hidden-panel');kClearStatus();kInvalidateExportPreview()};
kEl('knowledge-export-preview-button').onclick=kPreviewExport;
kEl('knowledge-export-docs').onclick=()=>kCreateExport('GOOGLE_DOCS');
kEl('knowledge-export-pdf').onclick=()=>kCreateExport('PDF');
kEl('knowledge-export-prompt').onclick=kCopyExportPrompt;
kEl('knowledge-back').onclick=()=>{window.location.search=''};
google.script.run.withSuccessHandler(kBootstrap).withFailureHandler(error=>{knowledgeState.loading=false;knowledgeState.configured=false;kSetBusy(false);kSetExportBusy(false);kShowStatus('error',error&&error.message?error.message:String(error))}).getKnowledgeSearchBootstrapData();
</script>
