<script>
const KSP_QUERY_AUTO_POLL_LIMIT=12;
const KSP_QUERY_STORAGE_KEY='ksp.knowledge.query.v1';
const knowledgeState={loading:true,configured:false,modeDefinitions:{},modelPolicies:{},options:{},exportPreview:null,exportBusy:false,exportRequestId:0,pendingQueryToken:'',pendingQueryRoute:'OPENAI',pendingQueryFingerprint:'',pendingQueryStartedAt:0,pendingQueryPollCount:0,pendingQueryPolling:false,pendingQueryAutoStopped:false,pendingQueryTimer:null,startingQuery:false};
function kEl(id){return document.getElementById(id)}
function kSafeKnowledgeDriveUrl(value){const candidate=String(value==null?'':value).trim();const docs=/^https:\/\/docs\.google\.com\/document\/d\/[^/?#&]+(?:[/?#]|$)/i;const file=/^https:\/\/drive\.google\.com\/file\/d\/[^/?#&]+(?:[/?#]|$)/i;const open=/^https:\/\/drive\.google\.com\/(?:open|uc)\?[^#]*\bid=[^&#]+/i;return docs.test(candidate)||file.test(candidate)||open.test(candidate)?candidate:''}
function kShowStatus(kind,message){const box=kEl('knowledge-status');box.className='status visible '+kind;box.textContent=message}
function kClearStatus(){const box=kEl('knowledge-status');box.className='status';box.textContent=''}
function kShowExportStatus(kind,message){const box=kEl('knowledge-export-status');box.className='status visible '+kind;box.textContent=message}
function kClearExportStatus(){const box=kEl('knowledge-export-status');box.className='status';box.textContent=''}
function kServerCall(name,payload){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)})}
function kAddOptions(id,options){const select=kEl(id);select.innerHTML='<option value="">未選択</option>';(options||[]).forEach(option=>{const node=document.createElement('option');node.value=option.id;node.textContent=option.name+(option.status==='Inactive'?'（Inactive）':'');select.appendChild(node)})}
function kRefreshEntityOptions(){const type=kEl('knowledge-counterpartyType').value;const selected=kEl('knowledge-entityKey').value;kAddOptions('knowledge-entityKey',(knowledgeState.options.counterpartyEntities||[]).filter(item=>!type||item.type===type));if([...kEl('knowledge-entityKey').options].some(option=>option.value===selected))kEl('knowledge-entityKey').value=selected}
function kRefreshMultiEntityOptions(){const select=kEl('knowledge-entityKeys');const selected=new Set([...select.selectedOptions].map(option=>option.value));select.innerHTML='';(knowledgeState.options.counterpartyEntities||[]).forEach(item=>{const option=document.createElement('option');option.value=item.entityKey||item.id;option.textContent=(item.type||'Entity')+' / '+item.name+(item.status==='Inactive'?'（Inactive）':'');option.selected=selected.has(option.value);select.appendChild(option)})}
function kSelectedEntityKeys(){return[...kEl('knowledge-entityKeys').selectedOptions].map(option=>option.value)}
function kSetBusy(busy){const route=kEl('knowledge-route').value;const pending=Boolean(knowledgeState.pendingQueryToken);const waiting=Boolean(busy)||knowledgeState.startingQuery;kEl('knowledge-submit').disabled=waiting||pending||knowledgeState.loading||!knowledgeState.configured||route==='FULL_EXPORT';kEl('knowledge-clear').disabled=waiting;kEl('knowledge-submit').textContent=knowledgeState.startingQuery?'検索を開始中…':pending?'検索結果を確認中…':'検索';kEl('knowledge-model-profile').disabled=waiting||pending||route==='FULL_EXPORT'||!kEl('knowledge-model-profile').options.length;kEl('knowledge-thinking-profile').disabled=waiting||pending||route==='FULL_EXPORT'||!kEl('knowledge-thinking-profile').options.length;const recheck=kEl('knowledge-recheck');if(recheck){recheck.hidden=!pending;recheck.disabled=waiting||knowledgeState.pendingQueryPolling}}
function kSetExportBusy(busy){knowledgeState.exportBusy=busy;kEl('knowledge-export-preview-button').disabled=busy;kEl('knowledge-export-prompt').disabled=busy;const preview=knowledgeState.exportPreview;const blocked=!preview||preview.noResults||preview.hardStop;kEl('knowledge-export-copy').disabled=busy||blocked||!preview.packageText;kEl('knowledge-export-docs').disabled=busy||blocked;kEl('knowledge-export-pdf').disabled=busy||blocked}
function kRenderCitations(citations,evidence){const list=kEl('knowledge-citations');list.innerHTML='';const all=citations||[];const appendCitation=citation=>{const item=document.createElement('li');item.className='citation-item';const link=document.createElement('a');const safeUrl=kSafeKnowledgeDriveUrl(citation.driveUrl);if(safeUrl)link.href=safeUrl;else link.setAttribute('aria-disabled','true');link.target='_blank';link.rel='noopener';link.textContent=citation.title||citation.sourceId;const meta=document.createElement('div');meta.className='citation-meta';meta.textContent=[citation.sourceType,citation.sourceId,citation.entityKey,citation.date,citation.pageNumber?'p.'+citation.pageNumber:''].filter(Boolean).join(' / ');item.append(link,meta);list.appendChild(item)};if((evidence||[]).length){(evidence||[]).forEach(entity=>{const heading=document.createElement('li');heading.className='citation-item';const strong=document.createElement('strong');strong.textContent=(entity.displayName||entity.entityKey)+' / '+entity.entityKey;heading.appendChild(strong);list.appendChild(heading);(entity.citations||[]).forEach(appendCitation);if(!(entity.citations||[]).length){const gap=document.createElement('li');gap.className='hint';gap.textContent='このEntityのauthoritative citationはありません。';list.appendChild(gap)}})}else{all.forEach(appendCitation)}if(!all.length&&!(evidence||[]).length){const item=document.createElement('li');item.className='hint';item.textContent='参照可能な原資料Citationはありません。';list.appendChild(item)}}
function kRenderEntityEvidence(evidence){const box=kEl('knowledge-entity-evidence');const items=evidence||[];box.hidden=!items.length;box.textContent='';if(!items.length)return;items.forEach(item=>{const row=document.createElement('div');const label=document.createElement('strong');label.textContent=(item.displayName||item.entityKey)+' / '+item.entityKey;const state=document.createElement('span');state.className='hint';state.textContent=' — '+(item.evidenceStatus==='CITED'?'authoritative citation '+Number(item.citationCount||0)+'件':'証拠不足');row.append(label,state);box.appendChild(row)})}
function kClearPendingQuery(){if(knowledgeState.pendingQueryTimer){clearTimeout(knowledgeState.pendingQueryTimer);knowledgeState.pendingQueryTimer=null}knowledgeState.pendingQueryToken='';knowledgeState.pendingQueryRoute='OPENAI';knowledgeState.pendingQueryFingerprint='';knowledgeState.pendingQueryStartedAt=0;knowledgeState.pendingQueryPollCount=0;knowledgeState.pendingQueryPolling=false;knowledgeState.pendingQueryAutoStopped=false;try{if(typeof sessionStorage!=='undefined')sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY)}catch(error){}const recheck=kEl('knowledge-recheck');if(recheck)recheck.hidden=true;kSetBusy(false)}
function kPersistPendingQuery(){if(!knowledgeState.pendingQueryToken)return;try{if(typeof sessionStorage!=='undefined')sessionStorage.setItem(KSP_QUERY_STORAGE_KEY,JSON.stringify({queryToken:knowledgeState.pendingQueryToken,route:knowledgeState.pendingQueryRoute,fingerprint:knowledgeState.pendingQueryFingerprint,startedAt:knowledgeState.pendingQueryStartedAt,pollCount:knowledgeState.pendingQueryPollCount,autoStopped:knowledgeState.pendingQueryAutoStopped}))}catch(error){}}
function kLoadPendingQuery(){try{if(typeof sessionStorage==='undefined')return;const raw=sessionStorage.getItem(KSP_QUERY_STORAGE_KEY);if(!raw)return;const saved=JSON.parse(raw);if(!saved||typeof saved.queryToken!=='string'||!saved.queryToken.trim()||saved.queryToken.length>128){sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY);return}knowledgeState.pendingQueryToken=saved.queryToken.trim();knowledgeState.pendingQueryRoute=saved.route==='GEMINI'?'GEMINI':'OPENAI';knowledgeState.pendingQueryFingerprint=typeof saved.fingerprint==='string'?saved.fingerprint:'';knowledgeState.pendingQueryStartedAt=Number(saved.startedAt)||Date.now();knowledgeState.pendingQueryPollCount=Number(saved.pollCount)||0;knowledgeState.pendingQueryAutoStopped=Boolean(saved.autoStopped)}catch(error){try{sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY)}catch(ignored){}}}
function kKnowledgeQueryFingerprint(payload){const value=payload||{};return JSON.stringify({route:value.route||'',modelProfileId:value.modelProfileId||'',thinkingProfileId:value.thinkingProfileId||'',mode:value.mode||'',filters:value.filters||{},selectedEntityKeys:value.selectedEntityKeys||[]})}
function kKnowledgePendingElapsed(){return knowledgeState.pendingQueryStartedAt?Math.max(0,Date.now()-knowledgeState.pendingQueryStartedAt):0}
function kShowPendingStatus(result){const elapsed=Math.floor(kKnowledgePendingElapsed()/1000);const long=Boolean(result&&result.longRunning)||knowledgeState.pendingQueryAutoStopped||elapsed>=60;kShowStatus(long?'warning':'info','検索を処理中です。経過 '+elapsed+'秒'+(long?'（時間がかかっていますが、失敗ではありません）':'。結果を確認しています。'));const recheck=kEl('knowledge-recheck');if(recheck)recheck.hidden=false}
function kClearPendingQueryForTerminal(){if(knowledgeState.pendingQueryTimer){clearTimeout(knowledgeState.pendingQueryTimer);knowledgeState.pendingQueryTimer=null}knowledgeState.pendingQueryToken='';knowledgeState.pendingQueryRoute='OPENAI';knowledgeState.pendingQueryFingerprint='';knowledgeState.pendingQueryStartedAt=0;knowledgeState.pendingQueryPollCount=0;knowledgeState.pendingQueryAutoStopped=false;try{if(typeof sessionStorage!=='undefined')sessionStorage.removeItem(KSP_QUERY_STORAGE_KEY)}catch(error){}const recheck=kEl('knowledge-recheck');if(recheck)recheck.hidden=true}
function kRenderResult(result){kClearPendingQueryForTerminal();kEl('knowledge-result').classList.remove('hidden-panel');const selection=result.effectiveSelection||{};kEl('knowledge-result-scope').textContent=[result.mode,result.scopeSummary,selection.modelProfileId,selection.thinkingProfileId].filter(Boolean).join(' / ');kEl('knowledge-answer').textContent=result.answer||'確認できる根拠が不足しています。';kEl('knowledge-evidence-note').textContent=result.insufficientEvidence?'根拠が不足している可能性があります。':'回答は下記の原資料に基づきます。';kRenderEntityEvidence(result.entityEvidence||[]);kRenderCitations(result.citations||[],result.entityEvidence||[]);kSetBusy(false)}
function kPayload(){const route=kEl('knowledge-route').value;const comparison=kEl('knowledge-mode').value==='比較';const filters={dateFrom:kEl('knowledge-dateFrom').value,dateTo:kEl('knowledge-dateTo').value,counterpartyType:comparison?'':kEl('knowledge-counterpartyType').value,entityKey:comparison?'':kEl('knowledge-entityKey').value,gpId:kEl('knowledge-gpId').value,assetClassId:kEl('knowledge-assetClassId').value,capitalTypeId:kEl('knowledge-capitalTypeId').value,teamId:kEl('knowledge-teamId').value,fundStrategy:kEl('knowledge-fundStrategy').value,followUp:kEl('knowledge-followUp').value,relatedGpId:kEl('knowledge-relatedGpId').value,meetingTypeCode:kEl('knowledge-meetingTypeCode').value,sourceType:kEl('knowledge-sourceType').value};const payload={route:route,mode:kEl('knowledge-mode').value,questionOrInstruction:kEl('knowledge-instruction').value,filters:filters,selectedEntityKeys:comparison?kSelectedEntityKeys():(filters.entityKey?[filters.entityKey]:[])};if(route!=='FULL_EXPORT'){payload.modelProfileId=kEl('knowledge-model-profile').value;payload.thinkingProfileId=kEl('knowledge-thinking-profile').value}return payload}
function kScheduleKnowledgePoll(payload,delay){if(!knowledgeState.pendingQueryToken||knowledgeState.pendingQueryPolling||knowledgeState.pendingQueryAutoStopped)return;if(knowledgeState.pendingQueryTimer)clearTimeout(knowledgeState.pendingQueryTimer);const wait=Math.min(30000,Math.max(1000,Number(delay)||1000));knowledgeState.pendingQueryTimer=setTimeout(()=>{knowledgeState.pendingQueryTimer=null;kPollKnowledgeQuery(payload,null)},wait)}
function kStartKnowledgeQuery(payload){const fingerprint=kKnowledgeQueryFingerprint(payload);return kServerCall('searchKnowledge',payload).then(result=>{if(result&&result.pending&&result.queryToken){knowledgeState.pendingQueryToken=String(result.queryToken);knowledgeState.pendingQueryRoute=payload&&payload.route==='GEMINI'?'GEMINI':'OPENAI';knowledgeState.pendingQueryFingerprint=fingerprint;knowledgeState.pendingQueryStartedAt=Date.now();knowledgeState.pendingQueryPollCount=Number(result.pollCount)||0;knowledgeState.pendingQueryAutoStopped=false;kPersistPendingQuery();kShowPendingStatus(result);kSetBusy(false);kScheduleKnowledgePoll({route:knowledgeState.pendingQueryRoute},result.pollAfterMillis)}return result})}
async function kPollKnowledgeQuery(payload,initial){if(knowledgeState.pendingQueryPolling)return;const token=String((initial&&initial.queryToken)||knowledgeState.pendingQueryToken||'');if(!token)return;const route=payload&&payload.route?payload.route:knowledgeState.pendingQueryRoute||'OPENAI';knowledgeState.pendingQueryPolling=true;kSetBusy(false);try{const current=initial||await kServerCall('searchKnowledge',{route:route,queryPhase:'POLL',queryToken:token});if(current&&current.pending){knowledgeState.pendingQueryToken=String(current.queryToken||token);knowledgeState.pendingQueryPollCount=Number(current.pollCount)||knowledgeState.pendingQueryPollCount+1;kPersistPendingQuery();kShowPendingStatus(current);if(knowledgeState.pendingQueryPollCount>=KSP_QUERY_AUTO_POLL_LIMIT){knowledgeState.pendingQueryAutoStopped=true;kPersistPendingQuery();kShowPendingStatus({longRunning:true})}else{kScheduleKnowledgePoll({route:route},current.pollAfterMillis)}return}if(current&&current.ok){kRenderResult(current);const warningCount=(current.warnings||[]).length;kShowStatus(warningCount?'warning':'success',warningCount?'回答しました。根拠不足またはCitationに関する注意があります。':'回答しました。');return}kClearPendingQueryForTerminal();kShowStatus('error',current&&current.error?current.error.message:'検索に失敗しました。')}catch(error){kShowPendingStatus({longRunning:true})}finally{knowledgeState.pendingQueryPolling=false;kSetBusy(false)}}
function kResumePendingKnowledgeQuery(){if(!knowledgeState.pendingQueryToken)return;kShowPendingStatus({longRunning:knowledgeState.pendingQueryAutoStopped});kSetBusy(false);if(!knowledgeState.pendingQueryAutoStopped)kPollKnowledgeQuery({route:knowledgeState.pendingQueryRoute||'OPENAI'},null)}
function kRunKnowledgeQuery(payload){if(knowledgeState.pendingQueryToken)return Promise.resolve({ok:true,pending:true,queryToken:knowledgeState.pendingQueryToken});return kStartKnowledgeQuery(payload)}
function kApplyMode(){const mode=kEl('knowledge-mode').value;const comparison=mode==='比較';const definition=knowledgeState.modeDefinitions[mode]||{inputLabel:'追加指示',placeholder:'',inputRequired:false,targetRequired:false};const label=kEl('knowledge-instruction-label');label.textContent=definition.inputLabel;label.classList.toggle('required',Boolean(definition.inputRequired));kEl('knowledge-instruction').placeholder=definition.placeholder||'';kEl('knowledge-gp-label').classList.toggle('required',Boolean(definition.targetRequired));kEl('knowledge-entity-label').classList.toggle('required',Boolean(definition.targetRequired));kEl('knowledge-multi-entity-field').hidden=!comparison;kEl('knowledge-entityKey').disabled=comparison;kEl('knowledge-counterpartyType').disabled=comparison;kEl('knowledge-mode-help').textContent=definition.targetRequired?'面談準備ではCounterparty EntityまたはGPを1つ選択してください。追加指示は任意です。':(definition.inputRequired?'このモードでは質問が必須です。Citationから原資料へ戻れます。':(comparison?'比較するEntityを2–5件選択します。各Entityの根拠と証拠不足を別々に表示します。':'追加指示は任意です。選択した条件の資料を横断して整理します。'))}
function kSelectedModelProfile(){const route=kEl('knowledge-route').value;const policy=knowledgeState.modelPolicies[route]||{profiles:[]};return(policy.profiles||[]).find(profile=>profile.profileId===kEl('knowledge-model-profile').value)||null}
function kApplyThinkingChoices(){const select=kEl('knowledge-thinking-profile');const profile=kSelectedModelProfile();select.innerHTML='';(profile&&profile.thinkingProfiles||[]).forEach(thinking=>{const option=document.createElement('option');option.value=thinking.thinkingProfileId;option.textContent=thinking.label;if(thinking.isDefault)option.selected=true;select.appendChild(option)});kSetBusy(false)}
function kApplyModelPolicy(){const route=kEl('knowledge-route').value;const controls=kEl('knowledge-model-controls');controls.hidden=route==='FULL_EXPORT';const select=kEl('knowledge-model-profile');select.innerHTML='';const policy=knowledgeState.modelPolicies[route]||{profiles:[]};(policy.profiles||[]).forEach(profile=>{const option=document.createElement('option');option.value=profile.profileId;option.textContent=profile.displayName;if(profile.isDefault)option.selected=true;select.appendChild(option)});kApplyThinkingChoices()}
function kApplyRouteSurface(){const full=kEl('knowledge-route').value==='FULL_EXPORT';kEl('knowledge-export-section').classList.toggle('hidden-panel',!full);if(full)kEl('knowledge-result').classList.add('hidden-panel');kSetBusy(false)}
function kSourceScopeText(sourceType){return sourceType==='Meeting'?'Source Type: Meetingのみ':sourceType==='Pitchbook'?'Source Type: Pitchbookのみ':'Source Type: 未選択（MeetingとPitchbook）'}
function kUpdateExportScope(){kEl('knowledge-export-scope').textContent=kSourceScopeText(kEl('knowledge-sourceType').value)}
function kInvalidateExportPreview(){knowledgeState.exportRequestId+=1;knowledgeState.exportPreview=null;kEl('knowledge-export-preview-summary').textContent='対象資料を確認すると、Meeting件数と全文文字数を表示します。';kEl('knowledge-export-body-preview').textContent='';const stop=kEl('knowledge-export-hard-stop');stop.className='status error';stop.textContent='';kEl('knowledge-export-prompt-preview').classList.add('hidden-panel');kUpdateExportScope();kSetExportBusy(false)}
function kRenderExportPreview(preview){knowledgeState.exportPreview=preview;kUpdateExportScope();const meetingCharacters=preview.characterCountDeferred?'計測保留（上限判定後は原文を読み取りません）':preview.meetingCharacterCount+'文字';const summary=[preview.mode,preview.scopeSummary,'Meeting: '+preview.meetingCount+'件','原文: '+meetingCharacters,'参考Pitchbook: '+preview.pitchbookCount+'件'].filter(Boolean).join(' / ');const notes=[];if(preview.sourceIdCount>preview.sourceIds.length)notes.push('対象IDは先頭'+preview.sourceIds.length+'件のみ表示しています。');if(preview.noResults)notes.push('一致するActiveなMeetingはありません。');if(preview.warning)notes.push((preview.warningReasons||[]).join(' '));kEl('knowledge-export-preview-summary').textContent=summary+(notes.length?' / '+notes.join(' '):'');kEl('knowledge-export-body-preview').textContent=preview.packageText||'';const stop=kEl('knowledge-export-hard-stop');if(preview.hardStop||preview.noResults){stop.className='status visible error';stop.textContent=preview.noResults?'一致するActiveなMeetingがないため、全文出力できません。':(preview.hardStopReasons||[]).join(' ')+' フィルターを絞ってください。'}else{stop.className='status error';stop.textContent=''}kSetExportBusy(false)}
function kRenderExportArtifact(result){const box=kEl('knowledge-export-status');box.className='status visible success';box.textContent='';box.append(document.createTextNode((result.artifact.outputType==='PDF'?'PDF':'Google Docs')+'を書き出しました: '));const link=document.createElement('a');link.className='result-link';link.target='_blank';link.rel='noopener';link.textContent=result.artifact.name||result.artifact.id;const safeUrl=kSafeKnowledgeDriveUrl(result.artifact.url);if(safeUrl)link.href=safeUrl;else link.setAttribute('aria-disabled','true');box.append(link);if(result.warnings&&result.warnings.length){box.append(document.createTextNode(' / '+result.warnings.map(w=>w.message||w.code).join(' ')))}}
async function kCopyText(text){if(typeof navigator!=='undefined'&&navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){try{await navigator.clipboard.writeText(text);return true}catch(error){}}try{const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.focus();area.select();const copied=typeof document.execCommand==='function'&&document.execCommand('copy');document.body.removeChild(area);return Boolean(copied)}catch(error){return false}}
async function kPreviewExport(){const requestId=++knowledgeState.exportRequestId;kClearExportStatus();kSetExportBusy(true);try{const result=await kServerCall('previewKnowledgeExport',kPayload());if(requestId!==knowledgeState.exportRequestId)return;if(!result||!result.ok){knowledgeState.exportPreview=null;kShowExportStatus('error',result&&result.error?result.error.message:'対象資料を確認できませんでした。');kSetExportBusy(false);return}kRenderExportPreview(result.preview);if(result.preview.noResults)kShowExportStatus('warning','一致するActiveな資料がありません。');else if(result.preview.hardStop)kShowExportStatus('error','上限を超えているため、書き出しはできません。');else kShowExportStatus(result.preview.warning?'warning':'success','対象資料を確認しました。')}catch(error){if(requestId===knowledgeState.exportRequestId){knowledgeState.exportPreview=null;kShowExportStatus('error',error&&error.message?error.message:String(error));kSetExportBusy(false)}}}
async function kCopyExportPackage(){const preview=knowledgeState.exportPreview;if(!preview||preview.noResults||preview.hardStop||!preview.packageText)return;const copied=await kCopyText(preview.packageText);kShowExportStatus(copied?'success':'warning',copied?'Meeting全文パッケージをコピーしました。':'自動コピーできませんでした。プレビューを手動でコピーしてください。')}
async function kCreateExport(outputType){const preview=knowledgeState.exportPreview;if(!preview||preview.noResults||preview.hardStop)return;kClearExportStatus();kSetExportBusy(true);try{const payload=Object.assign({},kPayload(),{previewFingerprint:preview.packageFingerprint||preview.previewFingerprint,outputType:outputType});const result=await kServerCall('createKnowledgeExport',payload);if(!result||!result.ok){if(result&&result.error&&result.error.code==='KNOWLEDGE_EXPORT_PREVIEW_STALE')kInvalidateExportPreview();kShowExportStatus('error',result&&result.error?result.error.message:'書き出しに失敗しました。');return}kRenderExportArtifact(result)}catch(error){kShowExportStatus('error',error&&error.message?error.message:String(error))}finally{kSetExportBusy(false)}}
async function kCopyExportPrompt(){kClearExportStatus();kSetExportBusy(true);try{const result=await kServerCall('getKnowledgeExportPrompt',kPayload());if(!result||!result.ok){kShowExportStatus('error',result&&result.error?result.error.message:'プロンプトを作成できませんでした。');return}kEl('knowledge-export-prompt-text').value=result.prompt||'';kEl('knowledge-export-prompt-preview').classList.remove('hidden-panel');const copied=await kCopyText(result.prompt||'');if(!copied){kShowExportStatus('warning','自動コピーできませんでした。表示されたプロンプトを手動でコピーしてください。');return}const audit=await kServerCall('recordKnowledgeExportPromptCopy',Object.assign({},kPayload(),{copyConfirmed:true}));if(audit&&audit.ok){kShowExportStatus('success','AI用プロンプトをコピーしました。')}else{kShowExportStatus('warning','プロンプトはコピーしましたが、監査メタデータを記録できませんでした。')}}catch(error){kShowExportStatus('error',error&&error.message?error.message:String(error))}finally{kSetExportBusy(false)}}
function kBootstrap(result){knowledgeState.loading=false;if(!result||!result.ok){knowledgeState.configured=false;kSetBusy(false);kSetExportBusy(false);kShowStatus('error',result&&result.error?result.error.message:'検索設定を読み込めませんでした。');return}knowledgeState.configured=true;knowledgeState.modelPolicies=result.modelPolicies||{};knowledgeState.options=result.options||{};(result.modeDefinitions||[]).forEach(definition=>{knowledgeState.modeDefinitions[definition.mode]=definition});const options=knowledgeState.options;kAddOptions('knowledge-counterpartyType',options.counterpartyTypes);kRefreshEntityOptions();kRefreshMultiEntityOptions();kAddOptions('knowledge-gpId',options.gps);kAddOptions('knowledge-relatedGpId',options.relatedGps||options.gps);kAddOptions('knowledge-meetingTypeCode',options.meetingTypes);kAddOptions('knowledge-assetClassId',options.assetClasses);kAddOptions('knowledge-capitalTypeId',options.capitalTypes);kAddOptions('knowledge-teamId',options.teams);kAddOptions('knowledge-fundStrategy',options.fundStrategies);const providers=result.providers||{};const openai=providers.OPENAI&&providers.OPENAI.configured?'ChatGPT設定済み':'ChatGPTは未設定';const gemini=providers.GEMINI&&providers.GEMINI.configured?'Gemini設定済み':'Geminiは未設定';kEl('knowledge-config-state').textContent=openai+' / '+gemini+' / 全文出力は利用可能';kApplyMode();kApplyModelPolicy();kApplyRouteSurface();kSetBusy(false);kSetExportBusy(false);if(knowledgeState.pendingQueryToken)kResumePendingKnowledgeQuery()}
function kInvalidateKnowledgeSelection(){if(knowledgeState.pendingQueryToken)kClearPendingQuery();kInvalidateExportPreview();kEl('knowledge-result').classList.add('hidden-panel')}
kEl('knowledge-route').addEventListener('change',()=>{kClearPendingQuery();kApplyMode();kApplyModelPolicy();kApplyRouteSurface();kClearStatus();kClearExportStatus()});
kEl('knowledge-model-profile').addEventListener('change',()=>{kClearPendingQuery();kApplyThinkingChoices()});
kEl('knowledge-thinking-profile').addEventListener('change',()=>{if(knowledgeState.pendingQueryToken)kClearPendingQuery()});
kEl('knowledge-mode').addEventListener('change',()=>{kInvalidateKnowledgeSelection();kApplyMode();kClearStatus();kClearExportStatus()});
kEl('knowledge-counterpartyType').addEventListener('change',()=>{kRefreshEntityOptions();kEl('knowledge-entityKey').value='';kInvalidateKnowledgeSelection()});
['knowledge-dateFrom','knowledge-dateTo','knowledge-entityKey','knowledge-gpId','knowledge-assetClassId','knowledge-capitalTypeId','knowledge-fundStrategy','knowledge-sourceType'].forEach(id=>kEl(id).addEventListener('change',kInvalidateKnowledgeSelection));
['knowledge-entityKeys'].forEach(id=>kEl(id).addEventListener('change',kInvalidateKnowledgeSelection));
['knowledge-teamId','knowledge-followUp','knowledge-relatedGpId','knowledge-meetingTypeCode'].forEach(id=>kEl(id).addEventListener('change',()=>{if(kEl(id).value)kEl('knowledge-sourceType').value='Meeting';kInvalidateKnowledgeSelection()}));
kEl('knowledge-instruction').addEventListener('input',()=>{if(knowledgeState.pendingQueryToken)kClearPendingQuery();kInvalidateExportPreview()});
kEl('knowledge-form').addEventListener('submit',async event=>{event.preventDefault();const payload=kPayload();const definition=knowledgeState.modeDefinitions[payload.mode]||{};if(payload.mode==='比較'&&(payload.selectedEntityKeys.length<2||payload.selectedEntityKeys.length>5)){kShowStatus('error','比較するEntityを2–5件選択してください。');return}if(kEl('knowledge-route').value==='FULL_EXPORT'){await kPreviewExport();return}if(knowledgeState.startingQuery||knowledgeState.pendingQueryToken){kShowPendingStatus({longRunning:knowledgeState.pendingQueryAutoStopped});return}if(definition.inputRequired&&!payload.questionOrInstruction.trim()){kShowStatus('error','質問を入力してください。');return}if(definition.targetRequired&&!payload.filters.entityKey&&!payload.filters.gpId){kShowStatus('error','面談準備ではCounterparty EntityまたはGPを選択してください。');return}knowledgeState.startingQuery=true;kClearStatus();kShowStatus('info','検索を開始しています…');kSetBusy(true);try{const result=await kStartKnowledgeQuery(payload);if(!result||!result.ok){kShowStatus('error',result&&result.error?result.error.message:'検索に失敗しました。');return}if(result.pending){kShowPendingStatus(result);return}kRenderResult(result);const warningCount=(result.warnings||[]).length;kShowStatus(warningCount?'warning':'success',warningCount?'回答しました。根拠不足またはCitationに関する注意があります。':'回答しました。')}catch(error){kShowStatus('error',error&&error.message?error.message:String(error))}finally{knowledgeState.startingQuery=false;kSetBusy(false)}});
kEl('knowledge-clear').onclick=()=>{['knowledge-dateFrom','knowledge-dateTo','knowledge-counterpartyType','knowledge-entityKey','knowledge-entityKeys','knowledge-gpId','knowledge-assetClassId','knowledge-capitalTypeId','knowledge-teamId','knowledge-fundStrategy','knowledge-followUp','knowledge-relatedGpId','knowledge-meetingTypeCode','knowledge-sourceType','knowledge-instruction'].forEach(id=>{kEl(id).value=''});kClearPendingQuery();kEl('knowledge-route').value='OPENAI';kEl('knowledge-mode').value='自由質問';kRefreshEntityOptions();kApplyMode();kApplyModelPolicy();kApplyRouteSurface();kEl('knowledge-result').classList.add('hidden-panel');kClearStatus();kInvalidateExportPreview()};
kEl('knowledge-export-preview-button').onclick=kPreviewExport;
kEl('knowledge-export-copy').onclick=kCopyExportPackage;
kEl('knowledge-export-docs').onclick=()=>kCreateExport('GOOGLE_DOCS');
kEl('knowledge-export-pdf').onclick=()=>kCreateExport('PDF');
kEl('knowledge-export-prompt').onclick=kCopyExportPrompt;
kLoadPendingQuery();
const recheckButton=kEl('knowledge-recheck');if(recheckButton)recheckButton.onclick=()=>{if(!knowledgeState.pendingQueryToken)return;knowledgeState.pendingQueryAutoStopped=false;kPersistPendingQuery();kPollKnowledgeQuery({route:knowledgeState.pendingQueryRoute||'OPENAI'},null)};
const knowledgeBack=kEl('knowledge-back');if(knowledgeBack)knowledgeBack.onclick=()=>{window.location.search=''};
google.script.run.withSuccessHandler(kBootstrap).withFailureHandler(error=>{knowledgeState.loading=false;knowledgeState.configured=false;kSetBusy(false);kSetExportBusy(false);kShowStatus('error',error&&error.message?error.message:String(error))}).getKnowledgeSearchBootstrapData();
</script>
