<script>
let aiProviderAdminState=null;
let aiProviderAdminBusy=false;
function aiProviderAdminElement(id){return document.getElementById(id)}
function aiProviderAdminStatusLabel(value){return value==='ACTIVE'?'有効':value==='ACTIVE_WITH_SYNC_ERRORS'?'有効（一部同期エラー）':value==='READY_FOR_SYNC'?'同期準備完了':value==='TESTING'?'接続確認中':value==='RECONNECT_REQUIRED'?'再接続が必要':value==='ERROR'?'エラー':value==='UNCONFIGURED'?'未設定':'無効'}
function aiProviderAdminBooleanLabel(value){return value?'設定済み':'未設定'}
function aiProviderAdminStoreLabel(value){return value?'準備済み':'未作成'}
function aiModelAdminProfiles(){return aiProviderAdminState&&aiProviderAdminState.modelPolicy&&Array.isArray(aiProviderAdminState.modelPolicy.profiles)?aiProviderAdminState.modelPolicy.profiles:[]}
function aiProviderAdminSetBusy(busy){aiProviderAdminBusy=busy;const canMutate=Boolean(aiProviderAdminState&&aiProviderAdminState.canMutate);['ai-provider-openai-key-input','ai-provider-sync-source','ai-provider-sync-source-id','ai-provider-openai-enable','ai-provider-openai-disable','ai-provider-openai-sync','ai-model-profile-select','ai-model-profile-id','ai-model-provider','ai-model-id','ai-model-display-name','ai-model-family','ai-model-max-output','ai-model-thinking-profiles','ai-model-default-thinking','ai-model-enabled','ai-model-user-visible','ai-model-provider-default','ai-model-policy-migrate','ai-model-profile-save','ai-model-profile-qualify'].forEach(id=>{const node=aiProviderAdminElement(id);if(node)node.disabled=busy||!canMutate})}
function aiModelAdminRenderProfile(profile){const value=profile||{};aiProviderAdminElement('ai-model-profile-id').value=value.profileId||'';aiProviderAdminElement('ai-model-provider').value=value.provider||'OPENAI';aiProviderAdminElement('ai-model-id').value=value.modelId||'';aiProviderAdminElement('ai-model-display-name').value=value.displayName||'';aiProviderAdminElement('ai-model-family').value=value.family||'';aiProviderAdminElement('ai-model-max-output').value=value.maxOutputTokens==null?'':String(value.maxOutputTokens);aiProviderAdminElement('ai-model-thinking-profiles').value=(value.thinkingProfiles||[]).map(item=>[item.thinkingProfileId,item.label,item.providerDefault?'':(item.rawValue||'')].join(' | ')).join('\n');aiProviderAdminElement('ai-model-default-thinking').value=value.defaultThinkingProfileId||'provider-default';aiProviderAdminElement('ai-model-enabled').checked=value.enabled!==false;aiProviderAdminElement('ai-model-user-visible').checked=value.userVisible!==false;aiProviderAdminElement('ai-model-provider-default').checked=Boolean(value.isProviderDefault);aiProviderAdminElement('ai-model-access-state').textContent=value.apiAccess||'未確認';aiProviderAdminElement('ai-model-qualification-state').textContent=value.qualification?(value.qualification+(value.fileSearch?' / File Search':'')):'未確認';aiProviderAdminElement('ai-model-profile-qualify').disabled=aiProviderAdminBusy||!Boolean(aiProviderAdminState&&aiProviderAdminState.canMutate)||!Boolean(value.profileId)}
function aiModelAdminRenderPolicy(data){const select=aiProviderAdminElement('ai-model-profile-select');const prior=select.value;select.innerHTML='<option value="">新規作成</option>';aiModelAdminProfiles().forEach(profile=>{const option=document.createElement('option');option.value=profile.profileId;option.textContent=(profile.isProviderDefault?'★ ':'')+profile.displayName+' / '+profile.modelId;select.appendChild(option)});const selected=aiModelAdminProfiles().find(profile=>profile.profileId===prior)||aiModelAdminProfiles().find(profile=>profile.isProviderDefault)||aiModelAdminProfiles()[0];if(selected){select.value=selected.profileId;aiModelAdminRenderProfile(selected)}else{select.value='';aiModelAdminRenderProfile(null)}const migrate=aiProviderAdminElement('ai-model-policy-migrate');if(migrate)migrate.textContent=data&&data.modelPolicyPersisted?'ポリシー再確認':'現行設定から初期化'}
function renderAiProviderAdminData(data){const openai=data&&data.openai?data.openai:{};aiProviderAdminElement('ai-provider-openai-key').textContent=aiProviderAdminBooleanLabel(Boolean(openai.keyConfigured));aiProviderAdminElement('ai-provider-openai-store').textContent=aiProviderAdminStoreLabel(Boolean(openai.vectorStoreReady));aiProviderAdminElement('ai-provider-openai-status').textContent=aiProviderAdminStatusLabel(String(openai.status||'DISABLED'));const readonly=aiProviderAdminElement('ai-provider-openai-readonly');readonly.textContent=data&&data.canMutate?'管理者操作が利用できます。':'管理者権限を確認できないため、変更操作は利用できません。';aiModelAdminRenderPolicy(data);aiProviderAdminSetBusy(false)}
async function loadAiProviderAdminData(preserveNotice){aiProviderAdminSetBusy(true);if(!preserveNotice)clearStatus('ai-provider-admin-notice');try{const result=await serverCall('getAiProviderAdminData');if(!result||!result.ok){aiProviderAdminState=null;renderAiProviderAdminData({});showStatus('ai-provider-admin-notice','error','AIプロバイダ設定を確認できませんでした。');return}aiProviderAdminState=result;renderAiProviderAdminData(result);if(!result.canMutate)showStatus('ai-provider-admin-notice','info','状態は閲覧できますが、変更操作は管理者だけが実行できます。')}catch(error){aiProviderAdminState=null;renderAiProviderAdminData({});showStatus('ai-provider-admin-notice','error','AIプロバイダ設定を確認できませんでした。')}}
function aiProviderAdminSyncMessage(sync){const codes=Array.isArray(sync&&sync.errorCodes)?sync.errorCodes:[];const known=codes.map(code=>code==='OPENAI_INDEX_TIMEOUT'?'OPENAI_INDEX_TIMEOUT':code).join(', ');const counts=`選択 ${Number(sync&&sync.selected||0)} / Indexed ${Number(sync&&sync.indexed||0)} / Unchanged ${Number(sync&&sync.unchanged||0)} / Removed ${Number(sync&&sync.removed||0)} / Failed ${Number(sync&&sync.failed||0)}`;return sync&&sync.partial?`同期は一部完了しました。${counts}${known?` / ${known}`:''}`:`同期を完了しました。${counts}`}
async function mutateAiProviderAdmin(action,sourceType,sourceId){if(aiProviderAdminBusy)return;aiProviderAdminSetBusy(true);clearStatus('ai-provider-admin-notice');let apiKey='';const keyInput=aiProviderAdminElement('ai-provider-openai-key-input');if(action==='CONNECT_OPENAI'){apiKey=keyInput?keyInput.value:'';if(keyInput)keyInput.value=''}try{const payload={action,sourceType:action==='SYNC'?(sourceType||''):'',sourceId:action==='SYNC'?(sourceId||''):''};if(action==='CONNECT_OPENAI')payload.apiKey=apiKey;const result=await serverCall('mutateAiProviderSettings',payload);if(result&&result.ok){showStatus('ai-provider-admin-notice',result.sync&&result.sync.partial?'warning':'success',action==='SYNC'?aiProviderAdminSyncMessage(result.sync):result.readyForSync?'接続確認が完了しました。資料同期を開始できます。':'設定を更新しました。')}else{showStatus('ai-provider-admin-notice','error',result&&result.error&&result.error.message?result.error.message:'操作を完了できませんでした。')}await loadAiProviderAdminData(true)}catch(error){showStatus('ai-provider-admin-notice','error','操作を完了できませんでした。');await loadAiProviderAdminData(true)}finally{apiKey=''}}
function aiModelAdminThinkingProfiles(){return aiProviderAdminElement('ai-model-thinking-profiles').value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split('|').map(value=>value.trim());return{thinkingProfileId:parts[0],label:parts[1]||parts[0],rawValue:parts[2]||null,providerDefault:!parts[2],enabled:true}})}
function aiModelAdminPayload(){const max=aiProviderAdminElement('ai-model-max-output').value;return{profileId:aiProviderAdminElement('ai-model-profile-id').value,provider:aiProviderAdminElement('ai-model-provider').value,modelId:aiProviderAdminElement('ai-model-id').value,displayName:aiProviderAdminElement('ai-model-display-name').value,family:aiProviderAdminElement('ai-model-family').value,enabled:aiProviderAdminElement('ai-model-enabled').checked,userVisible:aiProviderAdminElement('ai-model-user-visible').checked,isProviderDefault:aiProviderAdminElement('ai-model-provider-default').checked,thinkingProfiles:aiModelAdminThinkingProfiles(),defaultThinkingProfileId:aiProviderAdminElement('ai-model-default-thinking').value,maxOutputTokens:max?Number(max):null}}
async function mutateAiModelPolicy(action,payload){if(aiProviderAdminBusy)return;aiProviderAdminSetBusy(true);clearStatus('ai-provider-admin-notice');try{const request=Object.assign({action},payload||{});const result=await serverCall('mutateAiProviderSettings',request);showStatus('ai-provider-admin-notice',result&&result.ok?'success':'error',result&&result.ok?(action==='QUALIFY_MODEL_PROFILE'?'モデルのFile Search接続確認が完了しました。':'モデルポリシーを更新しました。'):(result&&result.error&&result.error.message?result.error.message:'モデルポリシーを更新できませんでした。'));await loadAiProviderAdminData(true)}catch(error){showStatus('ai-provider-admin-notice','error','モデルポリシーを更新できませんでした。');await loadAiProviderAdminData(true)}}
aiProviderAdminElement('ai-provider-openai-enable').addEventListener('click',()=>mutateAiProviderAdmin('CONNECT_OPENAI'));
aiProviderAdminElement('ai-provider-openai-disable').addEventListener('click',()=>mutateAiProviderAdmin('DISABLE_OPENAI'));
aiProviderAdminElement('ai-provider-openai-sync').addEventListener('click',()=>mutateAiProviderAdmin('SYNC',aiProviderAdminElement('ai-provider-sync-source').value,aiProviderAdminElement('ai-provider-sync-source-id').value));
aiProviderAdminElement('ai-model-profile-select').addEventListener('change',event=>{const profile=aiModelAdminProfiles().find(item=>item.profileId===event.target.value);aiModelAdminRenderProfile(profile||null)});
aiProviderAdminElement('ai-model-policy-migrate').addEventListener('click',()=>mutateAiModelPolicy('MIGRATE_MODEL_POLICY'));
aiProviderAdminElement('ai-model-profile-save').addEventListener('click',()=>mutateAiModelPolicy('SAVE_MODEL_PROFILE',{profile:aiModelAdminPayload()}));
aiProviderAdminElement('ai-model-profile-qualify').addEventListener('click',()=>mutateAiModelPolicy('QUALIFY_MODEL_PROFILE',{profileId:aiProviderAdminElement('ai-model-profile-id').value}));
aiProviderAdminElement('nav-ai-provider-settings').addEventListener('click',()=>loadAiProviderAdminData(false));
</script>
