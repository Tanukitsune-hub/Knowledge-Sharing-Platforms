<script>
let aiProviderAdminState=null;
let aiProviderAdminBusy=false;
let activeAdminTab='provider';
function aiProviderAdminElement(id){return document.getElementById(id)}
function selectAdminTab(tab,focus){
  if(tab!=='provider'&&tab!=='deleted'&&tab!=='theme')return;
  activeAdminTab=tab;
  document.querySelectorAll('[data-admin-tab]').forEach(button=>{const selected=button.dataset.adminTab===tab;button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;if(selected&&focus)button.focus()});
  aiProviderAdminElement('admin-panel-provider').hidden=tab!=='provider';
  aiProviderAdminElement('admin-panel-deleted').hidden=tab!=='deleted';
  aiProviderAdminElement('admin-panel-theme').hidden=tab!=='theme';
}
function adminTabKeydown(event){
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();const tabs=['provider','deleted','theme'];let index=tabs.indexOf(activeAdminTab);
  if(event.key==='Home')index=0;else if(event.key==='End')index=tabs.length-1;else index=(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  selectAdminTab(tabs[index],true);
}
function aiProviderAdminStatusLabel(value){return value==='ACTIVE'?'有効':value==='ACTIVE_WITH_SYNC_ERRORS'?'有効（一部同期エラー）':value==='READY_FOR_SYNC'?'同期準備完了':value==='READY_FOR_QUALIFICATION'?'利用確認待ち':value==='QUALIFIED_DISABLED'?'利用確認済み（無効）':value==='DISABLED_EXTERNAL_LIMITATION'?'利用不可':value==='TESTING'?'接続確認中':value==='RECONNECT_REQUIRED'?'再接続が必要':value==='ERROR'?'エラー':value==='UNCONFIGURED'?'未設定':'無効'}
let aiProviderAdminStateStale=false;
function aiProviderAdminSetBusy(busy){aiProviderAdminBusy=busy;kspSetRegionBusy(aiProviderAdminElement('admin-panel-provider'),busy)}
function aiProviderAdminSyncMessage(sync){const counts=`対象 ${Number(sync&&sync.selected||0)}件 / 同期 ${Number(sync&&sync.indexed||0)}件 / 登録情報の更新 ${Number(sync&&sync.metadataRefreshed||0)}件 / 変更なし ${Number(sync&&sync.unchanged||0)}件 / 検索データから削除 ${Number(sync&&sync.removed||0)}件 / 失敗 ${Number(sync&&sync.failed||0)}件`;return sync&&sync.partial?`一部の資料を同期できませんでした。${counts}`:`同期を完了しました。${counts}`}
async function loadAiProviderAdminData(preserveNotice){
  aiProviderAdminSetBusy(true);
  if(!preserveNotice)clearStatus('ai-provider-admin-notice');
  try{
    const result=await serverCall('getAiProviderAdminData',{});
    if(!result||!result.ok)throw Error('AI settings unavailable');
    aiProviderAdminState=result;aiProviderAdminStateStale=false;
  }catch(ignored){
    aiProviderAdminStateStale=true;
    showStatus('ai-provider-admin-notice','error','AI設定を更新できませんでした。表示中の状態は前回取得時点のものです。');
  }finally{aiProviderAdminSetBusy(false)}
}
let adminDeletedMeetingRecords=[];
let adminDeletedSearchBusy=false;
let adminDeletedRestoreBusy=false;
let adminDeletedRequestSequence=0;
let adminDeletedRenderedType='meeting';
function adminDeletedMeetingPayload(){return{dateFrom:aiProviderAdminElement('admin-deleted-date-from').value,dateTo:aiProviderAdminElement('admin-deleted-date-to').value,counterpartyId:aiProviderAdminElement('admin-deleted-counterparty-id').value,assetClassId:aiProviderAdminElement('admin-deleted-asset-class-id').value,status:aiProviderAdminElement('admin-deleted-status-filter').value,limit:100}}
function adminDeletedSourceType(){return aiProviderAdminElement('admin-deleted-source-type').value||'meeting'}
function adminDeletedSourceConfig(type){const selected=type||adminDeletedSourceType();return selected==='news'?{idKey:'newsId',search:'searchNewsRecords',status:'changeNewsStatus'}:selected==='assessment'?{idKey:'assessmentId',search:'searchAssessmentRecords',status:'changeAssessmentStatus'}:{idKey:'meetingId',search:'searchMeetingRecords',status:'changeMeetingStatus'}}
function adminDeletedStatusLabel(status){return status==='Inactive'?'削除済み':status==='Active'?'有効':String(status||'—')}
function renderAdminDeletedMeetings(records,type){adminDeletedRenderedType=type||adminDeletedSourceType();adminDeletedMeetingRecords=records||[];const idKey=adminDeletedSourceConfig(adminDeletedRenderedType).idKey;aiProviderAdminElement('admin-deleted-results').innerHTML=adminDeletedMeetingRecords.map((record,index)=>'<tr><td>'+escapeHtml(record.date||'')+'</td><td>'+escapeHtml(record[idKey]||record.id||'')+'</td><td>'+escapeHtml(record.counterpartyEntityName||record.gpName||(record.counterpartyNames||[]).join(' / '))+'</td><td>'+escapeHtml(record.assetClassName||'')+'</td><td>'+escapeHtml(record.teamName||record.title||'—')+'</td><td><span class="badge '+escapeHtml(record.status||'')+'">'+escapeHtml(adminDeletedStatusLabel(record.status))+'</span></td><td>'+escapeHtml(record.version||'')+'</td><td><div class="row-actions">'+(record.status==='Inactive'?'<button class="small-button" type="button" data-admin-restore-index="'+index+'">復元</button>':'<span class="hint">操作なし</span>')+'</div></td></tr>').join('')||'<tr><td colspan="8" class="empty-cell">該当なし</td></tr>'}
async function searchAdminDeletedMeetings(){if(adminDeletedSearchBusy)return;adminDeletedSearchBusy=true;const type=adminDeletedSourceType(),request=++adminDeletedRequestSequence,config=adminDeletedSourceConfig(type),button=aiProviderAdminElement('admin-deleted-search');kspSetActionBusy(button,true,'検索中…');kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),true);showStatus('admin-deleted-status','info busy','削除記録を検索中…');try{const result=await serverCall(config.search,adminDeletedMeetingPayload());if(request!==adminDeletedRequestSequence||type!==adminDeletedSourceType())return;if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'削除記録を検索できませんでした。');renderAdminDeletedMeetings(result.records||[],type);showStatus('admin-deleted-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){if(request===adminDeletedRequestSequence&&type===adminDeletedSourceType())showStatus('admin-deleted-status','error',error.message||String(error))}finally{adminDeletedSearchBusy=false;kspSetActionBusy(button,false);kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),false)}}
async function restoreAdminDeletedMeeting(index,trigger){if(adminDeletedRestoreBusy||adminDeletedSearchBusy||adminDeletedRenderedType!==adminDeletedSourceType())return;const record=adminDeletedMeetingRecords[Number(index)];if(!record||record.status!=='Inactive')return;const config=adminDeletedSourceConfig(adminDeletedRenderedType);adminDeletedRestoreBusy=true;aiProviderAdminElement('admin-deleted-source-type').disabled=true;kspSetActionBusy(trigger,true,'復元中…');kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),true);showStatus('admin-deleted-status','info busy','復元中…');try{const result=await serverCall(config.status,{[config.idKey]:record[config.idKey]||record.id,expectedVersion:record.version,targetStatus:'Active'});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'復元できませんでした。');adminDeletedRestoreBusy=false;await searchAdminDeletedMeetings()}catch(error){showStatus('admin-deleted-status','error',error.message||String(error))}finally{adminDeletedRestoreBusy=false;aiProviderAdminElement('admin-deleted-source-type').disabled=false;kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),false);if(trigger.isConnected)kspSetActionBusy(trigger,false)}}
aiProviderAdminElement('admin-deleted-source-type').addEventListener('change',()=>{adminDeletedRequestSequence+=1;adminDeletedRenderedType=adminDeletedSourceType();adminDeletedMeetingRecords=[];aiProviderAdminElement('admin-deleted-results').innerHTML='<tr><td colspan="8" class="empty-cell">検索すると記録が表示されます。</td></tr>';clearStatus('admin-deleted-status')});
aiProviderAdminElement('admin-deleted-search').addEventListener('click',searchAdminDeletedMeetings);
aiProviderAdminElement('admin-deleted-results').addEventListener('click',event=>{const button=event.target.closest('[data-admin-restore-index]');if(button)restoreAdminDeletedMeeting(button.dataset.adminRestoreIndex,button)});
document.querySelectorAll('[data-admin-tab]').forEach(button=>{button.addEventListener('click',()=>selectAdminTab(button.dataset.adminTab));button.addEventListener('keydown',adminTabKeydown)});
selectAdminTab('provider');
aiProviderAdminElement('nav-ai-provider-settings').addEventListener('click',()=>loadAiProviderAdminData(false));
</script>
