<script>
let aiProviderAdminState=null;
let aiProviderAdminBusy=false;
let activeAdminTab='provider';
function aiProviderAdminElement(id){return document.getElementById(id)}
function selectAdminTab(tab,focus){
  if(tab!=='provider'&&tab!=='deleted'&&tab!=='theme')return;
  activeAdminTab=tab;
  document.querySelectorAll('[data-admin-tab]').forEach(button=>{const selected=button.dataset.adminTab===tab;button.classList.toggle('active',selected);button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;if(selected&&focus)button.focus()});
  aiProviderAdminElement('admin-panel-provider').hidden=tab!=='provider';
  aiProviderAdminElement('admin-panel-deleted').hidden=tab!=='deleted';
  aiProviderAdminElement('admin-panel-theme').hidden=tab!=='theme';
}
function adminTabKeydown(event){
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();const tabs=['provider','deleted','theme'];let index=tabs.indexOf(activeAdminTab);
  if(event.key==='Home')index=0;else if(event.key==='End')index=tabs.length-1;else index=(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  selectAdminTab(tabs[index],true);
}
function aiProviderAdminStatusLabel(value){return value==='ACTIVE'?'有効':value==='ACTIVE_WITH_SYNC_ERRORS'?'有効（一部同期エラー）':value==='READY_FOR_SYNC'?'同期準備完了':value==='READY_FOR_QUALIFICATION'?'利用確認待ち':value==='QUALIFIED_DISABLED'?'利用確認済み（無効）':value==='DISABLED_EXTERNAL_LIMITATION'?'利用不可':value==='TESTING'?'接続確認中':value==='RECONNECT_REQUIRED'?'再接続が必要':value==='ERROR'?'エラー':value==='UNCONFIGURED'?'未設定':'無効'}
function aiModelAdminQualificationLabel(value){return value==='QUALIFIED'||value==='AVAILABLE'?'利用可':value==='FAILED'||value==='UNAVAILABLE'?'利用不可':value==='STALE'?'再確認が必要':'未確認'}
function aiProviderAdminBooleanLabel(value){return value?'設定済み':'未設定'}
function aiProviderAdminStoreLabel(value){return value?'準備済み':'未作成'}
function aiModelAdminProfiles(){return aiProviderAdminState&&aiProviderAdminState.modelPolicy&&Array.isArray(aiProviderAdminState.modelPolicy.profiles)?aiProviderAdminState.modelPolicy.profiles:[]}
function aiProviderAdminSetBusy(busy){aiProviderAdminBusy=busy;kspSetRegionBusy(aiProviderAdminElement('admin-panel-provider'),busy);const canMutate=Boolean(aiProviderAdminState&&aiProviderAdminState.canMutate);['ai-provider-openai-key-input','ai-provider-sync-source','ai-provider-sync-source-id','ai-provider-openai-enable','ai-provider-openai-disable','ai-provider-openai-sync','ai-provider-gemini-key-input','ai-provider-gemini-sync-source','ai-provider-gemini-sync-source-id','ai-provider-gemini-connect','ai-provider-gemini-enable','ai-provider-gemini-disable','ai-provider-gemini-sync','ai-model-profile-select','ai-model-profile-id','ai-model-provider','ai-model-id','ai-model-display-name','ai-model-family','ai-model-max-output','ai-model-thinking-profiles','ai-model-default-thinking','ai-model-enabled','ai-model-user-visible','ai-model-provider-default','ai-model-policy-migrate','ai-model-profile-save','ai-model-profile-qualify'].forEach(id=>{const node=aiProviderAdminElement(id);if(node)node.disabled=busy||!canMutate})}
function aiModelAdminRenderProfile(profile){const value=profile||{};aiProviderAdminElement('ai-model-profile-id').value=value.profileId||'';aiProviderAdminElement('ai-model-provider').value=value.provider||'OPENAI';aiProviderAdminElement('ai-model-id').value=value.modelId||'';aiProviderAdminElement('ai-model-display-name').value=value.displayName||'';aiProviderAdminElement('ai-model-family').value=value.family||'';aiProviderAdminElement('ai-model-max-output').value=value.maxOutputTokens==null?'':String(value.maxOutputTokens);aiProviderAdminElement('ai-model-thinking-profiles').value=(value.thinkingProfiles||[]).map(item=>[item.thinkingProfileId,item.label,item.providerDefault?'':(item.rawValue||'')].join(' | ')).join('\n');aiProviderAdminElement('ai-model-default-thinking').value=value.defaultThinkingProfileId||'provider-default';aiProviderAdminElement('ai-model-enabled').checked=value.enabled!==false;aiProviderAdminElement('ai-model-user-visible').checked=value.userVisible!==false;aiProviderAdminElement('ai-model-provider-default').checked=Boolean(value.isProviderDefault);aiProviderAdminElement('ai-model-access-state').textContent=aiModelAdminQualificationLabel(value.apiAccess);aiProviderAdminElement('ai-model-qualification-state').textContent=aiModelAdminQualificationLabel(value.qualification);aiProviderAdminElement('ai-model-thinking-qualification-state').textContent=(value.thinkingProfiles||[]).map(item=>(item.label||item.thinkingProfileId)+': '+aiModelAdminQualificationLabel(item.qualification)).join(' / ')||'未登録';aiProviderAdminElement('ai-model-profile-qualify').disabled=aiProviderAdminBusy||!Boolean(aiProviderAdminState&&aiProviderAdminState.canMutate)||!Boolean(value.profileId)}
function aiModelAdminRenderPolicy(data){const select=aiProviderAdminElement('ai-model-profile-select');const prior=select.value;select.innerHTML='<option value="">新規作成</option>';aiModelAdminProfiles().forEach(profile=>{const option=document.createElement('option');option.value=profile.profileId;option.textContent=(profile.isProviderDefault?'★ ':'')+profile.displayName+' / '+profile.modelId;select.appendChild(option)});const selected=aiModelAdminProfiles().find(profile=>profile.profileId===prior)||aiModelAdminProfiles().find(profile=>profile.isProviderDefault)||aiModelAdminProfiles()[0];if(selected){select.value=selected.profileId;aiModelAdminRenderProfile(selected)}else{select.value='';aiModelAdminRenderProfile(null)}const migrate=aiProviderAdminElement('ai-model-policy-migrate');if(migrate)migrate.textContent=data&&data.modelPolicyPersisted?'ポリシー再確認':'現行設定から初期化'}
function renderAiProviderAdminData(data){const openai=data&&data.openai?data.openai:{};const gemini=data&&data.gemini?data.gemini:{};aiProviderAdminElement('ai-provider-openai-key').textContent=aiProviderAdminBooleanLabel(Boolean(openai.keyConfigured));aiProviderAdminElement('ai-provider-openai-store').textContent=aiProviderAdminStoreLabel(Boolean(openai.vectorStoreReady));aiProviderAdminElement('ai-provider-openai-status').textContent=aiProviderAdminStatusLabel(String(openai.status||'DISABLED'));aiProviderAdminElement('ai-provider-gemini-key').textContent=aiProviderAdminBooleanLabel(Boolean(gemini.keyConfigured));aiProviderAdminElement('ai-provider-gemini-store').textContent=aiProviderAdminStoreLabel(Boolean(gemini.storeReady));aiProviderAdminElement('ai-provider-gemini-status').textContent=aiProviderAdminStatusLabel(String(gemini.status||'DISABLED'));const readonly=aiProviderAdminElement('ai-provider-openai-readonly');readonly.textContent=data&&data.canMutate?'この画面から設定を変更できます。':'設定の状態を読み込めません。';aiModelAdminRenderPolicy(data);aiProviderAdminSetBusy(false)}
async function loadAiProviderAdminData(preserveNotice){aiProviderAdminSetBusy(true);if(!preserveNotice)clearStatus('ai-provider-admin-notice');try{const result=await serverCall('getAiProviderAdminData',{});if(!result||!result.ok){aiProviderAdminState=null;renderAiProviderAdminData({});showStatus('ai-provider-admin-notice','error','AI設定を読み込めませんでした。');return}aiProviderAdminState=result;renderAiProviderAdminData(result)}catch(error){aiProviderAdminState=null;renderAiProviderAdminData({});showStatus('ai-provider-admin-notice','error','AI設定を読み込めませんでした。')}}
function aiProviderAdminSyncMessage(sync){const counts=`対象 ${Number(sync&&sync.selected||0)}件 / 同期 ${Number(sync&&sync.indexed||0)}件 / 登録情報の更新 ${Number(sync&&sync.metadataRefreshed||0)}件 / 変更なし ${Number(sync&&sync.unchanged||0)}件 / 検索データから削除 ${Number(sync&&sync.removed||0)}件 / 失敗 ${Number(sync&&sync.failed||0)}件`;return sync&&sync.partial?`一部の資料を同期できませんでした。${counts}`:`同期を完了しました。${counts}`}
function aiProviderAdminBusyLabel(action){return action==='SYNC'||action==='SYNC_GEMINI'?'同期中…':action==='DISABLE_OPENAI'||action==='DISABLE_GEMINI'?'無効化中…':action==='ENABLE_GEMINI'?'有効化中…':'接続確認中…'}
async function mutateAiProviderAdmin(action,sourceType,sourceId,trigger){if(aiProviderAdminBusy)return;const busyLabel=aiProviderAdminBusyLabel(action);kspSetActionBusy(trigger,true,busyLabel);aiProviderAdminSetBusy(true);showStatus('ai-provider-admin-notice','info busy',busyLabel);let apiKey='';const isGemini=action==='CONNECT_GEMINI';const keyInput=aiProviderAdminElement(isGemini?'ai-provider-gemini-key-input':'ai-provider-openai-key-input');if(action==='CONNECT_OPENAI'||isGemini){apiKey=keyInput?keyInput.value:'';if(keyInput)keyInput.value=''}try{const isSync=action==='SYNC'||action==='SYNC_GEMINI';const payload={action,sourceType:isSync?(sourceType||''):'',sourceId:isSync?(sourceId||''):''};if(action==='CONNECT_OPENAI'||isGemini)payload.apiKey=apiKey;const result=await serverCall('mutateAiProviderSettings',payload);if(result&&result.ok){showStatus('ai-provider-admin-notice',result.sync&&result.sync.partial?'warning':'success',isSync?aiProviderAdminSyncMessage(result.sync):result.readyForSync?'接続確認が完了しました。資料の同期を始められます。':result.readyForQualification?'接続できました。資料の同期とモデルの利用確認を続けてください。':'設定を更新しました。')}else{showStatus('ai-provider-admin-notice','error',result&&result.error&&result.error.message?result.error.message:'操作を完了できませんでした。')}await loadAiProviderAdminData(true)}catch(error){showStatus('ai-provider-admin-notice','error','操作を完了できませんでした。');await loadAiProviderAdminData(true)}finally{apiKey='';kspSetActionBusy(trigger,false);aiProviderAdminSetBusy(false)}}
function aiModelAdminThinkingProfiles(){return aiProviderAdminElement('ai-model-thinking-profiles').value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split('|').map(value=>value.trim());return{thinkingProfileId:parts[0],label:parts[1]||parts[0],rawValue:parts[2]||null,providerDefault:!parts[2],enabled:true}})}
function aiModelAdminPayload(){const max=aiProviderAdminElement('ai-model-max-output').value;return{profileId:aiProviderAdminElement('ai-model-profile-id').value,provider:aiProviderAdminElement('ai-model-provider').value,modelId:aiProviderAdminElement('ai-model-id').value,displayName:aiProviderAdminElement('ai-model-display-name').value,family:aiProviderAdminElement('ai-model-family').value,enabled:aiProviderAdminElement('ai-model-enabled').checked,userVisible:aiProviderAdminElement('ai-model-user-visible').checked,isProviderDefault:aiProviderAdminElement('ai-model-provider-default').checked,thinkingProfiles:aiModelAdminThinkingProfiles(),defaultThinkingProfileId:aiProviderAdminElement('ai-model-default-thinking').value,maxOutputTokens:max?Number(max):null}}
function aiModelPolicyBusyLabel(action){return action==='QUALIFY_MODEL_PROFILE'?'確認中…':action==='SAVE_MODEL_PROFILE'?'保存中…':'移行中…'}
async function mutateAiModelPolicy(action,payload,trigger){if(aiProviderAdminBusy)return;const busyLabel=aiModelPolicyBusyLabel(action);kspSetActionBusy(trigger,true,busyLabel);aiProviderAdminSetBusy(true);showStatus('ai-provider-admin-notice','info busy',busyLabel);try{const request=Object.assign({action},payload||{});const result=await serverCall('mutateAiProviderSettings',request);showStatus('ai-provider-admin-notice',result&&result.ok?'success':'error',result&&result.ok?(action==='QUALIFY_MODEL_PROFILE'?'モデルの資料検索を利用できます。':'モデル設定を更新しました。'):(result&&result.error&&result.error.message?result.error.message:'モデル設定を更新できませんでした。'));await loadAiProviderAdminData(true)}catch(error){showStatus('ai-provider-admin-notice','error','モデル設定を更新できませんでした。');await loadAiProviderAdminData(true)}finally{kspSetActionBusy(trigger,false);aiProviderAdminSetBusy(false)}}
aiProviderAdminElement('ai-provider-openai-enable').addEventListener('click',event=>mutateAiProviderAdmin('CONNECT_OPENAI','','',event.currentTarget));
aiProviderAdminElement('ai-provider-openai-disable').addEventListener('click',event=>mutateAiProviderAdmin('DISABLE_OPENAI','','',event.currentTarget));
aiProviderAdminElement('ai-provider-openai-sync').addEventListener('click',event=>mutateAiProviderAdmin('SYNC',aiProviderAdminElement('ai-provider-sync-source').value,aiProviderAdminElement('ai-provider-sync-source-id').value,event.currentTarget));
aiProviderAdminElement('ai-provider-gemini-connect').addEventListener('click',event=>mutateAiProviderAdmin('CONNECT_GEMINI','','',event.currentTarget));
aiProviderAdminElement('ai-provider-gemini-enable').addEventListener('click',event=>mutateAiProviderAdmin('ENABLE_GEMINI','','',event.currentTarget));
aiProviderAdminElement('ai-provider-gemini-disable').addEventListener('click',event=>mutateAiProviderAdmin('DISABLE_GEMINI','','',event.currentTarget));
aiProviderAdminElement('ai-provider-gemini-sync').addEventListener('click',event=>mutateAiProviderAdmin('SYNC_GEMINI',aiProviderAdminElement('ai-provider-gemini-sync-source').value,aiProviderAdminElement('ai-provider-gemini-sync-source-id').value,event.currentTarget));
aiProviderAdminElement('ai-model-profile-select').addEventListener('change',event=>{const profile=aiModelAdminProfiles().find(item=>item.profileId===event.target.value);aiModelAdminRenderProfile(profile||null)});
aiProviderAdminElement('ai-model-policy-migrate').addEventListener('click',event=>mutateAiModelPolicy('MIGRATE_MODEL_POLICY',null,event.currentTarget));
aiProviderAdminElement('ai-model-profile-save').addEventListener('click',event=>mutateAiModelPolicy('SAVE_MODEL_PROFILE',{profile:aiModelAdminPayload()},event.currentTarget));
aiProviderAdminElement('ai-model-profile-qualify').addEventListener('click',event=>mutateAiModelPolicy('QUALIFY_MODEL_PROFILE',{profileId:aiProviderAdminElement('ai-model-profile-id').value,thinkingProfileId:aiProviderAdminElement('ai-model-default-thinking').value},event.currentTarget));
let adminDeletedMeetingRecords=[];
let adminDeletedSearchBusy=false;
let adminDeletedRestoreBusy=false;
let adminDeletedRequestSequence=0;
let adminDeletedRenderedType='meeting';
function adminDeletedMeetingPayload(){return{dateFrom:aiProviderAdminElement('admin-deleted-date-from').value,dateTo:aiProviderAdminElement('admin-deleted-date-to').value,counterpartyId:aiProviderAdminElement('admin-deleted-counterparty-id').value,assetClassId:aiProviderAdminElement('admin-deleted-asset-class-id').value,status:aiProviderAdminElement('admin-deleted-status-filter').value,limit:100}}
function adminDeletedSourceType(){return aiProviderAdminElement('admin-deleted-source-type').value||'meeting'}
function adminDeletedSourceConfig(type){const selected=type||adminDeletedSourceType();return selected==='news'?{idKey:'newsId',search:'searchNewsRecords',status:'changeNewsStatus'}:selected==='assessment'?{idKey:'assessmentId',search:'searchAssessmentRecords',status:'changeAssessmentStatus'}:{idKey:'meetingId',search:'searchMeetingRecords',status:'changeMeetingStatus'}}
function adminDeletedStatusLabel(status){return status==='Inactive'?'削除済み':status==='Active'?'有効':String(status||'—')}
function renderAdminDeletedMeetings(records,type){adminDeletedRenderedType=type||adminDeletedSourceType();adminDeletedMeetingRecords=records||[];const idKey=adminDeletedSourceConfig(adminDeletedRenderedType).idKey;aiProviderAdminElement('admin-deleted-results').innerHTML=adminDeletedMeetingRecords.map((record,index)=>'<tr><td>'+escapeHtml(record.date||'')+'</td><td>'+escapeHtml(record[idKey]||record.id||'')+'</td><td>'+escapeHtml(record.counterpartyEntityName||record.gpName||(record.counterpartyNames||[]).join(' / '))+'</td><td>'+escapeHtml(record.assetClassName||'')+'</td><td>'+escapeHtml(record.teamName||record.title||'—')+'</td><td><span class="badge '+escapeHtml(record.status||'')+'">'+escapeHtml(adminDeletedStatusLabel(record.status))+'</span></td><td>'+escapeHtml(record.version||'')+'</td><td><div class="row-actions">'+(record.status==='Inactive'?'<button class="small-button" type="button" data-admin-restore-index="'+index+'">復元</button>':'<span class="hint">操作なし</span>')+'</div></td></tr>').join('')||'<tr><td colspan="8" class="empty-cell">該当なし</td></tr>'}
async function searchAdminDeletedMeetings(){if(adminDeletedSearchBusy)return;adminDeletedSearchBusy=true;const type=adminDeletedSourceType(),request=++adminDeletedRequestSequence,config=adminDeletedSourceConfig(type),button=aiProviderAdminElement('admin-deleted-search');kspSetActionBusy(button,true,'検索中…');kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),true);showStatus('admin-deleted-status','info busy','削除記録を検索中…');try{const result=await serverCall(config.search,adminDeletedMeetingPayload());if(request!==adminDeletedRequestSequence||type!==adminDeletedSourceType())return;if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'削除記録を検索できませんでした。');renderAdminDeletedMeetings(result.records||[],type);showStatus('admin-deleted-status','info',(result.records||[]).length+'件を表示しました。')}catch(error){if(request===adminDeletedRequestSequence&&type===adminDeletedSourceType())showStatus('admin-deleted-status','error',error.message||String(error))}finally{adminDeletedSearchBusy=false;kspSetActionBusy(button,false);kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),false)}}
async function restoreAdminDeletedMeeting(index,trigger){if(adminDeletedRestoreBusy||adminDeletedSearchBusy||adminDeletedRenderedType!==adminDeletedSourceType())return;const record=adminDeletedMeetingRecords[Number(index)];if(!record||record.status!=='Inactive')return;const config=adminDeletedSourceConfig(adminDeletedRenderedType);adminDeletedRestoreBusy=true;aiProviderAdminElement('admin-deleted-source-type').disabled=true;kspSetActionBusy(trigger,true,'復元中…');kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),true);showStatus('admin-deleted-status','info busy','復元中…');try{const result=await serverCall(config.status,{[config.idKey]:record[config.idKey]||record.id,expectedVersion:record.version,targetStatus:'Active'});if(!result||!result.ok)throw new Error(result&&result.error?result.error.message:'復元できませんでした。');adminDeletedRestoreBusy=false;await searchAdminDeletedMeetings()}catch(error){showStatus('admin-deleted-status','error',error.message||String(error))}finally{adminDeletedRestoreBusy=false;aiProviderAdminElement('admin-deleted-source-type').disabled=false;kspSetRegionBusy(aiProviderAdminElement('admin-deleted-meetings'),false);if(trigger.isConnected)kspSetActionBusy(trigger,false)}}
aiProviderAdminElement('admin-deleted-source-type').addEventListener('change',()=>{adminDeletedRequestSequence+=1;adminDeletedRenderedType=adminDeletedSourceType();adminDeletedMeetingRecords=[];aiProviderAdminElement('admin-deleted-results').innerHTML='<tr><td colspan="8" class="empty-cell">検索すると記録が表示されます。</td></tr>';clearStatus('admin-deleted-status')});
aiProviderAdminElement('admin-deleted-search').addEventListener('click',searchAdminDeletedMeetings);
aiProviderAdminElement('admin-deleted-results').addEventListener('click',event=>{const button=event.target.closest('[data-admin-restore-index]');if(button)restoreAdminDeletedMeeting(button.dataset.adminRestoreIndex,button)});
document.querySelectorAll('[data-admin-tab]').forEach(button=>{button.addEventListener('click',()=>selectAdminTab(button.dataset.adminTab));button.addEventListener('keydown',adminTabKeydown)});
selectAdminTab('provider');
aiProviderAdminElement('nav-ai-provider-settings').addEventListener('click',()=>loadAiProviderAdminData(false));
</script>
