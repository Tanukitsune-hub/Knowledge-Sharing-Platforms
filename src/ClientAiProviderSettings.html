<script>
let aiProviderAdminState=null;
let aiProviderAdminBusy=false;
function aiProviderAdminElement(id){return document.getElementById(id)}
function aiProviderAdminStatusLabel(value){return value==='ENABLED'?'有効':value==='ERROR'?'エラー':'無効'}
function aiProviderAdminBooleanLabel(value){return value?'設定済み':'未設定'}
function aiProviderAdminStoreLabel(value){return value?'準備済み':'未作成'}
function aiProviderAdminSetBusy(busy){aiProviderAdminBusy=busy;const canMutate=Boolean(aiProviderAdminState&&aiProviderAdminState.canMutate);['ai-provider-sync-source','ai-provider-openai-enable','ai-provider-openai-disable','ai-provider-openai-sync'].forEach(id=>{const node=aiProviderAdminElement(id);if(node)node.disabled=busy||!canMutate})}
function renderAiProviderAdminData(data){const openai=data&&data.openai?data.openai:{};aiProviderAdminElement('ai-provider-openai-key').textContent=aiProviderAdminBooleanLabel(Boolean(openai.keyConfigured));aiProviderAdminElement('ai-provider-openai-store').textContent=aiProviderAdminStoreLabel(Boolean(openai.vectorStoreReady));aiProviderAdminElement('ai-provider-openai-status').textContent=aiProviderAdminStatusLabel(String(openai.status||'DISABLED'));const readonly=aiProviderAdminElement('ai-provider-openai-readonly');readonly.textContent=data&&data.canMutate?'管理者操作が利用できます。':'管理者権限を確認できないため、変更操作は利用できません。';aiProviderAdminSetBusy(false)}
async function loadAiProviderAdminData(){aiProviderAdminSetBusy(true);clearStatus('ai-provider-admin-notice');try{const result=await serverCall('getAiProviderAdminData');if(!result||!result.ok){aiProviderAdminState=null;renderAiProviderAdminData({});showStatus('ai-provider-admin-notice','error','AIプロバイダ設定を確認できませんでした。');return}aiProviderAdminState=result;renderAiProviderAdminData(result);if(!result.canMutate)showStatus('ai-provider-admin-notice','info','状態は閲覧できますが、変更操作は管理者だけが実行できます。')}catch(error){aiProviderAdminState=null;renderAiProviderAdminData({});showStatus('ai-provider-admin-notice','error','AIプロバイダ設定を確認できませんでした。')}}
async function mutateAiProviderAdmin(action,sourceType){if(aiProviderAdminBusy)return;aiProviderAdminSetBusy(true);clearStatus('ai-provider-admin-notice');try{const result=await serverCall('mutateAiProviderSettings',{action,sourceType:action==='SYNC'?(sourceType||''):''});if(result&&result.ok){showStatus('ai-provider-admin-notice','success',action==='SYNC'?'同期を実行しました。':'設定を更新しました。')}else{showStatus('ai-provider-admin-notice','error',result&&result.error&&result.error.message?result.error.message:'操作を完了できませんでした。')}await loadAiProviderAdminData()}catch(error){showStatus('ai-provider-admin-notice','error','操作を完了できませんでした。');await loadAiProviderAdminData()}}
aiProviderAdminElement('ai-provider-openai-enable').addEventListener('click',()=>mutateAiProviderAdmin('ENABLE_OPENAI'));aiProviderAdminElement('ai-provider-openai-disable').addEventListener('click',()=>mutateAiProviderAdmin('DISABLE_OPENAI'));aiProviderAdminElement('ai-provider-openai-sync').addEventListener('click',()=>mutateAiProviderAdmin('SYNC',aiProviderAdminElement('ai-provider-sync-source').value));aiProviderAdminElement('nav-ai-provider-settings').addEventListener('click',loadAiProviderAdminData);
</script>
