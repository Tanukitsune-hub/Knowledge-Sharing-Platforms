<script>
async function uploadSlot(slot){const file=fileForSlot(slot);if(!file)return{ok:false,slot,error:{message:slot.originalFilename+' を再選択してください。'}};try{const base64Data=await readBase64(file);const result=await serverCall('uploadPitchbookFile',{batchId:slot.batchId,documentId:slot.documentId,slotFingerprint:slot.slotFingerprint,originalFilename:file.name,sizeBytes:file.size,mimeType:file.type||'application/octet-stream',base64Data});return result}catch(error){return{ok:false,slot,error:{message:error&&error.message?error.message:String(error)}}}}
async function processSlots(slots){const results=[];for(const slot of slots){const result=await uploadSlot(slot);results.push(result);if(result&&result.slot){const index=pitchbookSlots.findIndex(item=>item.documentId===result.slot.documentId);if(index>=0)pitchbookSlots[index]={...pitchbookSlots[index],...result.slot}}else{const index=pitchbookSlots.findIndex(item=>item.documentId===slot.documentId);if(index>=0)pitchbookSlots[index].status='Failed'}savePitchbookSlots();renderPitchbookFiles()}return results}
function summarizeResults(results){const success=results.filter(r=>r&&r.ok).length,failed=results.length-success;if(failed===0){showStatus('pitchbook-status','success',success+'件を登録しました。');pitchbookSlots=[];selectedPitchbookFiles=[];fileInput.value='';savePitchbookSlots();renderPitchbookFiles()}else{showStatus('pitchbook-status','warning',success+'件成功、'+failed+'件失敗。成功済みファイルは維持されています。失敗分を再試行できます。')}}
el('pitchbook-form').addEventListener('submit',async event=>{event.preventDefault();clearStatus('pitchbook-status');const metadata=pitchbookMetadata(),fileError=validateFiles(selectedPitchbookFiles);if(!metadata.date||!metadata.gpId||!metadata.assetClassId){showStatus('pitchbook-status','error','日付、GP、Asset Classは必須です。');return}if(fileError){showStatus('pitchbook-status','error',fileError);return}syncShared('pitchbook');setPitchbookBusy(true);try{const prepared=await serverCall('preparePitchbookBatch',{...metadata,files:selectedPitchbookFiles.map(fileDescriptor)});if(!prepared||!prepared.ok){setPitchbookBusy(false);showStatus('pitchbook-status','error',prepared&&prepared.error?prepared.error.message:'Batch準備に失敗しました。');return}pitchbookSlots=prepared.slots.map((slot,index)=>({...slot,ordinal:index+1,sizeBytes:selectedPitchbookFiles[index].size}));savePitchbookSlots();renderPitchbookFiles();const results=await processSlots(pitchbookSlots.slice());setPitchbookBusy(false);summarizeResults(results)}catch(error){setPitchbookBusy(false);showStatus('pitchbook-status','error',error&&error.message?error.message:String(error))}});
el('pitchbook-retry').onclick=async()=>{const retrySlots=pitchbookSlots.filter(slot=>slot.status==='Failed'||slot.status==='Pending');if(!retrySlots.length)return;const missing=retrySlots.filter(slot=>!fileForSlot(slot));if(missing.length){showStatus('pitchbook-status','error','失敗したファイルを再選択してください: '+missing.map(slot=>slot.originalFilename).join(', '));return}setPitchbookBusy(true);const results=await processSlots(retrySlots);setPitchbookBusy(false);summarizeResults(results)};
el('pitchbook-clear').onclick=()=>{if(!confirm('Pitchbookの選択ファイルとupload slotを消去しますか？'))return;selectedPitchbookFiles=[];pitchbookSlots=[];fileInput.value='';savePitchbookSlots();renderPitchbookFiles();clearStatus('pitchbook-status')};

</script>
