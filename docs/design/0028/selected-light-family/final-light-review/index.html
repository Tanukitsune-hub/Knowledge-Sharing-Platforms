<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Share — Final Light review</title>
  <style>
    :root { color-scheme: light; --page:#f4f7fa; --card:#fff; --ink:#182124; --muted:#60707a; --line:#ccd6dd; --gold:#9a7430; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:"Yu Gothic UI","Noto Sans JP",sans-serif; }
    header { padding:24px clamp(18px,4vw,52px); background:#182124; color:#fff; border-bottom:3px solid #9a7430; }
    h1 { margin:0 0 6px; font:600 28px/1.3 Georgia,"Yu Mincho",serif; }
    header p { margin:0; color:#dbe2df; }
    main { width:min(1500px,100%); margin:auto; padding:24px clamp(14px,3vw,36px) 48px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr)); gap:20px; }
    figure { margin:0; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 18px rgba(24,33,36,.08); }
    img { display:block; width:100%; height:auto; border:1px solid #dfe6eb; }
    figcaption { padding:10px 2px 2px; font-weight:700; color:var(--ink); }
    small { color:var(--muted); font-weight:400; }
  </style>
</head>
<body>
  <header><h1>Final Light review</h1><p>A1.9 / screenshot index / synthetic data only</p></header>
  <main><div class="grid">
    <figure><img src="screenshots/01-sidebar-overview.png" alt="final sidebar overview"><figcaption>01 — final sidebar / shell</figcaption></figure>
    <figure><img src="screenshots/02-knowledge-search.png" alt="ナレッジ検索"><figcaption>02 — ナレッジ検索</figcaption></figure>
    <figure><img src="screenshots/03-register-meeting.png" alt="記録を追加 面談"><figcaption>03 — 記録を追加 / 面談</figcaption></figure>
    <figure><img src="screenshots/04-register-document.png" alt="記録を追加 資料"><figcaption>04 — 記録を追加 / 資料</figcaption></figure>
    <figure><img src="screenshots/05-past-records-meeting.png" alt="過去の記録 面談"><figcaption>05 — 過去の記録 / 面談</figcaption></figure>
    <figure><img src="screenshots/06-past-records-document.png" alt="過去の記録 資料"><figcaption>06 — 過去の記録 / 資料</figcaption></figure>
    <figure><img src="screenshots/07-counterparty-summary-gp.png" alt="面談先サマリー GP"><figcaption>07 — 面談先サマリー / GP</figcaption></figure>
    <figure><img src="screenshots/08-counterparty-summary-entity.png" alt="面談先サマリー non-GP"><figcaption>08 — 面談先サマリー / non-GP</figcaption></figure>
    <figure><img src="screenshots/09-activity-analytics-top.png" alt="面談実績の集計 上部"><figcaption>09 — 面談実績の集計 / top</figcaption></figure>
    <figure><img src="screenshots/10-activity-analytics-bottom.png" alt="面談実績の集計 下部"><figcaption>10 — 面談実績の集計 / bottom</figcaption></figure>
    <figure><img src="screenshots/11-relationship.png" alt="面談と資料の関連"><figcaption>11 — 面談と資料の関連</figcaption></figure>
    <figure><img src="screenshots/12-admin-page.png" alt="管理者ページ"><figcaption>12 — 管理者ページ</figcaption></figure>
    <figure><img src="screenshots/13-dropdown-management.png" alt="プルダウンの管理"><figcaption>13 — プルダウンの管理</figcaption></figure>
  </div></main>
</body>
</html>
