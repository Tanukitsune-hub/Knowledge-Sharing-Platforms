<form id="search-demo">
  <div class="search-scope">
    <div><label for="search-gp">GP</label><select id="search-gp"><option>すべてのGP</option><option>サンプルGP</option><option>サンプルGP B</option></select></div>
    <div><label for="search-source">情報ソース</label><select id="search-source" data-contract="sourceType"><option value="">面談記録・資料</option><option value="Meeting">面談記録のみ</option><option value="Pitchbook">資料のみ</option></select></div>
    <div><label for="search-from">開始日</label><input id="search-from" type="date" value="2023-09-07" data-contract="dateFrom"></div>
    <div><label for="search-to">終了日</label><input id="search-to" type="date" value="2026-09-07" data-contract="dateTo"></div>
    <label class="all-period"><input id="all-period" type="checkbox">全期間</label>
  </div>
  <div class="search-choice">
    <div><label for="search-mode">検索モード</label><select id="search-mode"><option value="free">自由質問</option><option value="summary">要約</option><option value="timeline">時系列</option><option value="compare">比較</option><option value="prep">面談準備</option></select></div>
    <div><label for="knowledge-visible-model">AIモデル</label><select id="knowledge-visible-model" data-visible-model-selector="true" data-contract-map="route modelProfileId thinkingProfileId"><option value="APPROVED_OPENAI_PROFILE">GPT-5.6 Luna</option><option value="FULL_EXPORT">全文出力（AIを使わない）</option></select></div>
  </div>
  <label for="search-question">質問 <span class="req" id="question-required">必須</span></label>
  <textarea class="question-wide" id="search-question" maxlength="5000" required placeholder="知りたい内容を入力してください。"></textarea>
  <p class="search-help" id="question-help">自由に質問を入力できます。5,000文字まで。</p>
  <div id="compare-context" class="mode-context" hidden><label for="compare-entities">比較対象（2〜5件）</label><select id="compare-entities" multiple size="3" data-contract="selectedEntityKeys"><option value="GP:A">サンプルGP</option><option value="GP:B">サンプルGP B</option><option value="Entity:C">サンプルLP</option></select><p class="hint">対象を2〜5件選択してください。GPとEntityの既存比較条件を維持します。</p></div>
  <div id="prep-context" class="mode-context" hidden><label for="prep-target">面談準備の対象</label><select id="prep-target" data-contract="entityKey"><option value="">対象を選択</option><option value="GP:A">サンプルGP</option><option value="Entity:C">サンプルLP</option></select></div>
  <details><summary>詳細条件（任意）</summary><!-- EXTRA_FILTERS --></details>
  <div class="actions"><button class="primary" id="search-run" type="submit">検索</button><button id="search-clear" type="button">条件をクリア</button><span class="hint" id="search-status" role="status">初期期間：直近3年間</span></div>
</form>
<script src="search-demo.js" defer></script>
