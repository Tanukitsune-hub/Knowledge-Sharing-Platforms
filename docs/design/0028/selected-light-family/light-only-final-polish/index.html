<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEX-08 Light-only final polish</title>
<style>
  :root{color-scheme:light;--paper:#F4F7FA;--surface:#fff;--ink:#26333A;--muted:#5B6871;--line:#D3DCE4;--gold:#8B703E}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "Yu Gothic UI",Meiryo,sans-serif}
  main{max-width:1440px;margin:auto;padding:28px}h1{margin:0 0 6px;font:28px/1.3 "Yu Mincho",serif}p{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.shot{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--gold);padding:10px;margin:0}
  .shot img{display:block;width:100%;height:auto}.shot figcaption{padding:8px 4px 2px;font-weight:650}
  @media(max-width:850px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style>
<body><main>
<h1>Light-only final polish</h1>
<p>Web Appの初期画面はナレッジ検索。11枚すべてsynthetic dataのdesign-only screenshotです。</p>
<div class="grid">
<figure class="shot"><img src="screenshots/01-knowledge-search.png" alt="ナレッジ検索"><figcaption>01 ナレッジ検索</figcaption></figure>
<figure class="shot"><img src="screenshots/02-register-meeting.png" alt="記録を追加 面談"><figcaption>02 記録を追加 / 面談</figcaption></figure>
<figure class="shot"><img src="screenshots/03-register-document.png" alt="記録を追加 資料"><figcaption>03 記録を追加 / 資料</figcaption></figure>
<figure class="shot"><img src="screenshots/04-past-records-meeting-relationships.png" alt="過去の面談と関連資料"><figcaption>04 過去の記録 / 面談と関連資料</figcaption></figure>
<figure class="shot"><img src="screenshots/05-past-records-document-relationships.png" alt="過去の資料と関連面談"><figcaption>05 過去の記録 / 資料と関連面談</figcaption></figure>
<figure class="shot"><img src="screenshots/06-counterparty-summary-gp.png" alt="面談先サマリー GP"><figcaption>06 面談先サマリー / GP</figcaption></figure>
<figure class="shot"><img src="screenshots/07-counterparty-summary-entity.png" alt="面談先サマリー non-GP"><figcaption>07 面談先サマリー / non-GP</figcaption></figure>
<figure class="shot"><img src="screenshots/08-activity-analytics-top.png" alt="面談実績の集計 上部"><figcaption>08 面談実績の集計 / 上部</figcaption></figure>
<figure class="shot"><img src="screenshots/09-activity-analytics-bottom.png" alt="面談実績の集計 下部"><figcaption>09 面談実績の集計 / 下部</figcaption></figure>
<figure class="shot"><img src="screenshots/10-dropdown-management.png" alt="プルダウンの管理"><figcaption>10 プルダウンの管理</figcaption></figure>
<figure class="shot"><img src="screenshots/11-admin-page.png" alt="管理者ページ"><figcaption>11 管理者ページ</figcaption></figure>
</div>
</main></body></html>
